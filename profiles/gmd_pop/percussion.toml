# Batterie du profil `gmd_pop` (phase 019, B8) : GÉNÉRÉ par `specs/019-bibliotheque-accompagnements/b8/generer.py`
# (`gmd_batterie.py`) depuis le Groove MIDI Dataset v1.0.0 (Google LLC, CC BY 4.0 ; Gillick, Roberts, Engel, Eck,
# Bamman, ICML 2019) : styles pop, pop/soft, pop/groove7, 4/4 droit, 14 fichiers `beat`, 294 mesures,
# 4 batteur(s) ; 10 fichiers `fill`. Aucune mesure d'un enregistrement n'est copiée.
# Un pattern = un groupe de mesures de même geste de timekeeper (mêmes pas exactement, ou même figure nette) ;
# chaque coup est un (rôle, pas) dont la probabilité par pas dans le groupe atteint le seuil de la densité
# (0 : timekeeper ≥ 0,5 ; 1 : + charleston pédale et ouverte, grosse caisse, caisse claire, cross-stick ≥ 0,5 ;
# 2 : grosse caisse, caisse claire, cross-stick dès 0,25, charleston ouverte dès 0,35, crash ≥ 0,5). Poids = effectif
# de mesures du groupe. `delta_velocity` = accent relatif du groupe sur le niveau de rendu de la voix
# (vélocités du TD-11 non transposées, réglage de service). Étiquettes : `hat` charleston fermée, `ride`,
# `open` charleston ouverte (le timekeeper du groupe), nommées par `arc.toml`.
# `[[phrases]]` : suites de groupes de 2 ou 4 mesures vues dans plusieurs fichiers du corpus (mesurées : suites de groupes vues ≥ 3 fois (≥ 2 si la suite change de groupe) dans ≥ 2 fichiers ; 15 phrases de groove tenu 4 mesures ajoutées pour les groupes sans suite mesurée (règle de métier)).
# `[[fills]]` : relances de 1 ou 2 mesures, groupées par longueur et pas de départ, moyenne seuillée des fichiers `fill`
# (au moins 2 fichiers sur 3 d'accord dans un petit groupe, 0,25 au-delà) ; `fills_none_weight` : valeur de service.

