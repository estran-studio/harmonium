# Profil `gmd_pop` (phase 019, B8) : accompagnement pop sous une grille.
#
# Le nom est celui de la source qui définit le style (principe VII) : la famille `pop` du Groove MIDI Dataset v1.0.0 (`pop` : 8 fichiers, 174 mesures, « juste » ; `pop/soft` et `pop/groove7` : « juste » chacun ; L2 § 4.2). Les trois sous-styles du GMD sont réunis parce que L2 leur donne chacun « juste » et que le GMD les range sous la même famille.
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : la basse (motifs), les accords
# (rythmes de comping, phrases) et la batterie (patterns, phrases, relances) ne dépendent que de l'accord
# publié et de la graine. Les deux parties par défaut (A et B de 8 mesures, quatre grilles chacune), quand
# l'utilisateur n'en fournit pas, sont des progressions d'accords de forme commune écrites pour ce profil
# (voir README, provenance et droits). Tonalité verrouillée (sol ionien) : la grille s'écrit relative.
#
# Ce qui vient de la source : la batterie, le tempo et le feel (`percussion.toml` est GÉNÉRÉ par
# `specs/019-bibliotheque-accompagnements/b8/generer.py`). Ce qui n'en vient pas, DIT ICI : la basse, le comping
# et les grilles sont des règles de métier (aucune mesure de basse ni de voicings pour ce style), le mixage et
# l'arc sont des réglages de service. L'habillage par graine (A2) n'existe pas encore : le tempo, les
# instruments et la tonalité sont fixes ; la variété vient des boucles de grille, de l'arc, des phrases et
# relances, des motifs de basse et des patterns de batterie.
#
# Aucune mélodie : la piste `Melody` est absente de l'arrangement.

[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
arc = "arc.toml"

[meta]
id = "gmd_pop"
name = "Accompagnement pop (Groove MIDI Dataset, famille pop)"
tradition = "Groove MIDI Dataset v1.0.0, famille pop (pop, pop/soft, pop/groove7), 4/4 droit : 14 fichiers de batterie, 4 batteurs ; basse et piano : règles de métier"
tags = ["pop", "accompagnement", "grille"]
aliases = ["pop"]
corpus = """\
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; dix batteurs, kit électronique Roland TD-11. Seuls des agrégats entrent dans le profil (probabilités par pas d'un groupe de mesures, suites de groupes, moyennes de relances, plage de tempo) : aucune mesure d'un enregistrement n'est copiée. Basse, comping et grilles : règles de métier et formes communes écrites pour ce profil (aucune source mesurée de basse ni de voicings pour ce style : voir README). Manifeste et mesures : harmonium_lab corpus/gmd, references/gmd-*."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# GMD : feel droit (rapport médian 0,50) dans tous les fichiers retenus.
default_swing_ratio = 0.5
# tempo des 14 fichiers `beat` du GMD (BPM du nom de fichier) : centile 10 = 83, médiane = 135, centile 90 = 142.
default_bpm = 135.0
min_bpm = 83.0
max_bpm = 142.0

[fixed_tonality]
key = 7
mode = "ionian"

[form]
sequence = [0, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

# Pas de mélodie jouée : mêmes réglages neutres que `wjazzd_swing`.
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 7, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4

# Couplet (huit mesures) : quatre grilles de forme commune.
[harmony.parts.A]
kind = "chord_loop"
loops = [
  # I V vi IV (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
  ] },
  # vi IV I V (deux fois)
  { weight = 2, chords = [
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
  # I vi IV V (deux fois)
  { weight = 2, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
  # I IV vi V (deux fois)
  { weight = 1, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
]

# Refrain (huit mesures) : quatre grilles.
[harmony.parts.B]
kind = "chord_loop"
loops = [
  # IV I V vi (deux fois)
  { weight = 3, chords = [
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
  ] },
  # IV V iii vi IV V I I
  { weight = 2, chords = [
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 4, quality = "m", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
  ] },
  # vi V IV I (deux fois)
  { weight = 2, chords = [
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
  ] },
  # I V IV IV I V vi V
  { weight = 1, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 28
high = 39
motifs = [
  # 0 : noires à la fondamentale
  { bars = 1, weight = 4, reference = "chord_root", notes = [{ step = 0, duration = 4, semitones = 0, velocity = 96 }, { step = 4, duration = 4, semitones = 0, velocity = 88 }, { step = 8, duration = 4, semitones = 0, velocity = 92 }, { step = 12, duration = 4, semitones = 0, velocity = 88 }] },
  # 1 : syncopé : anticipation du temps 3 et du temps 1 suivant
  { bars = 1, weight = 4, reference = "chord_root", notes = [{ step = 0, duration = 6, semitones = 0, velocity = 98 }, { step = 6, duration = 2, semitones = 0, velocity = 86 }, { step = 8, duration = 4, semitones = 0, velocity = 94 }, { step = 12, duration = 2, semitones = 7, velocity = 86 }, { step = 14, duration = 2, semitones = 0, velocity = 84 }] },
  # 2 : croches à la fondamentale
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 98 }, { step = 2, duration = 2, semitones = 0, velocity = 82 }, { step = 4, duration = 2, semitones = 0, velocity = 90 }, { step = 6, duration = 2, semitones = 0, velocity = 82 }, { step = 8, duration = 2, semitones = 0, velocity = 94 }, { step = 10, duration = 2, semitones = 0, velocity = 82 }, { step = 12, duration = 2, semitones = 0, velocity = 90 }, { step = 14, duration = 2, semitones = 0, velocity = 82 }] },
  # 3 : blanches (couplet calme)
  { bars = 1, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 8, semitones = 0, velocity = 94 }, { step = 8, duration = 8, semitones = 0, velocity = 90 }] },
  # 4 : octaves en croches (refrain porté)
  { bars = 1, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 98 }, { step = 2, duration = 2, semitones = 12, velocity = 80 }, { step = 4, duration = 2, semitones = 0, velocity = 90 }, { step = 6, duration = 2, semitones = 12, velocity = 80 }, { step = 8, duration = 2, semitones = 0, velocity = 94 }, { step = 10, duration = 2, semitones = 12, velocity = 80 }, { step = 12, duration = 2, semitones = 0, velocity = 90 }, { step = 14, duration = 2, semitones = 12, velocity = 80 }] },
  # 5 : deux mesures : syncopé, puis noires, quinte et octave pour relancer
  { bars = 2, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 6, semitones = 0, velocity = 98 }, { step = 6, duration = 2, semitones = 0, velocity = 86 }, { step = 8, duration = 6, semitones = 0, velocity = 94 }, { step = 14, duration = 2, semitones = 7, velocity = 84 }, { step = 16, duration = 4, semitones = 0, velocity = 96 }, { step = 20, duration = 4, semitones = 0, velocity = 88 }, { step = 24, duration = 4, semitones = 0, velocity = 94 }, { step = 28, duration = 2, semitones = 7, velocity = 86 }, { step = 30, duration = 2, semitones = 12, velocity = 84 }] },
]

# Gabarit : noires, relance vers la fondamentale de l'accord suivant (pickup en croche avant le changement).
[[accompaniment.bass.templates]]
weight = 3
bars = 1
rhythm = [{ step = 0, duration = 4, velocity = 96 }, { step = 4, duration = 4, velocity = 88 }, { step = 8, duration = 4, velocity = 92 }, { step = 12, duration = 2, velocity = 88 }]
cycle = [{ degree = "root" }]
pickup = { lead = 2, duration = 2, velocity = 86, degree = "root" }

[accompaniment.chords]
center = 62
max_drift = 6
default_pattern = 0
voicing = "close_triad"
low = 52
high = 76
patterns = [{ hits = [{ step = 0, duration = 8, velocity = 74 }, { step = 8, duration = 8, velocity = 70 }] }]
comping = [
  # 0 sparse : accord tenu
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 16, velocity = 72 }] },
  # 1 sparse : deux blanches
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 8, velocity = 74 }, { step = 8, duration = 8, velocity = 68 }] },
  # 2 sparse : silence
  { weight = 1, tag = "sparse", hits = [] },
  # 3 medium : noires
  { weight = 4, tag = "medium", hits = [{ step = 0, duration = 4, velocity = 78 }, { step = 4, duration = 4, velocity = 70 }, { step = 8, duration = 4, velocity = 76 }, { step = 12, duration = 4, velocity = 70 }] },
  # 4 medium : syncopé, anticipation de l'accord suivant
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 6, velocity = 78 }, { step = 6, duration = 2, velocity = 68 }, { step = 8, duration = 4, velocity = 74 }, { step = 14, duration = 2, velocity = 72, anticipate = true }] },
  # 5 medium : x..x.x.x
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 4, velocity = 78 }, { step = 6, duration = 2, velocity = 70 }, { step = 10, duration = 2, velocity = 72 }, { step = 14, duration = 2, velocity = 70 }] },
  # 6 dense : croches
  { weight = 4, tag = "dense", hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 2, duration = 2, velocity = 66 }, { step = 4, duration = 2, velocity = 74 }, { step = 6, duration = 2, velocity = 66 }, { step = 8, duration = 2, velocity = 78 }, { step = 10, duration = 2, velocity = 66 }, { step = 12, duration = 2, velocity = 74 }, { step = 14, duration = 2, velocity = 66 }] },
  # 7 dense : temps 1 puis croches en contretemps
  { weight = 3, tag = "dense", hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 2, duration = 2, velocity = 72 }, { step = 6, duration = 2, velocity = 74 }, { step = 10, duration = 2, velocity = 72 }, { step = 14, duration = 2, velocity = 74 }] },
]

[[accompaniment.chords.phrases]]
weight = 3
tag = "sparse"
motifs = [0, 1, 0, 1]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [1, 1]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [0, 0, 0, 2]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
at = "part_end"
motifs = [1, 0]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [3, 3, 4, 3]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [3, 5, 3, 4]

[[accompaniment.chords.phrases]]
weight = 2
tag = "medium"
motifs = [3, 4]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
at = "part_end"
motifs = [3, 4]

[[accompaniment.chords.phrases]]
weight = 3
tag = "dense"
motifs = [6, 6, 6, 7]

[[accompaniment.chords.phrases]]
weight = 2
tag = "dense"
motifs = [6, 7, 6, 7]

[[accompaniment.chords.phrases]]
weight = 2
tag = "dense"
motifs = [6, 7]

[[accompaniment.chords.phrases]]
weight = 3
tag = "dense"
at = "part_end"
motifs = [6, 4]

[instruments]
