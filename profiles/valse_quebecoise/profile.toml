[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"

[meta]
id = "valse_quebecoise"
name = "Valse québécoise"
tradition = "Québec / Canada français, répertoire traditionnel de violon"
tags = ["valse", "waltz", "quebec", "violon"]
corpus = "harmonium_lab: corpus 2026-10-19+764, 67 valses; provenance dans le manifeste du labo"
aliases = ["valse", "waltz"]

[meter]
time_signature = { numerator = 3, denominator = 4 }
steps_per_bar = 12
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 3
default_swing_ratio = 0.5
default_bpm = 145.0
min_bpm = 140.0
max_bpm = 150.0

[form]
sequence = [0, 0, 1, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "CadHalf", { CopyOf = 1 }, { CopyOf = 2 }, "Free", "CadFull"]
[[form.parts]]
name = "B"
melody_center_offset = 2
roles = ["Open", "Free", "Free", "CadHalf", { CopyOf = 1 }, { CopyOf = 2 }, "Free", "CadFull"]

[melody]
cell_units = 6
strong_units = [0, 2, 4]
weak_units = [1, 3, 5]
key_modes = [
 { key = 2, mode = "ionian", weight = 3 },
 { key = 7, mode = "ionian", weight = 3 },
 { key = 9, mode = "ionian", weight = 2 },
 { key = 9, mode = "mixolydian", weight = 1 },
 { key = 2, mode = "mixolydian", weight = 1 },
]
[melody.params]
weight_role_run = 4
weight_role_arp = 3
weight_role_turn = 3
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 71
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 94
strong_eighth_velocity_offset = 12
even_eighth_velocity_offset = -10

[harmony]
model = "trad_functional"
steps_per_chord = 12
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="VI",quality="Minor"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 4, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]
bass_steps = [0]
bass_duration_steps = 4
bass_velocity = 78
bass_low = 40
bass_high = 50
chop_steps = [4, 8]
chop_duration_steps = 2
chop_velocity = 72
guitar_center = 60
guitar_max_drift = 6

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0
