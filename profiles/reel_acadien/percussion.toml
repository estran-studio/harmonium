# Table de podorythmie pour le reel acadien en 2/2 (16 pas) (Constitution V et VII).
#
# Pratique vivante de la podorythmie acadienne (Nouveau-Brunswick, Île-du-Prince-Édouard,
# Chéticamp / Cap-Breton, Îles-de-la-Madeleine), assise sur une chaise au violon.
#
# Densité 0 : talon uniquement (pas 0, 8 — pulse de blanche).
# Densité 1 : talon (0, 4, 8, 12) + pointe (2, 6, 10, 14).
# Densité 2 : talon (0, 4, 8, 12) + pointe doublée (2, 3, 6, 7, 10, 11, 14, 15),
#             les pas impairs de pointe ayant un delta de vélocité de -20.
#
# Sons : avec `harmonium_trad.sf2` (banque de pieds, SK2) : talon = touche 36,
# pointe = touche 37, canal 9 kit GM en secours.

low_note = 36
high_note = 37
low_velocity = 55
high_velocity = 45
percussion_gain = 0.9
velocity_humanize = 12

[[patterns]]
density = 0
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 8, track = "PercussionLow" },
]

[[patterns]]
density = 1
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 2, track = "PercussionHigh" },
  { step = 4, track = "PercussionLow" },
  { step = 6, track = "PercussionHigh" },
  { step = 8, track = "PercussionLow" },
  { step = 10, track = "PercussionHigh" },
  { step = 12, track = "PercussionLow" },
  { step = 14, track = "PercussionHigh" },
]

[[patterns]]
density = 2
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 2, track = "PercussionHigh" },
  { step = 3, track = "PercussionHigh", delta_velocity = -20 },
  { step = 4, track = "PercussionLow" },
  { step = 6, track = "PercussionHigh" },
  { step = 7, track = "PercussionHigh", delta_velocity = -20 },
  { step = 8, track = "PercussionLow" },
  { step = 10, track = "PercussionHigh" },
  { step = 11, track = "PercussionHigh", delta_velocity = -20 },
  { step = 12, track = "PercussionLow" },
  { step = 14, track = "PercussionHigh" },
  { step = 15, track = "PercussionHigh", delta_velocity = -20 },
]
