[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"

[meta]
id = "reel_acadien"
name = "Reel acadien"
tradition = "Acadie / Maritimes (Nouveau-Brunswick, Île-du-Prince-Édouard, Cap-Breton / Chéticamp, Îles-de-la-Madeleine), répertoire traditionnel de violon et podorythmie"
tags = ["reel", "acadien", "acadie", "maritimes", "violon", "podorythmie"]
corpus = "harmonium_lab: corpus acadienne (2026-10-22+270, 169 reels; The Session ODbL 168 reels, John Chambers Canada 2 reels); provenance dans corpus/sources.md"

[meter]
time_signature = { numerator = 2, denominator = 2 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 8
pulses_per_bar = 2
default_swing_ratio = 0.56
default_bpm = 228.0
min_bpm = 215.0
max_bpm = 238.0

[form]
sequence = [0, 0, 1, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "CadHalf", { CopyOf = 1 }, { CopyOf = 2 }, "Free", "CadFull"]
[[form.parts]]
name = "B"
melody_center_offset = 3
roles = ["Open", "Free", "Free", "CadHalf", { CopyOf = 1 }, { CopyOf = 2 }, "Free", "CadFull"]

[melody]
cell_units = 8
strong_units = [0, 4]
weak_units = [1, 3, 5, 7]
key_modes = [
 { key = 9, mode = "ionian", weight = 4 },
 { key = 2, mode = "ionian", weight = 4 },
 { key = 7, mode = "ionian", weight = 3 },
 { key = 9, mode = "dorian", weight = 2 },
 { key = 9, mode = "mixolydian", weight = 1 },
 { key = 4, mode = "dorian", weight = 1 },
]
[melody.params]
weight_role_run = 3
weight_role_arp = 5
weight_role_turn = 3
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 71
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 94
strong_eighth_velocity_offset = 12
even_eighth_velocity_offset = -10

[harmony]
model = "trad_functional"
steps_per_chord = 8
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="VI",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "BVII", "IV"]
bass_steps = [0, 8]
bass_duration_steps = 4
bass_velocity = 78
bass_low = 40
bass_high = 50
chop_steps = [4, 12]
chop_duration_steps = 1
chop_velocity = 72
guitar_center = 60
guitar_max_drift = 6

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0
