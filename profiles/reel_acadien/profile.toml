[melody]
cell_units = 8
strong_units = [0, 4]
weak_units = [1, 3, 5, 7]
key_modes = [
 { key = 9, mode = "ionian", weight = 4 },
 { key = 2, mode = "ionian", weight = 4 },
 { key = 7, mode = "ionian", weight = 3 },
 { key = 9, mode = "dorian", weight = 2 },
 { key = 9, mode = "mixolydian", weight = 1 },
 { key = 4, mode = "dorian", weight = 1 },
]
[melody.params]
