# Pilotage par les quatre émotions. Aucune mesure de corpus ne relie une émotion à un paramètre
# du jeu : les courbes sont des réglages de service (README du profil).
# Arousal : le tempo (± 8 BPM autour de 125, dans la plage 72..134), la vélocité et la densité de la
# batterie (0 : timekeeper seul ; 1, neutre : tous les rôles à 0,5 ; 2 : notes fantômes, grosse caisse et caisse claire
# supplémentaires, crash).
# Vélocités par piste élargies (0,6 à 1,3) : l'arc (`arc.toml`) multiplie l'intensité (0,35 à 0,65 au neutre) et
# l'écart entre l'exposition, le sommet et la retombée doit s'entendre (réglage de service, aucune mesure).
# Tonalité : tirée par la variante de session (`session.toml`) ; les seuils de bascule parallèle sont écartés de la
# valence neutre (0,3) pour que le mode tiré ne bascule pas de lui-même.
