[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"

[meta]
id = "hornpipe_britannique_coloniale"
name = "Hornpipe britannique colonial"
tradition = "Musique britannique coloniale, régiments et ports d'Amérique du Nord, c. 1760–1840"
tags = ["hornpipe", "britannique", "coloniale", "violon", "1837", "garnison", "danse"]
corpus = "Nottingham Music Database, John Chambers AmRev, Cahusac 1809 (78 airs de hornpipe du corpus bascanada/harmonium_lab)"
aliases = ["hornpipe"]

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.65
default_bpm = 92.0
min_bpm = 80.0
max_bpm = 104.0

[form]
sequence = [0, 0, 1, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = [
  "Open",
  { choose = [{ role = { SequenceOf = { bar = 1, shift = [{ degrees = 1, weight = 2 }, { degrees = -4, weight = 1 }, { degrees = 2, weight = 1 }] } }, weight = 678 }, { role = { VariedEndOf = 1 }, weight = 678 }, { role = "Free", weight = 8644 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 508 }, { role = { SequenceOf = { bar = 1, shift = [{ degrees = -1, weight = 4 }, { degrees = -3, weight = 1 }, { degrees = 2, weight = 1 }] } }, weight = 1017 }, { role = { VariedEndOf = 1 }, weight = 169 }, { role = "Free", weight = 8306 }] },
  { choose = [{ role = "CadHalf", weight = 1864 }, { role = "CadOpen", weight = 8136 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 8475 }, { role = { VariedEndOf = 1 }, weight = 339 }, { role = "Free", weight = 1186 }] },
  { choose = [{ role = { CopyOf = 2 }, weight = 7458 }, { role = { VariedEndOf = 2 }, weight = 847 }, { role = "Free", weight = 1695 }] },
  { choose = [{ role = { CopyOf = 3 }, weight = 2034 }, { role = { VariedEndOf = 3 }, weight = 2542 }, { role = "Free", weight = 5424 }] },
  { choose = [{ role = "CadTonic", weight = 678 }, { role = "CadHalf", weight = 2712 }, { role = "CadOpen", weight = 6610 }] },
]
second_ending = { choose = [{ role = "CadTonic", weight = 45 }, { role = "CadFifth", weight = 3 }, { role = "CadOther", weight = 3 }] }
[[form.parts]]
name = "B"
melody_center_offset = 1
roles = [
  "Open",
  { choose = [{ role = { CopyOf = 1 }, weight = 847 }, { role = { SequenceOf = { bar = 1, shift = [{ degrees = 1, weight = 3 }] } }, weight = 508 }, { role = { VariedEndOf = 1 }, weight = 1017 }, { role = "Free", weight = 7628 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 1695 }, { role = { SequenceOf = { bar = 1, shift = [{ degrees = -1, weight = 2 }, { degrees = -4, weight = 1 }, { degrees = 1, weight = 1 }] } }, weight = 678 }, { role = { VariedEndOf = 1 }, weight = 1356 }, { role = "Free", weight = 6271 }] },
  { choose = [{ role = "CadTonic", weight = 508 }, { role = "CadHalf", weight = 1864 }, { role = "CadOpen", weight = 7628 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 4407 }, { role = { SequenceOf = { bar = 1, shift = [{ degrees = -4, weight = 1 }] } }, weight = 169 }, { role = "Free", weight = 5424 }] },
  { choose = [{ role = { CopyOf = 2 }, weight = 2881 }, { role = { SequenceOf = { bar = 2, shift = [{ degrees = 1, weight = 1 }] } }, weight = 169 }, { role = { VariedEndOf = 2 }, weight = 1695 }, { role = "Free", weight = 5255 }] },
  { choose = [{ role = { CopyOf = 3 }, weight = 393 }, { role = { VariedEndOf = 3 }, weight = 589 }, { role = { CopyOfPart = { part = "A", bar = 7 } }, weight = 4211 }, { role = "Free", weight = 4807 }] },
  { choose = [{ role = "CadTonic", weight = 847 }, { role = "CadHalf", weight = 1525 }, { role = "CadOpen", weight = 7628 }] },
]
second_ending = { choose = [{ role = "CadTonic", weight = 11 }, { role = "CadOther", weight = 1 }] }

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [
  { key = 7, mode = "ionian", weight = 8 },
  { key = 2, mode = "ionian", weight = 7 },
  { key = 9, mode = "ionian", weight = 3 },
  { key = 4, mode = "aeolian", weight = 1 },
  { key = 9, mode = "aeolian", weight = 1 },
]

[melody.params]
weight_role_run = 3
weight_role_arp = 5
weight_role_turn = 2
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 72
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 92
strong_eighth_velocity_offset = 12
even_eighth_velocity_offset = -8

[harmony]
model = "trad_functional"
steps_per_chord = 16
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="II",quality="Minor"}, {degree="VI",quality="Minor"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV", "II"]
bass_steps = [0, 8]
bass_duration_steps = 4
bass_velocity = 70
bass_low = 40
bass_high = 50
chop_steps = [0, 8]
chop_duration_steps = 4
chop_velocity = 60
guitar_center = 60
guitar_max_drift = 6

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0
