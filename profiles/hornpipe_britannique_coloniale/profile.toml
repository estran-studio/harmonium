[[performance.tracks.Melody.rules]]
articulation = "Normal"
weight = 100.0
# Accent métrique proposé (aucune marque accent/marcato dans ce corpus).
[[performance.tracks.Melody.rules]]
articulation = "Accent"
weight = 4.0
steps = [0, 4, 8, 12]
accent = 2.0
[performance.tracks.Melody.emotions]
tension_advance = 0.04
tension_detach = 0.10
arousal_accent = 4.0
valence_velocity = 0.0
density_detach = 0.0

# Ornements idiomatiques (V3b). Taux : plancher écrit du corpus, références/ornaments/britannique_coloniale-hornpipe.json
