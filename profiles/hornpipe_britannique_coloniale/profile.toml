[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [
  { key = 7, mode = "ionian", weight = 8 },
  { key = 2, mode = "ionian", weight = 7 },
  { key = 9, mode = "ionian", weight = 3 },
  { key = 4, mode = "aeolian", weight = 1 },
  { key = 9, mode = "aeolian", weight = 1 },
]

[melody.params]
weight_role_run = 3
weight_role_arp = 5
weight_role_turn = 2
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 72
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 92
strong_eighth_velocity_offset = 12
even_eighth_velocity_offset = -8

[harmony]
model = "trad_functional"
steps_per_chord = 16
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="II",quality="Minor"}, {degree="VI",quality="Minor"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]
[[harmony.candidates]]
mode = "phrygian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Major"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]
[[harmony.candidates]]
mode = "harmonic_minor"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV", "II"]

[accompaniment.bass]
low = 40
high = 50
walk_low = 38
walk_high = 52
hits = [
  { step = 0, degree = "root", duration = 4, velocity = 70 },
  { step = 8, degree = "fifth_if_held", duration = 4, velocity = 70 },
]

[accompaniment.bass.passing]
none_weight = 10
density = [[0.0, 0.0], [0.5, 0.6], [1.0, 1.0]]
phrase = [[0.0, 0.7], [0.75, 1.0], [1.0, 1.3]]
avoid_melody_intervals = [1, 6, 11]
arousal_low_multiplier = 0.5
arousal_high_multiplier = 1.5
rules = [
  { when = "next_target_differs", before = [4], motion = "scale_step", weight = 3, duration = 2, velocity_delta = -12, min_leap = 0 },
  { when = "next_target_differs", before = [4, 2], motion = "scale_walk", weight = 2, duration = 1, velocity_delta = -12, min_leap = 5 },
  { when = "next_target_differs", before = [2], motion = "chromatic", weight = 1, duration = 2, velocity_delta = -12, min_leap = 0 },
]

[accompaniment.chords]
center = 60
max_drift = 6
strings = 4
default_pattern = 1
patterns = [
  { hits = [{ step = 0, stroke = "down", duration = 4, velocity = 60 }] },
  { hits = [{ step = 0, stroke = "down", duration = 4, velocity = 60 }, { step = 8, stroke = "down", duration = 4, velocity = 60 }] },
  { hits = [{ step = 0, stroke = "down", duration = 4, velocity = 60 }, { step = 4, stroke = "down", duration = 4, velocity = 54 }, { step = 8, stroke = "down", duration = 4, velocity = 60 }, { step = 12, stroke = "up", duration = 4, velocity = 48, probability = 0.1 }] },
]

[accompaniment.chords.strum]
down_gap_ms = 10.0
up_gap_ms = 7.0
up_strings = 3
gap_jitter = 0.3
anchor = 0.5
tempo_exponent = 0.0
ref_bpm = 92.0
max_spread_ratio = 0.4
velocity_slope = 4
velocity_jitter = 5

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0

