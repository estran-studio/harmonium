# Arc « orchestre » : exposition aux balais (kit 40), sommet aux cuivres (comping 61) ; un chorus qui ne déclare pas de
# programme rend ceux de la session. Mêmes étiquettes que l'arc par défaut.
[arcs.orchestre]
repeat_from = 1

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { weight = 3, intensity = 0.65, density = 0.65, instruments = { percussion_program = 40 }, comping = [{ tag = "sparse" }], percussion = [{ tag = "sparse" }] },
  { weight = 1, intensity = 0.75, density = 0.75, instruments = { percussion_program = 40 }, comping = [{ tag = "sparse", weight = 1 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "sparse" }] },
]

[[arcs.orchestre.stages]]
choruses = 2
variants = [
  { weight = 2, comping = [{ tag = "medium" }], percussion = [{ tag = "medium" }], breaks = [{ start = 9, bars = 1, chance = 0.4, tracks = ["Chords"] }] },
  { weight = 1, intensity = 1.1, density = 1.1, comping = [{ tag = "medium", weight = 1 }, { tag = "dense", weight = 1 }], percussion = [{ tag = "medium" }], breaks = [{ start = -1, bars = 1, chance = 0.5, tracks = ["Chords", "Bass"] }] },
]

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { intensity = 1.3, density = 1.25, instruments = { chords_program = 61 }, comping = [{ tag = "dense" }], percussion = [{ tag = "dense" }], breaks = [{ start = -2, bars = 2, chance = 0.5, tracks = ["Chords", "Bass"], keep_steps = [0] }] },
]

[[arcs.orchestre.fall]]
instruments = { percussion_program = 40 }
intensity = 0.6
density = 0.6
comping = [{ tag = "sparse" }]
percussion = [{ tag = "sparse" }]
breaks = [{ start = -2, bars = 2, tracks = ["Chords", "Bass"], keep_steps = [0] }]
