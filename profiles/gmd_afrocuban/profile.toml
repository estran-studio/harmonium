percussion_program = 0

[ornaments]
rate_scale = 0.0

# Micro-timing du kit : médiane du décalage à la grille de chaque rôle dans le GMD afrocuban droit (pas ; sur le temps
# et hors du temps), neutre au-delà de ±0,2 (borne de l'A6). Les voix latines ne sont pas mesurées : aucun décalage.
[performance.tracks.PercussionLow]
voices = [{ note = 36, off_beat = -0.175 }]
[performance.tracks.PercussionHigh]
voices = [{ note = 44, on_beat = -0.175 }, { note = 51, off_beat = -0.175, on_beat = -0.108 }, { note = 38, off_beat = -0.167, on_beat = -0.175 }, { note = 50, off_beat = -0.133, on_beat = -0.042 }, { note = 37, off_beat = -0.158, on_beat = -0.108 }]
[performance.tracks.Bass]
jitter = 0.04
[performance.tracks.Chords]
jitter = 0.05

