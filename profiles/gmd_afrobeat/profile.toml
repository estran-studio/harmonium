tag = "sparse"
at = "part_end"
motifs = [1, 0]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [3, 3, 4, 3]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [3, 5, 3, 4]

[[accompaniment.chords.phrases]]
weight = 2
tag = "medium"
motifs = [3, 4]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
at = "part_end"
motifs = [3, 5]

[[accompaniment.chords.phrases]]
weight = 3
tag = "dense"
motifs = [6, 6, 6, 7]

[[accompaniment.chords.phrases]]
weight = 2
tag = "dense"
motifs = [7, 6, 7, 6]

[[accompaniment.chords.phrases]]
weight = 2
tag = "dense"
motifs = [6, 7]

[[accompaniment.chords.phrases]]
