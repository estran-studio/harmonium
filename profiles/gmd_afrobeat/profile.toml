# Profil `gmd_afrobeat` (phase 019, B8) : accompagnement afrobeat sous une grille.
#
# Le nom est celui de la source qui définit le style (principe VII) : le style `afrobeat` du Groove MIDI Dataset v1.0.0 (13 fichiers `beat`, 982 mesures, 4/4 droit, « juste », L2 § 4.2 ; aucun fichier `fill`).
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : la basse (motifs), les accords
# (rythmes de comping, phrases) et la batterie (patterns, phrases, relances) ne dépendent que de l'accord
# publié et de la graine. Les deux parties par défaut (A et B de 8 mesures, quatre grilles chacune), quand
# l'utilisateur n'en fournit pas, sont des progressions d'accords de forme commune écrites pour ce profil
# (voir README, provenance et droits). Tonalité verrouillée (ré dorien) : la grille s'écrit relative.
#
# Ce qui vient de la source : la batterie, le tempo et le feel (`percussion.toml` est GÉNÉRÉ par
# `specs/019-bibliotheque-accompagnements/b8/generer.py`). Ce qui n'en vient pas, DIT ICI : la basse, le comping
# et les grilles sont des règles de métier (aucune mesure de basse ni de voicings pour ce style), le mixage et
# l'arc sont des réglages de service. L'habillage par graine (A2) n'existe pas encore : le tempo, les
# instruments et la tonalité sont fixes ; la variété vient des boucles de grille, de l'arc, des phrases et
# relances, des motifs de basse et des patterns de batterie.
#
# Aucune mélodie : la piste `Melody` est absente de l'arrangement.

[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
arc = "arc.toml"

[meta]
id = "gmd_afrobeat"
name = "Accompagnement afrobeat (Groove MIDI Dataset, style afrobeat)"
tradition = "Groove MIDI Dataset v1.0.0, style afrobeat, 4/4 droit : 13 fichiers de batterie, 2 batteurs ; basse et guitare : règles de métier"
tags = ["afrobeat", "accompagnement", "grille"]
aliases = ["afrobeat"]
corpus = """\
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; dix batteurs, kit électronique Roland TD-11. Seuls des agrégats entrent dans le profil (probabilités par pas d'un groupe de mesures, suites de groupes, moyennes de relances, plage de tempo) : aucune mesure d'un enregistrement n'est copiée. Basse, comping et grilles : règles de métier et formes communes écrites pour ce profil (aucune source mesurée de basse ni de voicings pour ce style : voir README). Manifeste et mesures : harmonium_lab corpus/gmd, references/gmd-*."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# GMD : feel droit (rapport médian 0,50) dans tous les fichiers retenus.
default_swing_ratio = 0.5
# tempo des 13 fichiers `beat` du GMD (BPM du nom de fichier) : centile 10 = 86, médiane = 98, centile 90 = 113.
default_bpm = 98.0
min_bpm = 86.0
max_bpm = 113.0

[fixed_tonality]
key = 2
mode = "dorian"

[form]
sequence = [0, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

# Pas de mélodie jouée : mêmes réglages neutres que `wjazzd_swing`.
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 2, mode = "dorian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4

# Couplet (huit mesures) : boucles à un ou deux accords, longues (forme commune de l'afrobeat : vamp).
[harmony.parts.A]
kind = "chord_loop"
loops = [
  # i7 (quatre mesures) IV9 (quatre mesures)
  { weight = 3, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
  ] },
  # i7 i7 IV9 IV9 (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
  ] },
  # i9 (huit mesures)
  { weight = 2, chords = [
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
    { semitones = 0, quality = "m9", steps = 16 },
  ] },
  # i7 bVII9 (alternés) IV9 v7
  { weight = 1, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 7, quality = "m7", steps = 16 },
  ] },
]

# Refrain (huit mesures) : trois boucles.
[harmony.parts.B]
kind = "chord_loop"
loops = [
  # IV9 IV9 i7 i7 (deux fois)
  { weight = 3, chords = [
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
  ] },
  # bVII9 bVII9 IV9 IV9 i7 (quatre mesures)
  { weight = 2, chords = [
    { semitones = 10, quality = "9", steps = 16 },
    { semitones = 10, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
  ] },
  # i7 IV9 (alternés)
  { weight = 2, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "9", steps = 16 },
  ] },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 28
high = 39
motifs = [
  # 0 : deux mesures : ostinato syncopé en doubles croches
  { bars = 2, weight = 4, reference = "chord_root", notes = [{ step = 0, duration = 3, semitones = 0, velocity = 100 }, { step = 3, duration = 2, semitones = 0, velocity = 88 }, { step = 6, duration = 2, semitones = 7, velocity = 92 }, { step = 8, duration = 3, semitones = 0, velocity = 96 }, { step = 11, duration = 2, semitones = 10, velocity = 88 }, { step = 14, duration = 2, semitones = 7, velocity = 90 }, { step = 16, duration = 3, semitones = 0, velocity = 100 }, { step = 19, duration = 2, semitones = 0, velocity = 88 }, { step = 22, duration = 2, semitones = 7, velocity = 92 }, { step = 24, duration = 4, semitones = 10, velocity = 94 }, { step = 28, duration = 2, semitones = 7, velocity = 88 }, { step = 30, duration = 2, semitones = 0, velocity = 90 }] },
  # 1 : ostinato d'une mesure
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 3, semitones = 0, velocity = 100 }, { step = 3, duration = 3, semitones = 0, velocity = 90 }, { step = 6, duration = 2, semitones = 7, velocity = 90 }, { step = 8, duration = 4, semitones = 0, velocity = 96 }, { step = 12, duration = 2, semitones = 10, velocity = 88 }, { step = 14, duration = 2, semitones = 7, velocity = 88 }] },
  # 2 : deux mesures : plus posé
  { bars = 2, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 6, semitones = 0, velocity = 100 }, { step = 6, duration = 2, semitones = 0, velocity = 88 }, { step = 8, duration = 4, semitones = 7, velocity = 94 }, { step = 12, duration = 4, semitones = 0, velocity = 92 }, { step = 16, duration = 6, semitones = 0, velocity = 100 }, { step = 22, duration = 2, semitones = 10, velocity = 90 }, { step = 24, duration = 4, semitones = 7, velocity = 94 }, { step = 28, duration = 4, semitones = 0, velocity = 92 }] },
  # 3 : croches avec quinte et septième
  { bars = 1, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 100 }, { step = 2, duration = 2, semitones = 0, velocity = 86 }, { step = 4, duration = 2, semitones = 7, velocity = 92 }, { step = 6, duration = 2, semitones = 0, velocity = 86 }, { step = 8, duration = 2, semitones = 10, velocity = 94 }, { step = 10, duration = 2, semitones = 0, velocity = 86 }, { step = 12, duration = 2, semitones = 7, velocity = 92 }, { step = 14, duration = 2, semitones = 0, velocity = 86 }] },
  # 4 : note tenue
  { bars = 1, weight = 1, reference = "chord_root", notes = [{ step = 0, duration = 16, semitones = 0, velocity = 96 }] },
]

[accompaniment.chords]
center = 62
max_drift = 6
default_pattern = 0
voicing = "guide_tones"
low = 52
high = 76
patterns = [{ hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 6, duration = 2, velocity = 74 }, { step = 10, duration = 2, velocity = 78 }] }]
comping = [
  # 0 sparse : accord tenu
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 16, velocity = 70 }] },
  # 1 sparse : deux accords
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 6, velocity = 74 }, { step = 10, duration = 4, velocity = 70 }] },
  # 2 sparse : silence
  { weight = 1, tag = "sparse", hits = [] },
  # 3 medium : chicka syncopé
  { weight = 4, tag = "medium", hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 3, duration = 2, velocity = 70 }, { step = 6, duration = 2, velocity = 76 }, { step = 10, duration = 2, velocity = 78 }, { step = 13, duration = 2, velocity = 70 }] },
  # 4 medium : contretemps en croches
  { weight = 3, tag = "medium", hits = [{ step = 2, duration = 2, velocity = 74 }, { step = 6, duration = 2, velocity = 78 }, { step = 10, duration = 2, velocity = 74 }, { step = 14, duration = 2, velocity = 78 }] },
  # 5 medium : temps 1 et 3, anticipation
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 3, duration = 2, velocity = 72 }, { step = 8, duration = 2, velocity = 78 }, { step = 11, duration = 2, velocity = 70 }, { step = 14, duration = 2, velocity = 76, anticipate = true }] },
  # 6 dense : chicken-scratch en doubles croches
  { weight = 4, tag = "dense", hits = [{ step = 0, duration = 2, velocity = 82 }, { step = 2, duration = 1, velocity = 62 }, { step = 3, duration = 1, velocity = 72 }, { step = 6, duration = 2, velocity = 76 }, { step = 7, duration = 1, velocity = 62 }, { step = 10, duration = 2, velocity = 78 }, { step = 11, duration = 1, velocity = 64 }, { step = 13, duration = 1, velocity = 72 }, { step = 14, duration = 2, velocity = 76 }] },
  # 7 dense : doubles croches, trois trous
  { weight = 3, tag = "dense", hits = [{ step = 0, duration = 1, velocity = 76 }, { step = 2, duration = 1, velocity = 62 }, { step = 3, duration = 1, velocity = 76 }, { step = 4, duration = 1, velocity = 62 }, { step = 6, duration = 1, velocity = 76 }, { step = 7, duration = 1, velocity = 62 }, { step = 8, duration = 1, velocity = 62 }, { step = 10, duration = 1, velocity = 76 }, { step = 11, duration = 1, velocity = 62 }, { step = 12, duration = 1, velocity = 62 }, { step = 13, duration = 1, velocity = 76 }, { step = 14, duration = 1, velocity = 62 }, { step = 15, duration = 1, velocity = 62 }] },
]

[[accompaniment.chords.phrases]]
weight = 3
tag = "sparse"
motifs = [0, 1, 0, 1]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [1, 1]

[[accompaniment.chords.phrases]]
