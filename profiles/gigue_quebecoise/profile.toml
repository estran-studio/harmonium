[melody]
cell_units = 6
strong_units = [0, 3]
weak_units = [1, 2, 4, 5]
key_modes = [
 { key = 2, mode = "ionian", weight = 3 },
 { key = 7, mode = "ionian", weight = 3 },
 { key = 9, mode = "ionian", weight = 2 },
 { key = 9, mode = "mixolydian", weight = 1 },
 { key = 2, mode = "mixolydian", weight = 1 },
]
[melody.params]
weight_role_run = 4
weight_role_arp = 3
weight_role_turn = 3
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 71
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 94
strong_eighth_velocity_offset = 12
even_eighth_velocity_offset = -10

[harmony]
model = "trad_functional"
steps_per_chord = 12
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="VI",quality="Minor"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 6]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 40
high = 50
walk_low = 38
walk_high = 52
hits = [
  { step = 0, degree = "root", duration = 4, velocity = 78 },
  { step = 6, degree = "fifth_if_held", duration = 4, velocity = 78 },
]

[accompaniment.bass.passing]
none_weight = 4
density = [[0.0, 0.0], [0.5, 0.6], [1.0, 1.0]]
phrase = [[0.0, 0.7], [0.75, 1.0], [1.0, 1.3]]
avoid_melody_intervals = [1, 6, 11]
arousal_low_multiplier = 0.5
arousal_high_multiplier = 1.5
rules = [
  { when = "next_target_differs", before = [4], motion = "scale_step", weight = 3, duration = 2, velocity_delta = -12, min_leap = 0 },
  { when = "next_target_differs", before = [4, 2], motion = "scale_walk", weight = 2, duration = 1, velocity_delta = -12, min_leap = 5 },
  { when = "next_target_differs", before = [2], motion = "chromatic", weight = 1, duration = 2, velocity_delta = -12, min_leap = 0 },
]

[accompaniment.chords]
center = 60
max_drift = 6
default_pattern = 1
patterns = [
  { hits = [{ step = 4, duration = 1, velocity = 72 }] },
  { hits = [{ step = 4, duration = 1, velocity = 72 }, { step = 10, duration = 1, velocity = 72 }] },
  { hits = [{ step = 2, duration = 1, velocity = 72 }, { step = 4, duration = 1, velocity = 72 }, { step = 8, duration = 1, velocity = 72 }, { step = 10, duration = 1, velocity = 72 }] },
  { hits = [{ step = 0, duration = 1, velocity = 72 }, { step = 2, duration = 1, velocity = 72 }, { step = 4, duration = 1, velocity = 72 }, { step = 6, duration = 1, velocity = 72 }, { step = 8, duration = 1, velocity = 72 }, { step = 10, duration = 1, velocity = 72 }] },
]

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0

[mix]
master_db = 13.5
[mix.room]
room_size = 0.38
damping = 0.58
width = 0.7
level = 0.28
[mix.eq]
highpass_hz = 40.0
presence_hz = 2800.0
presence_db = 1.3
presence_q = 0.8
[mix.tracks.Melody]
level_db = 0.0
pan = 0.04
reverb_send = 0.16
[mix.tracks.Chords]
level_db = -5.0
pan = -0.35
reverb_send = 0.22
[mix.tracks.Bass]
level_db = -8.0
pan = 0.0
reverb_send = 0.08
[mix.tracks.Heel]
level_db = -6.0
pan = -0.06
reverb_send = 0.1
[mix.tracks.Toe]
level_db = -6.0
pan = 0.06
reverb_send = 0.1

