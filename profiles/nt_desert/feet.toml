# Batterie en groove (G7c, essais du propriétaire sur GeneralUser) : grosse
# caisse aux pas 0/8/20, caisse claire aux pas 2/10/14 (grille §6.2 de G0),
# charleston fermé (touche 42, portée par Toe) sur les pulsations seulement
# (pas 0/6/12/18, grille de 24 pas). Densité 0 : ossature clairsemée ;
# densité 1 : groove principal ; densité 2 : groove + relances (pas 16/22).
# Accents par temps dans les motifs : temps fort plein, autres temps ×0,8
# (pieds 92 → 74, 84 → 67). Le micro-timing et l'accent du temps fort vivent
# dans [performance.tracks.Heel] et [performance.tracks.Toe] du profile.toml.
heel_note = 36
toe_note = 38
heel_velocity = 92
toe_velocity = 84
feet_gain = 1.0
velocity_humanize = 4

[[patterns]]
density = 0
hits = [
  { step = 0, track = "Heel", delta_velocity = 0 },
  { step = 0, track = "Toe", note = 42, delta_velocity = 0 },
  { step = 12, track = "Toe", note = 42, delta_velocity = -17 },
]

[[patterns]]
density = 1
hits = [
  { step = 0, track = "Heel", delta_velocity = 0 },
