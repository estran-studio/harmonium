# Batterie en groove (G7c, essais du propriétaire sur GeneralUser) : grosse
# caisse aux pas 0/8/20, caisse claire aux pas 2/10/14 (grille §6.2 de G0).
# Densité 0 : ossature clairsemée ; densité 1 : groove principal ; densité 2 :
# groove + relances (pas 16/22). Accents par temps dans les motifs : temps
# fort plein, autres temps ×0,8 (pieds 92 → 74, 84 → 67). Le micro-timing et
# l'accent du temps fort vivent dans [performance.tracks.Heel] et
# [performance.tracks.Toe] du profile.toml.
#
# Charleston (G7d, touche 42, portée par Toe) : c'est le seul son de bruit du
# kit employé ; mesuré en rendu Odin, il porte à lui seul la bande 5–12 kHz du
# mix pendant les tenues. Il est donc réduit aux accents de temps : pas 0 et 12
# (temps 1 et 3) à la densité 1, les pulsations 6/18 ne reviennent qu'à la
# densité 2 (arousal haut) ; vélocités nettement sous celles de la caisse claire
# (84 → 64 au temps fort, 54 au temps 3, 52 aux pulsations de relance,
# 44 au coup de levée du pas 22).
# Aucune cymbale (crash 49, ride 51) n'est employée : le kit n'en joue pas.
heel_note = 36
toe_note = 38
heel_velocity = 92
toe_velocity = 84
feet_gain = 1.0
velocity_humanize = 4

[[patterns]]
density = 0
hits = [
  { step = 0, track = "Heel", delta_velocity = 0 },
  { step = 0, track = "Toe", note = 42, delta_velocity = -20 },
  { step = 12, track = "Toe", note = 42, delta_velocity = -30 },
]

[[patterns]]
density = 1
hits = [
  { step = 0, track = "Heel", delta_velocity = 0 },
  { step = 0, track = "Toe", note = 42, delta_velocity = -20 },
  { step = 2, track = "Toe", delta_velocity = -17 },
  { step = 8, track = "Heel", delta_velocity = -18 },
  { step = 10, track = "Toe", delta_velocity = -17 },
  { step = 12, track = "Toe", note = 42, delta_velocity = -30 },
  { step = 14, track = "Toe", delta_velocity = -17 },
  { step = 20, track = "Heel", delta_velocity = -18 },
]

[[patterns]]
density = 2
hits = [
  { step = 0, track = "Heel", delta_velocity = 0 },
  { step = 0, track = "Toe", note = 42, delta_velocity = -20 },
  { step = 2, track = "Toe", delta_velocity = -17 },
  { step = 6, track = "Toe", note = 42, delta_velocity = -32 },
  { step = 8, track = "Heel", delta_velocity = -18 },
  { step = 10, track = "Toe", delta_velocity = -17 },
  { step = 12, track = "Toe", note = 42, delta_velocity = -30 },
  { step = 14, track = "Toe", delta_velocity = -17 },
  { step = 16, track = "Heel", delta_velocity = -8 },
  { step = 18, track = "Toe", note = 42, delta_velocity = -32 },
  { step = 20, track = "Heel", delta_velocity = -18 },
  { step = 22, track = "Toe", delta_velocity = -8 },
  { step = 22, track = "Toe", note = 42, delta_velocity = -40 },
]

# Fills composés aux seules frontières phrase_ends (A1/A2/B, mesure 8).
# Le dernier temps descend les toms ; pas de cymbale brillante supplémentaire.
# À faible densité, une seule réponse grave ; au neutre, trois toms.
