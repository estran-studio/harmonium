  { step = 12, track = "Toe", note = 42, delta_velocity = -17 },
  { step = 14, track = "Toe", delta_velocity = -17 },
  { step = 18, track = "Toe", note = 42, delta_velocity = -17 },
  { step = 20, track = "Heel", delta_velocity = -18 },
]

