# Forme longue : boucle de jeu. Chaque air est son propre set d'un seul air
# de 48 mesures : intro complète (vide ici) et entrées rejouées à chaque air,
# raccord direct sans pause, pas d'outro (boucle sans fin pour le jeu).
length = [{ tunes = 1, weight = 1 }]

[key]
same = 1.0
parallel = 1.0
relative = 1.0
fifth_up = 1.0
fourth_up = 1.0
step_up = 1.0
step_down = 1.0
other = 1.0
last_dark = 1.0

[[transitions]]
kind = "direct"
weight = 100

[end]
outro = false
gap_bars = [{ bars = 0, weight = 1 }]

[ramp]
tempo_bpm = [[0.0, 0.0], [1.0, 0.0]]
intensity_lift = [[0.0, 0.0], [1.0, 0.0]]
gate = [[0.0, 0.0], [0.2, 1.0], [0.8, 1.0], [1.0, 0.0]]

[signature]
return_rate = 0.0
memory = 1
