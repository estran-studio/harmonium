# Pilotage par les 4 émotions. Neutre (0,5/0,3/0,5/0,5) : groove principal à
# 210 noires. Arousal : tempo et batterie. Density : couches (à 0,2 ne reste
# que la scie, façon bourdon de A Way). Tension : riff et contretemps, sans
# dominante substituée (boucle G2). Valence : phrygien sombre (G#, voire A
# façon A Way en bas) contre mixolydien plus clair en haut.
