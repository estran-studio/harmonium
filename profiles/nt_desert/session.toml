# Habillage par graine de `nt_desert` (phase 019, A2, R2-jeux vague 4) : un tirage par groupe, les groupes
# se combinent. Le jeu garde son identité : 12/8 ternaire (le swing de la grille ne change pas), phrygien
# sur la pédale, banque `assets/nt_desert.sf2` (programmes 38, 78, 81, 88, 89 et kit 128/0 seulement : aucun
# autre programme n'y est nommé), zones Odin existantes (Heel/Toe restent SoundFont). `SetBpm` de l'hôte
# gagne sur le tempo ; la tonalité est celle du premier air (le set d'un air : la session entière).
#
# Tempo : base de la courbe `tempo_offset` de `dynamics` (l'arousal s'y ajoute : ±30 BPM). Plage nominale
# 204–216 (la noire à 210 = 140 pointées de Fläshyn et de Crystallized Fear, références du labo) la plus
# lourde (4 sur 6) ; « pose » et « vif » restent dans 150..240, à plus de 8 BPM de la plage nominale
# et resserrés autour de la référence (le tempo pèse sur la distance audio au corpus).

# 210 = 140 noires pointées, Fläshyn (A) et Crystallized Fear (nt-niveaux.md).
[[variants]]
group = "tempo"
name = "nominal"
weight = 4
bpm = [204.0, 216.0]

# plus lourd, resserré sous la référence (la plage du jeu descend à 150) : même 12/8.
[[variants]]
group = "tempo"
name = "pose"
weight = 1
bpm = [180.0, 190.0]

# plus vif, resserré au-dessus de la référence (la plage du jeu monte à 240).
[[variants]]
group = "tempo"
name = "vif"
weight = 1
bpm = [226.0, 236.0]

# Tonalité : pas de groupe `tonalite`. Le niveau atteste G♯ phrygien (Fläshyn, pédale G♯, section B
# G/G♯) et, sur une autre piste, A phrygien (A Way, bourdon A) ; mais la distance symbolique au corpus
# est mesurée sur Fläshyn, dont la basse et les accords sont centrés sur G♯ : un air en A phrygien fait
# tomber l'histogramme de hauteurs de la basse de ~86 à ~18 (−68 points sur cette graine), bien au-delà
# de la perte de 1 point tolérée par couche. La tonalité reste donc celle du profil (G♯ phrygien, les
# bascules de mode restent celles de `dynamics.toml`) ; le bloc A phrygien est donné dans la note R2.

# Basse : scie 81 (nominale) ou « Saw Bass Hold » 38 (même recette, corps sinusoïdal, banque nt_desert.sf2).
# Odin : les mêmes quatre presets permutent entre les quatre zones, chacun emportant sa transposition et
# son `level_db` (niveaux appariés au défaut, RMS du solo de piste à ±0,5 dB) ; mêmes `when`, même ordre.
# Les conditions émotionnelles ne changent pas ; les permutations reprennent exclusivement
# les presets, niveaux et transpositions déjà présents dans ce profil.
[[variants]]
group = "basse"
name = "growly"
weight = 3
instruments = { bass_program = 81 }

[[variants]]
group = "basse"
name = "creuse"
weight = 2
instruments = { bass_program = 38 }

[[variants.odin.Bass.zones]]
when = { tension = [0.6, 1.0] }
preset = "Growly FM Bass [XR]"
transpose = 24
level_db = -3.0
morph = [
  { param = "fil1_freq", arousal = 3500.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
  { param = "fil1_env", arousal = 0.4 },
  { param = "env1_release", density = 0.3 }
]
[[variants.odin.Bass.zones]]
when = { arousal = [0.7, 1.0] }
preset = "Analog Bass [tx]"
transpose = 12
level_db = 4.0
morph = [
  { param = "fil1_freq", arousal = 3500.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
  { param = "fil1_env", arousal = 0.4 },
  { param = "env1_release", density = 0.3 }
]
[[variants.odin.Bass.zones]]
when = { valence = [-1.0, -0.3] }
preset = "DeepBass [Photonic]"
transpose = 12
level_db = 5.0
morph = [
  { param = "fil1_freq", arousal = 3500.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
  { param = "fil1_env", arousal = 0.4 },
  { param = "env1_release", density = 0.3 }
]
[[variants.odin.Bass.zones]]
