# Doublure (hétérophonie, −14 dB) : scie 81 comme le dessus, ou pad chaud 88 (un chœur sous le lead).
[[variants]]
group = "choeur"
name = "scie"
weight = 3
instruments = { countermelody_program = 81 }

[[variants]]
group = "choeur"
name = "pad"
weight = 1
instruments = { countermelody_program = 88 }

# Batterie : tags des patterns, phrases et relances de `percussion.toml`. « plein » : groove écrit avec
# charleston de temps et relances de toms ; « sec » : groove extrait de Fläshyn (sans charleston, P2) et
# relances à la caisse claire ; « mixte » : les deux.
[[variants]]
group = "batterie"
name = "plein"
weight = 3
percussion = [{ tag = "plein" }]

[[variants]]
group = "batterie"
name = "sec"
weight = 2
percussion = [{ tag = "sec" }]

[[variants]]
group = "batterie"
name = "mixte"
weight = 2
percussion = [{ tag = "plein" }, { tag = "sec" }]

# Énergie de base : multiplicateurs modestes ; l'intensité vient des émotions du jeu.
[[variants]]
group = "energie"
name = "calme"
weight = 1
intensity = 0.9
density = 0.9

[[variants]]
group = "energie"
name = "nominale"
weight = 2

[[variants]]
group = "energie"
name = "tendue"
weight = 1
intensity = 1.1
density = 1.1

# Arc : `arc.toml` (« montee ») ou l'arc nommé « relais » ci-dessous, qui change l'orchestration au
# deuxième chorus.
[[variants]]
group = "arc"
name = "montee"
weight = 3

[[variants]]
group = "arc"
name = "relais"
weight = 2
arc = "relais"

# Arc « relais » : même montée que `arc.toml`, plus le relais d'orchestration du chorus 2 (la nappe passe
# au pad 88 ; un chorus qui n'en déclare pas rend les programmes de la session) et une coupe de batterie
# dans B. La basse ne change jamais de programme en cours d'air : un changement de programme de la basse
# scinderait la piste MIDI de la basse et fausserait la mesure symbolique de la distance au corpus. Les
# programmes de l'arc ne dépendent pas de la session : si la session a déjà 88, rien ne change.
[arcs.relais]
repeat_from = 1

[[arcs.relais.stages]]
variants = [
  { weight = 3, intensity = 0.85, density = 0.85, comping = [{ tag = "tenue" }] },
  { weight = 1, intensity = 0.9, density = 0.9, comping = [{ tag = "tenue" }] },
]

[[arcs.relais.stages]]
variants = [
  { weight = 2, instruments = { chords_program = 88 }, comping = [{ tag = "tenue", weight = 3 }, { tag = "creux", weight = 1 }], breaks = [{ start = 37, bars = 2, chance = 0.5, tracks = ["PercussionLow", "PercussionHigh"] }] },
  { weight = 1, instruments = { chords_program = 88 }, intensity = 1.1, density = 1.1, comping = [{ tag = "reprise" }] },
]

[[arcs.relais.stages]]
variants = [
  { intensity = 1.15, density = 1.15, comping = [{ tag = "tenue", weight = 2 }, { tag = "reprise", weight = 1 }] },
]
