# Deux tours de 48 mesures : ouverture basse/nappe, dessus et batterie en A2,
# pont de nappes seules, retour du motif en B puis A1' avec batterie.
# La doublure ne rejoint que les huit dernières mesures du second tour.
# Les entrées se réappliquent au prochain air (set d'un seul air).
tours_per_tune = 2
[entries]
Chords = { tour = 1, part = 0, pass = 1 }
Bass = { tour = 1, part = 0, pass = 1 }
Melody = { tour = 1, part = 1, pass = 1 }
Heel = { tour = 1, part = 1, pass = 1 }
Toe = { tour = 1, part = 1, pass = 1 }
Countermelody = { tour = 2, part = 0, pass = 2 }

[intro]
forms = []
pickup_eighths = 0
