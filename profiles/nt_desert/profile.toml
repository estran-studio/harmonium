# Profil du désert de Nuclear Throne (Jukio Kallio, 2015).
# Données seulement : pédale phrygienne tenue (G2/G5), basse motivique (G3),
# forme en boucle sans mélodie (G4, G7c), 12/8 à 140 noires pointées.
# Arche de Fläshyn : A1 pédale G#, A2 riff D/D# (D mineur), pont de nappes,
# B en alternance G/G#, reprise A1'. G7c : sifflement retiré, une seule voix
# grave (scie 81 sur Bass), accords en nappe chaude 89 en médium, batterie en
# groove (charleston réduit aux accents, G7d) et en retrait au mix.
# G7f : dessus composé (pas une transcription) sur pad 88 doux, réponses et
# répétitions plutôt que solos ; doublure brève au dernier retour du second
# tour. La banque du jeu et GeneralUser possèdent 88, 89, 81 et les toms.
# G6d : presets Odin fidèles usine (Sausage Bassener sur Bass, Darken Nature
# [RM] sur Chords) ; le gain master ne s'applique qu'aux pistes SoundFont, les
# presets gardent leur master d'usine.
[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"

[meta]
id = "nt_desert"
name = "Désert de Nuclear Throne"
tradition = "Nuclear Throne, désert — Jukio Kallio, 2015"
tags = ["nuclear-throne", "desert", "boucle", "synthe"]
corpus = "harmonium_lab corpus/nuclear_throne/manifest.jsonl : 02 Fläshyn (Desert A) et 19 A Way (Desert B), Jukio Kallio / Vlambeer 2015, droits réservés (analyse et inspiration seulement ; audio, stems et transcriptions hors dépôt)"

[meter]
time_signature = { numerator = 12, denominator = 8 }
steps_per_bar = 24
steps_per_unit = 2
steps_per_pulse = 6
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 210.0
min_bpm = 150.0
max_bpm = 240.0

# Arche de 48 mesures, répétée deux tours avec quelques fins variées.
# Les frontières de phrase déclenchent les fills, sans cadence harmonique.
[form]
sequence = [0, 1, 2, 3, 0]
resolve = "per_tune"
repeat_variation = 0.15
tour_variation = 0.20
variation_operations = ["varied_end", "repeated_notes"]
varied_end_keep = 0.5
avoid_adjacent = false
[[form.parts]]
name = "A1"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Open", "Open", "Open", "Open", "Open", "Open", "Open"]
[[form.parts]]
name = "A2"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Open", "Free", "Free", "Open", "Free", "Open", "Free"]
[[form.parts]]
name = "Pont"
melody_center_offset = 0
# Retombée : nappes seules, y compris au second tour.
tracks_off = ["Bass", "Heel", "Toe", "Melody", "Countermelody"]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]
[[form.parts]]
name = "B"
melody_center_offset = -5
phrase_ends = [8]
roles = ["Open", "Open", "Free", "Free", "Open", "Free", "Open", "Free"]

# Le moteur rapproche les porteuses des sons de l'accord courant : A1'
# conserve donc une ligne de pédale, pas une gamme libre ajoutée au bourdon.
[melody]
cell_units = 12
strong_units = [0, 3, 6, 9]
weak_units = [1, 2, 4, 5, 7, 8, 10, 11]
key_modes = [{ key = 8, mode = "phrygian", weight = 1 }]
[melody.params]
weight_role_run = 2
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 74
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 64
tessitura_max = 84
base_velocity = 60
strong_eighth_velocity_offset = 4
even_eighth_velocity_offset = -4

# Boucles et pédales par partie (G2), en demi-tons relatifs à la tonique
# (transportable par la couleur) : A1 pédale G#, A2 pédale de triton en
# triade mineure (D + D# + A de l'original, tierce documentée au README),
# pont C C E E F B C C puis F C E E F B C# C#, B en I-bII phrygien.
[harmony]
model = "loop"
steps_per_chord = 24
default_bars_per_chord = 1
[harmony.parts.A1]
kind = "pedal"
degree = 1
[harmony.parts.A2]
kind = "chord_loop"
chords = [{ semitones = 6, quality = "Minor", bars = 8 }]
[harmony.parts.Pont]
kind = "chord_loop"
chords = [
  { semitones = 4, quality = "Major", bars = 1 },
  { semitones = 4, quality = "Major", bars = 1 },
  { semitones = 8, quality = "Major", bars = 1 },
  { semitones = 8, quality = "Major", bars = 1 },
  { semitones = 9, quality = "Major", bars = 1 },
  { semitones = 3, quality = "Major", bars = 1 },
  { semitones = 4, quality = "Major", bars = 1 },
  { semitones = 4, quality = "Major", bars = 1 },
  { semitones = 9, quality = "Major", bars = 1 },
  { semitones = 4, quality = "Major", bars = 1 },
  { semitones = 8, quality = "Major", bars = 1 },
  { semitones = 8, quality = "Major", bars = 1 },
  { semitones = 9, quality = "Major", bars = 1 },
  { semitones = 3, quality = "Major", bars = 1 },
  { semitones = 5, quality = "Major", bars = 1 },
  { semitones = 5, quality = "Major", bars = 1 },
]
[harmony.parts.B]
kind = "chord_loop"
chords = [
  { semitones = 11, quality = "Major", bars = 2 },
  { semitones = 0, quality = "Major", bars = 2 },
]

[accompaniment]
strong_steps = [0, 6, 12, 18]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Basse motivique (G3) sur scie 81, décision d'écoute du propriétaire.
# Références : tonique pour A1 (pédale G# + relance chromatique D-E-F#-G-G#,
# hauteurs absolues de G0 §6.1), fondamentale courante ailleurs (riff D/D#
# de G0, quasi-absence en B). Le pont tait la basse (`tracks_off`, G7b),
# comme l'original : aucun motif pour cette partie.
[accompaniment.bass]
low = 26
high = 37
[[accompaniment.bass.motifs]]
part = "A1"
bars = 4
weight = 1
reference = "tonic"
notes = [
  { step = 0, duration = 72, semitones = 0, velocity = 92, tie = true },
  { step = 72, duration = 5, semitones = -6, velocity = 85 },
  { step = 77, duration = 1, semitones = -4, velocity = 85 },
  { step = 78, duration = 1, semitones = -2, velocity = 90 },
  { step = 79, duration = 4, semitones = -1, velocity = 95 },
  { step = 83, duration = 13, semitones = 0, velocity = 100 },
]
[[accompaniment.bass.motifs]]
part = "A2"
bars = 2
weight = 3
reference = "chord_root"
notes = [
  { step = 0, duration = 4, semitones = 0, velocity = 95 },
  { step = 4, duration = 1, semitones = 1, velocity = 85 },
  { step = 5, duration = 3, semitones = 0, velocity = 90 },
  { step = 8, duration = 3, semitones = 1, velocity = 85 },
  { step = 11, duration = 6, semitones = 0, velocity = 95 },
  { step = 17, duration = 1, semitones = 1, velocity = 85 },
  { step = 18, duration = 6, semitones = 0, velocity = 95 },
  { step = 24, duration = 5, semitones = 0, velocity = 95 },
  { step = 29, duration = 2, semitones = 1, velocity = 85 },
  { step = 31, duration = 1, semitones = 3, velocity = 85 },
  { step = 32, duration = 3, semitones = 5, velocity = 90 },
  { step = 35, duration = 2, semitones = 6, velocity = 95 },
  { step = 37, duration = 2, semitones = 0, velocity = 90 },
  { step = 39, duration = 2, semitones = 1, velocity = 85 },
  { step = 41, duration = 2, semitones = 0, velocity = 90 },
  { step = 43, duration = 1, semitones = 2, velocity = 85 },
  { step = 44, duration = 4, semitones = 0, velocity = 95 },
]
[[accompaniment.bass.motifs]]
part = "A2"
bars = 2
weight = 1
reference = "chord_root"
notes = [
  { step = 0, duration = 12, semitones = 0, velocity = 76 },
  { step = 12, duration = 12, semitones = 1, velocity = 70 },
  { step = 24, duration = 18, semitones = 0, velocity = 76 },
  { step = 42, duration = 6, semitones = 1, velocity = 70 },
]
[[accompaniment.bass.motifs]]
part = "B"
bars = 2
weight = 1
reference = "chord_root"
notes = [{ step = 0, duration = 2, semitones = 0, velocity = 50 }]

# Nappe chaude (G7c, essai v2/v3 du propriétaire) : un coup plaqué lié d'une
# mesure entière, programme 89, vélocité ×0,8 (53), tessiture médium
# (center 60) pour ne pas doubler la scie grave de Bass. Mêmes coups sur les
# boucles : triades tenues qui changent avec l'accord.
[accompaniment.chords]
center = 60
max_drift = 6
strings = 4
default_pattern = 0
patterns = [{ hits = [{ step = 0, stroke = "block", duration = 24, velocity = 53, tie = true }] }]

[instruments]
# Pad doux employé en dessus, pas de programme 78.
melody_program = 88
countermelody_program = 88
chords_program = 89
bass_program = 81
percussion_bank = 128
percussion_program = 0

# Doublure brève au dernier retour du second tour ; pas de solo indépendant.
[heterophony]
source = "Melody"
octave = -1
low = 55
high = 79
arousal_low = 0.5
arousal_high = 1.0
density_low = 0.5
density_high = 1.0
operations = [
  { operation = "unison", weight = 8 },
  { operation = "plain", weight = 2 },
  { operation = "rest", weight = 3, beats = ["weak"] },
]

[odin.Bass]
preset = "Sausage Bassener"
morph = [
  { param = "fil1_freq", arousal = 3500.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
  { param = "fil1_env", arousal = 0.4 },
  { param = "env1_release", density = 0.3 },
]

[odin.Chords]
preset = "Darken Nature [RM]"
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_attack", tension = -0.15 },
  { param = "env1_release", density = 0.6 },
  { param = "env2_sustain", valence = 0.2 },
]

[mix]
master_db = 9.0
[mix.room]
room_size = 0.3
damping = 0.5
width = 0.6
level = 0.25
[mix.tracks.Melody]
level_db = -8.0
pan = 0.05
reverb_send = 0.2
[mix.tracks.Countermelody]
level_db = -14.0
pan = 0.25
reverb_send = 0.2
[mix.tracks.Chords]
level_db = 0.0
pan = -0.3
reverb_send = 0.25
[mix.tracks.Bass]
level_db = 0.0
pan = 0.0
reverb_send = 0.1
[mix.tracks.Heel]
level_db = -5.0
pan = -0.06
reverb_send = 0.06
[mix.tracks.Toe]
level_db = -6.0
pan = 0.06
reverb_send = 0.06
[mix.eq]
highpass_hz = 40.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8

# Groove (G7c, essais du propriétaire) : micro-timing et dispersion légers
# (jitter ±0,02 pas) plus accent du temps fort sur les deux pieds. Mécanismes
# génériques (voir profiles/README.md « Interprétation »), déjà employés par
# les profils trad sur Melody ; la fixture gigue_bourdon les emploie sur les
# pieds (principe VIII).
[performance.tracks.Heel]
jitter = 0.02
[[performance.tracks.Heel.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
[performance.tracks.Toe]
jitter = 0.02
[[performance.tracks.Toe.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
