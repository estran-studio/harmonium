# G7c/G7d : groove ternaire de Fläshyn, 24 pas, kick 0/8/20 et snare 2/10/14.
# Charleston limité aux accents ; aucune cymbale supplémentaire. R2 : phrases de
# quatre mesures, tags plein/sec, fills à la frontière de partie uniquement.
# Les patterns restent ceux validés en R1 (écrit et extraction P2).
# Poids de « pas de relance » à une fin de partie (les relances reprennent les anciens
# cadence_patterns, toujours joués avant R2) : 1 contre 1 par relance, une fin de partie
# sur deux environ garde le groove ; mesuré : batterie +0,7 point, boucles +2,4 (10 graines).
fills_none_weight = 1
low_note = 36
high_note = 38
low_velocity = 92
high_velocity = 84
percussion_gain = 1.0
velocity_humanize = 4

[[patterns]]
density = 0
tag = "plein"
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -20 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
]

[[patterns]]
density = 1
tag = "plein"
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -20 },
  { step = 2, track = "PercussionHigh", delta_velocity = -17 },
  { step = 8, track = "PercussionLow", delta_velocity = -18 },
  { step = 10, track = "PercussionHigh", delta_velocity = -17 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 14, track = "PercussionHigh", delta_velocity = -17 },
  { step = 20, track = "PercussionLow", delta_velocity = -18 },
]

[[patterns]]
density = 2
tag = "plein"
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -20 },
  { step = 2, track = "PercussionHigh", delta_velocity = -17 },
  { step = 6, track = "PercussionHigh", note = 42, delta_velocity = -32 },
  { step = 8, track = "PercussionLow", delta_velocity = -18 },
  { step = 10, track = "PercussionHigh", delta_velocity = -17 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 14, track = "PercussionHigh", delta_velocity = -17 },
  { step = 16, track = "PercussionLow", delta_velocity = -8 },
  { step = 18, track = "PercussionHigh", note = 42, delta_velocity = -32 },
  { step = 20, track = "PercussionLow", delta_velocity = -18 },
  { step = 22, track = "PercussionHigh", delta_velocity = -8 },
  { step = 22, track = "PercussionHigh", note = 42, delta_velocity = -40 },
]

# P2 nt-desert/proposals/nt_desert.toml : 02_flashyn mesures 1,3,33,35,
# 0:02,3 / 0:05,7 / 0:57,1 / 1:00,6 ; soutien 4/8, confiance 0,365.
# R1 : sans hats, avec snare 22 ; poids égal au groove écrit.
[[patterns]]
density = 1
tag = "sec"
weight = 1
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 2, track = "PercussionHigh", delta_velocity = -16 },
  { step = 8, track = "PercussionLow", delta_velocity = -16 },
  { step = 10, track = "PercussionHigh", delta_velocity = -16 },
  { step = 14, track = "PercussionHigh", delta_velocity = -16 },
  { step = 20, track = "PercussionLow", delta_velocity = -16 },
  { step = 22, track = "PercussionHigh", delta_velocity = -16 },
]

# Règle composée : le pattern P2 reste la réponse, l'écrit l'appel.
# Pas de variante density 0 extraite (rejet du propriétaire conservé).
[[phrases]]
density = 0
tag = "plein"
patterns = [0, 0, 0, 0]
[[phrases]]
density = 1
tag = "plein"
weight = 3
patterns = [1, 1, 1, 3]
[[phrases]]
density = 1
tag = "plein"
patterns = [1, 3, 1, 1]
[[phrases]]
density = 1
tag = "sec"
weight = 3
patterns = [3, 3, 3, 1]
[[phrases]]
density = 1
tag = "sec"
patterns = [3, 1, 3, 3]
[[phrases]]
density = 2
tag = "plein"
patterns = [2, 2, 2, 2]

# Migration intégrale des anciens cadence_patterns : mêmes coups, même frontière
# (fin des huit mesures A1/A2/B). Aucun fill au milieu d'une phrase de quatre bars.
# Les deux tags désignent ici les mêmes toms : le choix sec ne supprime pas la relance.
[[fills]]
density = 0
tag = "plein"
at = "part_end"
bars = [{ hits = [
  { step = 0, track = "PercussionLow" },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -20 },
  { step = 20, track = "PercussionHigh", note = 41, delta_velocity = -20 },
] }]
[[fills]]
density = 1
tag = "plein"
at = "part_end"
bars = [{ hits = [
  { step = 0, track = "PercussionLow" },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -20 },
  { step = 2, track = "PercussionHigh", delta_velocity = -17 },
  { step = 8, track = "PercussionLow", delta_velocity = -18 },
  { step = 10, track = "PercussionHigh", delta_velocity = -17 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 14, track = "PercussionHigh", delta_velocity = -17 },
  { step = 18, track = "PercussionHigh", note = 48, delta_velocity = -18 },
  { step = 20, track = "PercussionHigh", note = 45, delta_velocity = -14 },
  { step = 22, track = "PercussionHigh", note = 41, delta_velocity = -10 },
] }]
[[fills]]
density = 1
tag = "sec"
at = "part_end"
# Même règle de toms, le pattern P2 reste jusqu'au dernier temps.
start_step = 18
bars = [{ hits = [
