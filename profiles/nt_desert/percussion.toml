# R1 (phase 019), P2 `nt_desert` (références labo nt-desert, proposals/nt_desert.toml) :
# groove de densité 1 extrait de 02_flashyn (mesures 1, 3, 33, 35 ; 0:02,3 / 0:05,7 /
# 0:57,1 / 1:00,6), soutien 4 sur 8 fenêtres, confiance 0,365 (marge de classification
# moyenne, faible). C'est le groove écrit sans charleston, avec la caisse claire au
# pas 22. Poids rééquilibré au poids de l'écrit (1). Le pattern de densité 0
# (0:04,0 / 0:07,4 / 0:58,8, confiance 0,408, sans grosse caisse au pas 0) n'est pas
# retenu : décision du propriétaire du 2026-11-02.
[[patterns]]
density = 1
weight = 1
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 2, track = "PercussionHigh", delta_velocity = -16 },
  { step = 8, track = "PercussionLow", delta_velocity = -16 },
  { step = 10, track = "PercussionHigh", delta_velocity = -16 },
  { step = 14, track = "PercussionHigh", delta_velocity = -16 },
  { step = 20, track = "PercussionLow", delta_velocity = -16 },
  { step = 22, track = "PercussionHigh", delta_velocity = -16 },
]

