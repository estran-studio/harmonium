# « Stomp » du Basement (grille §6.2 des références) : grosse caisse sur 0, 2
# et 6, caisse claire sur les temps 2, 3 et 4 (pas 4, 8, 12), sans charleston
# continu. Densité 0 : ossature (kick 0, caisse 8) ; densité 2 : stomp plus
# charleston discret aux contretemps. Fills de toms aux fins de phrase.
#
# R2 (phase 019, vague 4), variété qui s'entend. Les cinq patterns écrits (indices 0 à 4) sont
# inchangés, étiquetés `stomp` ; aucun ne vient d'une mesure de corpus de plus. Ajouts (indices 5 à 9),
# tous dans le vocabulaire de batterie de la famille Basement mesuré au labo
# (`references/isaac-basement/README.md` §6.2, `isaac-cellar/proposals`) :
#   - `sparse` (densité 0) : ossature de *River of Despair* (grosse caisse 0 et 4 faible, caisse claire
#     au temps 3), pour les chœurs lents et les arcs doux ;
#   - `rock` (densités 1 et 2) : demi-temps de *Fundamentum* (grosse caisse {0, 2}, caisse claire {8},
#     charleston {4, 12}), le backbeat de Burning Basement : mêmes notes GM 36 / 38 / 42, poids 1 contre
#     3 au stomp (le stomp reste la signature de Periculum) ;
#   - `stomp` dense (indices 8 et 9) : tous les appuis « x » du vote de Periculum (grosse caisse 0, 2, 6 et
#     10) ; la proposition P2 d'`isaac_cellar` (sept caisses claires, artefact écarté par R1) reste écartée.
# Phrases (A1) : suites de patterns de même densité sur 2 à 4 mesures (appel-réponse stomp : A B A B) ;
# relances (A1) : le contenu des anciens `[[cadence_patterns]]` (toms descendants aux pas 12 à 15, ou
# roulement de caisse claire 10-11 puis toms en densité 2) devient la relance `stomp`, plus des relances
# `rock` et une relance de fin de chorus sur deux mesures. Un chorus de la forme finit sur A' : le
# `chorus_end` est la mise en place avant la reprise.
low_note = 36
high_note = 38
low_velocity = 96
high_velocity = 86
percussion_gain = 1.0
velocity_humanize = 4
# « Pas de relance » : une fin de phrase sur six reste sans relance.
fills_none_weight = 1

