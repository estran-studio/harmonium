# Essai : Cellar de The Binding of Isaac (Ridiculon), d'après Periculum
# (références labo isaac-basement). Données seulement, mêmes mécanismes que
# isaac_basement. Ostinato de basse en croches sur D2 qui rampe vers ses
# voisines chromatiques D#, E, F (pédale réattaquée au temps 3), stomp
# industriel, pont chromatique G#m-Gm-Fm-C#m ; le chœur entre en A'.
[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"

[meta]
id = "isaac_cellar"
name = "Cellar de The Binding of Isaac (essai)"
tradition = "The Binding of Isaac, Cellar — Ridiculon, 2014-2021"
tags = ["isaac", "cellar", "boucle", "sombre"]
corpus = "harmonium_lab corpus/isaac/manifest.jsonl : 21 Periculum, Ridiculon (Matthias Bossi, Jon Evans), droits réservés (analyse et inspiration seulement ; audio, stems et transcriptions hors dépôt)"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 140.0
min_bpm = 120.0
max_bpm = 160.0

# Arche de 48 mesures (A A' A A' Pont A'), deux tours.
[form]
sequence = [0, 1, 0, 1, 2, 1]
resolve = "per_tune"
repeat_variation = 0.15
tour_variation = 0.20
variation_operations = ["varied_end", "repeated_notes"]
varied_end_keep = 0.5
avoid_adjacent = false
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
tracks_off = ["Melody"]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]
[[form.parts]]
name = "A2"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]
[[form.parts]]
name = "Pont"
melody_center_offset = -3
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 2, mode = "harmonic_minor", weight = 1 }]
[melody.params]
weight_role_run = 2
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 67
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 57
tessitura_max = 77
base_velocity = 58
strong_eighth_velocity_offset = 4
even_eighth_velocity_offset = -4

# Pédale D sous l'ostinato en A ; en A', Dm puis A majeur (sensible C#) au-dessus
# de la même basse, pour que le chœur ait des sons d'accord ; pont chromatique
# de Periculum, deux mesures par accord (demi-tons relatifs à D).
[harmony]
model = "loop"
steps_per_chord = 16
default_bars_per_chord = 1
[harmony.parts.A]
kind = "pedal"
degree = 1
[harmony.parts.A2]
kind = "chord_loop"
chords = [
  { semitones = 0, quality = "Minor", bars = 6 },
  { semitones = 7, quality = "Major", bars = 2 },
]
[harmony.parts.Pont]
kind = "chord_loop"
chords = [
  { semitones = 6, quality = "Minor", bars = 2 },
  { semitones = 5, quality = "Minor", bars = 2 },
  { semitones = 3, quality = "Minor", bars = 2 },
  { semitones = 11, quality = "Minor", bars = 2 },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Ostinato de croches en D2 (registre lisible) : D répété, voisines D#, E,
# F en appoggiatures, réattaque de la pédale au temps 3. Pont : fondamentale
# de l'accord en noires avec une voisine chromatique.
[accompaniment.bass]
low = 26
high = 37
[[accompaniment.bass.motifs]]
part = "A"
bars = 2
weight = 1
reference = "tonic"
notes = [
  { step = 0, duration = 2, semitones = 0, octave = 1, velocity = 100 },
  { step = 2, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 4, duration = 2, semitones = 1, octave = 1, velocity = 86 },
  { step = 6, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 8, duration = 4, semitones = 0, octave = 1, velocity = 96 },
  { step = 12, duration = 2, semitones = 2, octave = 1, velocity = 84 },
  { step = 14, duration = 2, semitones = 1, octave = 1, velocity = 82 },
  { step = 16, duration = 2, semitones = 0, octave = 1, velocity = 98 },
  { step = 18, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 20, duration = 2, semitones = 1, octave = 1, velocity = 86 },
  { step = 22, duration = 2, semitones = 2, octave = 1, velocity = 84 },
  { step = 24, duration = 4, semitones = 0, octave = 1, velocity = 96 },
  { step = 28, duration = 2, semitones = 3, octave = 1, velocity = 86 },
  { step = 30, duration = 2, semitones = 2, octave = 1, velocity = 82 },
]
[[accompaniment.bass.motifs]]
part = "A2"
bars = 2
weight = 1
reference = "tonic"
notes = [
  { step = 0, duration = 2, semitones = 0, octave = 1, velocity = 100 },
  { step = 2, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 4, duration = 2, semitones = 1, octave = 1, velocity = 86 },
  { step = 6, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 8, duration = 4, semitones = 0, octave = 1, velocity = 96 },
  { step = 12, duration = 2, semitones = 2, octave = 1, velocity = 84 },
  { step = 14, duration = 2, semitones = 1, octave = 1, velocity = 82 },
  { step = 16, duration = 2, semitones = 0, octave = 1, velocity = 98 },
  { step = 18, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 20, duration = 2, semitones = 1, octave = 1, velocity = 86 },
  { step = 22, duration = 2, semitones = 2, octave = 1, velocity = 84 },
  { step = 24, duration = 4, semitones = 0, octave = 1, velocity = 96 },
  { step = 28, duration = 2, semitones = 3, octave = 1, velocity = 86 },
  { step = 30, duration = 2, semitones = 2, octave = 1, velocity = 82 },
]
[[accompaniment.bass.motifs]]
part = "Pont"
bars = 2
weight = 1
reference = "chord_root"
notes = [
  { step = 0, duration = 4, semitones = 0, octave = 1, velocity = 92 },
  { step = 4, duration = 4, semitones = 0, octave = 1, velocity = 80 },
  { step = 8, duration = 4, semitones = 0, octave = 1, velocity = 88 },
  { step = 12, duration = 4, semitones = 1, octave = 1, velocity = 82, legato = true },
  { step = 16, duration = 4, semitones = 0, octave = 1, velocity = 92, legato = true },
  { step = 20, duration = 4, semitones = 0, octave = 1, velocity = 80 },
  { step = 24, duration = 4, semitones = 0, octave = 1, velocity = 88 },
  { step = 28, duration = 4, semitones = -1, octave = 1, velocity = 82, legato = true },
]

# Nappe liée : un plaqué tenu par mesure, médium (center 60).
[accompaniment.chords]
center = 60
max_drift = 6
strings = 4
default_pattern = 0
patterns = [{ hits = [{ step = 0, stroke = "block", duration = 16, velocity = 54, tie = true }] }]

[instruments]
# GeneralUser GS : synth bass 38 (croches nettes), nappe chœur 91, voix Oohs 53.
melody_program = 53
chords_program = 91
bass_program = 38
percussion_bank = 128
percussion_program = 0

[[odin.Bass.zones]]
preset = "Growly FM Bass [XR]"
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Chords.zones]]
preset = "Eerie Pad"
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[mix]
master_db = 9.0
[mix.room]
room_size = 0.3
damping = 0.5
width = 0.6
level = 0.25
[mix.tracks.Melody]
level_db = -8.0
pan = 0.05
reverb_send = 0.2
[mix.tracks.Chords]
level_db = 0.0
pan = -0.3
reverb_send = 0.25
[mix.tracks.Bass]
# Preset Odin plus fort que ceux d'isaac_basement (crête > 0 dBFS au rendu).
level_db = -6.0
pan = 0.0
reverb_send = 0.1
[mix.tracks.Heel]
level_db = -5.0
pan = -0.06
reverb_send = 0.06
[mix.tracks.Toe]
level_db = -6.0
pan = 0.06
reverb_send = 0.06
[mix.eq]
highpass_hz = 40.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8

# Groove : micro-timing léger et accent du temps fort sur les deux pieds.
[performance.tracks.Heel]
jitter = 0.02
[[performance.tracks.Heel.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
[performance.tracks.Toe]
jitter = 0.02
[[performance.tracks.Toe.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
