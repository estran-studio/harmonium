# Pilotage par les quatre émotions. Aucune mesure de corpus ne relie une émotion à un paramètre
# du jeu : les courbes sont des réglages de service (README du profil).
# Arousal : le tempo (± 8 BPM autour de 96, dans la plage 80..130), la vélocité et la densité de la
# batterie (0 : timekeeper et temps forts ; 1, neutre : tous les rôles à 0,5 ; 2 : notes fantômes et
# syncopes de la grosse caisse et de la caisse claire).
# Vélocités par piste élargies (0,6 à 1,3) : l'arc (`arc.toml`) multiplie l'intensité (0,35 à 0,65 au neutre) et
# l'écart entre l'exposition, le sommet et la retombée doit s'entendre (réglage de service, aucune mesure).
# Aucune bascule de mode : la tonalité est verrouillée (`fixed_tonality`).
