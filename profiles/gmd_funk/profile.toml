# Micro-timing de la batterie par voix (A6, R2-styles) : médianes de l'écart à la grille mesurées dans le GMD
# (funk, 4/4 droit, pondérées par l'effectif), converties en fraction de pas au tempo par défaut
# (96 BPM : un pas = 15 000 / BPM ms). Aucun `jitter` sur la batterie : le tirage de `jitter` partage son flux
# entre les pistes et la basse à notes de passage le décalerait (contrat
# `passing_keeps_neighbour_tracks_and_strong_bass_unchanged`).
[performance.tracks.PercussionLow]
voices = [
  { note = 36, on_beat = -0.069, off_beat = -0.04 },
]
[performance.tracks.PercussionHigh]
voices = [
  { note = 37, on_beat = -0.122, off_beat = -0.089 },
  { note = 38, on_beat = -0.064, off_beat = -0.017 },
  { note = 42, on_beat = -0.03, off_beat = -0.043 },
  { note = 44, on_beat = -0.146, off_beat = -0.133 },
  { note = 46, on_beat = -0.03, off_beat = -0.08 },
  { note = 49, on_beat = -0.061, off_beat = -0.028 },
  { note = 51, on_beat = -0.042, off_beat = -0.059 },
  { note = 53, on_beat = -0.144, off_beat = -0.104 },
  { note = 43, on_beat = -0.131, off_beat = -0.111 },
  { note = 45, on_beat = -0.107, off_beat = -0.104 },
  { note = 48, on_beat = -0.109, off_beat = -0.101 },
]
