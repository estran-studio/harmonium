# Habillage par graine de `gmd_funk` (A2 ; phase 019, R2-styles) : un tirage par groupe, les groupes se combinent
# (73728 habillages possibles). Écrit par `specs/019-bibliotheque-accompagnements/r2-styles/appliquer_b47.py` depuis
# `habillage.py`.
#
# Ce qui vient de la source (GMD, CC BY 4.0) : les plages de tempo (centiles des BPM des fichiers `beat`, 80 à 130) et
# le micro-timing de la batterie. Le reste est de métier (tonalités courantes du style, instruments, kits, familles de
# voicings, registre, énergie, arcs nommés) : aucun corpus distribuable ne le mesure (décision F3). Programmes General
# MIDI (0-based) de GeneralUser GS, banque 0 ; kits de la banque 128 : 0 standard, 8 room, 16 power, 24 electronic,
# 32 jazz. Aucune zone Odin (D1). Le tempo de l'hôte (`SetBpm`), son swing et son `[fixed_tonality]` gagnent sur la
# variante.

