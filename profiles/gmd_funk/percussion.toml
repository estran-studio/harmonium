# Batterie du profil `gmd_funk` : GÉNÉRÉ par `specs/019-bibliotheque-accompagnements/b47_batterie.py gmd_funk`
# depuis le Groove MIDI Dataset v1.0.0 (CC BY 4.0, Gillick, Roberts, Engel, Eck, Bamman, ICML 2019 ;
# Google LLC), gmd_funk : GMD `funk` (36 fichiers beat, 4 batteurs ; 41 fills, 2 batteurs).
# Chaque pattern est construit sur les probabilités PAR PAS d'un groupe de mesures de même
# configuration (grosse caisse, caisse claire, charleston ou ride) : k-moyennes, groupes d'au moins
# 20 mesures, 3 fichiers et 2 batteurs ; aucun n'est une mesure d'un enregistrement.
# Seuils : densité 0 timekeeper ≥ 0,5 et grosse caisse / caisse claire ≥ 0,75 ; densité 1 tous ≥ 0,5 ;
# densité 2 : grosse caisse, caisse claire, cross-stick dès 0,08, le reste ≥ 0,5 ; sous 0,5, `probability` = fréquence.
# L'ossature de densité 1 (fréquence ≥ 0,5) reste certaine ; aucune mesure source n'est copiée.
# Poids = effectif de mesures du groupe ; étiquette = tiers d'activité (sparse, medium, dense).
# Les phrases sont les suites de groupes vues ≥ 3 fois sur ≥ 2 batteurs ; les relances sont les
# fichiers `fill`, groupés par longueur et départ, coups de probabilité ≥ 0,3.
# Kit : kit standard de GeneralUser GS (banque 128, programme 0). Vélocités ramenées au kit par un gain par rôle, calé sur le LUFS en solo (voir le script).
low_note = 36
high_note = 42
low_velocity = 64
high_velocity = 64
percussion_gain = 1.0
velocity_humanize = 4
# Poids de « pas de relance » dans le tirage d'une fin de phrase : 0,8 × le poids total des relances
# d'une densité, soit 44 % de fins de phrase sans relance (valeur de service : le GMD isole les
# relances, la part de fins de phrase sans relance n'y est pas mesurable).
fills_none_weight = 29

