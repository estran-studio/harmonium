# R1 (phase 019), P2 `isaac_burning` (proposals/isaac_burning.toml) : groove de densité 1
# extrait de 36_fundamentum (mesures 1 et 3 ; 0:03,2 / 0:06,6), soutien 2 sur 4 fenêtres,
# confiance 0,443 (marge de classification moyenne), grosse caisse aux pas 0, 2 et 6.
# Poids 3 = total des patterns de densité 1 écrits (rééquilibré). Le pattern de densité 0
# (0S 4H 8S 12H, sans grosse caisse, confiance 0,58) n'est pas retenu, ni les grooves
# par portée de partie de P1 (couche −2,4 sur C2) : décision du propriétaire du 2026-11-02.
[[patterns]]
density = 1
tag = "backbeat"
weight = 3
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 2, track = "PercussionLow", delta_velocity = -16 },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -40 },
  { step = 6, track = "PercussionLow", delta_velocity = -16 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -40 },
  { step = 15, track = "PercussionHigh", note = 42, delta_velocity = -40 },
]

# R2 : règle de métier, dérivée de l'ossature de Fundamentum (§6.2) :
# même snare sur 8 et hats 4/12 ; coup de kick en levée, puis ouverture
# de charleston en fin de cycle. Pas de nouveau stomp ni portée par partie.
[[patterns]]
density = 1
tag = "drive"
weight = 1
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 2, track = "PercussionLow", delta_velocity = -18 },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 8, track = "PercussionHigh" },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 14, track = "PercussionLow", delta_velocity = -20 },
]

[[patterns]]
density = 2
tag = "drive"
weight = 1
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -36 },
  { step = 2, track = "PercussionLow", delta_velocity = -18 },
  { step = 2, track = "PercussionHigh", note = 42, delta_velocity = -42 },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -28 },
  { step = 6, track = "PercussionHigh", note = 42, delta_velocity = -42 },
  { step = 8, track = "PercussionHigh" },
  { step = 10, track = "PercussionLow", delta_velocity = -16 },
  { step = 10, track = "PercussionHigh", note = 42, delta_velocity = -42 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -28 },
  { step = 14, track = "PercussionHigh", note = 46, delta_velocity = -38 },
]

# A1 : suites de 4 ou 8 mesures des patterns existants, pas de transcription
# nouvelle. Indices globaux : 0=d0 ; 1,3,5=d1 (écrit/réponse/P2) ;
# 2,4=d2 (écrit/réponse) ; 6=d1 drive ; 7=d2 drive.
# Proportions privilégiant P2 (0,443 de confiance) et la réponse écrite.
[[phrases]]
density = 0
tag = "backbeat"
patterns = [0, 0, 0, 0, 0, 0, 0, 0]

[[phrases]]
density = 1
tag = "backbeat"
weight = 3
patterns = [5, 5, 3, 5, 5, 1, 3, 5]

[[phrases]]
