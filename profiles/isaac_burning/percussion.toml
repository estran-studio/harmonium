hits = [
  { step = 0, track = "PercussionLow" },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 6, track = "PercussionLow", delta_velocity = -18 },
  { step = 8, track = "PercussionHigh" },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 14, track = "PercussionLow", delta_velocity = -20 },
]

[[patterns]]
