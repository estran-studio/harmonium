tag = "drive"
patterns = [5, 6, 5, 6]

[[phrases]]
density = 2
tag = "backbeat"
weight = 2
patterns = [4, 4, 2, 4, 4, 2, 4, 4]

[[phrases]]
density = 2
tag = "backbeat"
patterns = [2, 4, 2, 4]

[[phrases]]
