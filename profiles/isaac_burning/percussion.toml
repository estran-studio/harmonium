# Backbeat rock en demi-temps de Fundamentum (grille §6.2 des références) :
# grosse caisse 0 et 2, caisse claire au temps 3 (pas 8), charleston aux
# temps 2 et 4. Densité 0 : ossature ; densité 2 : charleston en croches et
# grosse caisse de relance. Fills de toms aux fins de phrase.
low_note = 36
high_note = 38
low_velocity = 96
high_velocity = 86
percussion_gain = 1.0
velocity_humanize = 4
# A1 : une relance reste possible en milieu de partie sans roulement systématique.
fills_none_weight = 2

[[patterns]]
density = 0
tag = "backbeat"
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
]

[[patterns]]
density = 1
tag = "backbeat"
weight = 1
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 2, track = "PercussionLow", delta_velocity = -18 },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -30 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
  { step = 10, track = "PercussionLow", delta_velocity = -16 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -30 },
]

[[patterns]]
density = 2
tag = "backbeat"
weight = 1
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 0, track = "PercussionHigh", note = 42, delta_velocity = -36 },
  { step = 2, track = "PercussionLow", delta_velocity = -18 },
  { step = 2, track = "PercussionHigh", note = 42, delta_velocity = -42 },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -28 },
  { step = 6, track = "PercussionHigh", note = 42, delta_velocity = -42 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
  { step = 10, track = "PercussionLow", delta_velocity = -16 },
  { step = 10, track = "PercussionHigh", note = 42, delta_velocity = -42 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -28 },
  { step = 14, track = "PercussionLow", delta_velocity = -20 },
  { step = 14, track = "PercussionHigh", note = 42, delta_velocity = -42 },
]

# Réponse en demi-temps : caisse claire toujours sur 8, relance retardée.
[[patterns]]
density = 1
tag = "backbeat"
