  { step = 0, duration = 2, velocity = 96 },
  { step = 2, duration = 2, velocity = 80 },
  { step = 4, duration = 2, velocity = 80 },
  { step = 6, duration = 2, velocity = 80 },
  { step = 8, duration = 2, velocity = 96 },
  { step = 10, duration = 2, velocity = 80 },
  { step = 12, duration = 2, velocity = 80 },
  { step = 14, duration = 2, velocity = 80 },
]
