# Essai : Burning Basement de The Binding of Isaac (Ridiculon, Afterbirth),
# d'après Fundamentum (références labo isaac-basement). Données seulement.
# F# phrygien : riff de deux mesures sur F#2 (E en passage, G = b2 en fin de
# cycle), backbeat rock en demi-temps, sections d'accords D-Bm-F#m et F#m-Bm
# ; orgue rock et chœur seulement dans les sections d'accords.
# Variantes par graine : C et C2 réordonnent les appuis VI/iv/III autour de
# F#m sur huit mesures ; riff et basses d'accords ont une réponse pondérée.
# Demi-temps alternatif aux densités 1/2, chœur tenu enrichi, aucun solo.
# R1 (phase 019, propositions P1 et P2 du labo, provenance en commentaire) : C tire
# aussi une boucle de P2 et une boucle générée, C2 une boucle générée ; la basse de
# C et C2 compte des gabarits P1 (relance vers l'accord suivant) et celle de R et C
# des motifs P2 ; un groove de densité 1 de P2 dans percussion.toml, sans les
# grooves par portée de partie de P1 ni la densité 0 (décision du 2026-11-02).
[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
session = "session.toml"
arc = "arc.toml"

[meta]
id = "isaac_burning"
name = "Burning Basement de The Binding of Isaac (essai)"
tradition = "The Binding of Isaac, Burning Basement — Ridiculon, 2015-2021"
tags = ["isaac", "burning-basement", "boucle", "sombre"]
corpus = "harmonium_lab corpus/isaac/manifest.jsonl : 36 Fundamentum, Ridiculon (Matthias Bossi, Jon Evans), droits réservés (analyse et inspiration seulement ; audio, stems et transcriptions hors dépôt)"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 140.0
min_bpm = 120.0
max_bpm = 160.0

# Arche de 40 mesures (R C R C2 R), deux tours.
[form]
sequence = [0, 1, 0, 2, 0]
resolve = "per_tune"
repeat_variation = 0.15
tour_variation = 0.20
variation_operations = ["varied_end", "repeated_notes"]
varied_end_keep = 0.5
avoid_adjacent = false
[[form.parts]]
name = "R"
melody_center_offset = 0
phrase_ends = [8]
tracks_off = ["Melody"]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]
[[form.parts]]
name = "C"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]
[[form.parts]]
name = "C2"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 6, mode = "phrygian", weight = 1 }]
[melody.params]
weight_role_run = 2
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 66
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 56
tessitura_max = 76
base_velocity = 58
strong_eighth_velocity_offset = 4
even_eighth_velocity_offset = -4

# Pédale F# sous le riff ; sections d'accords de Fundamentum en F# phrygien
# (D = VI, B = iv, A = III ; demi-tons relatifs à F#).
[harmony]
model = "loop"
steps_per_chord = 16
[harmony.parts.R]
kind = "pedal"
degree = 1
# R1 (phase 019), P2 `isaac_burning` (références labo isaac-basement, proposals/isaac_burning.toml) :
# la troisième boucle de C vient de 36_fundamentum, mesures 32-40 (0:56,3-1:10,0), confiance
# 0,848, similarité 0,94, soutien 1 sur 1 fenêtre ; poids 2 (rééquilibré au total des écrites).
[harmony.parts.C]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 8, quality = "", steps = 16 },
  { semitones = 5, quality = "m", steps = 16 },
  { semitones = 0, quality = "m", steps = 32 },
  { semitones = 8, quality = "", steps = 16 },
  { semitones = 3, quality = "", steps = 16 },
  { semitones = 8, quality = "", steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
] }, { weight = 1, chords = [
  { semitones = 8, quality = "", steps = 32 },
  { semitones = 5, quality = "m", steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
  { semitones = 3, quality = "", steps = 16 },
  { semitones = 5, quality = "m", steps = 16 },
  { semitones = 0, quality = "m", steps = 32 },
] }, { weight = 2, chords = [
  { semitones = 8, quality = "", steps = 16 },
  { semitones = 5, quality = "", steps = 16 },
  { semitones = 0, quality = "m", bass = 3, steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
  { semitones = 8, quality = "", steps = 16 },
  { semitones = 3, quality = "", steps = 16 },
  { semitones = 8, quality = "", bass = 3, steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
] }]
# R1, P1 §6.1/§6.4 : boucle générée de huit accords, majeurs ou mineurs, dont toutes les
# notes tiennent dans la gamme du mode actif (`within`) ; fondamentales par intervalles
# pondérés (quarte de préférence à la tierce mineure, répétition rare). Poids 2 (= total
# des écrites) ; tirée une fois par partie et par air, comme les boucles écrites.
generated = [{ weight = 2, count = 8, qualities = ["", "m"], key_fit = "within", motion = { kind = "intervals", intervals = [{ semitones = 3, weight = 2 }, { semitones = 5, weight = 3 }, { semitones = -3, weight = 2 }, { semitones = -5, weight = 2 }, { semitones = 0, weight = 1 }] } }]
[harmony.parts.C2]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 0, quality = "m", steps = 16 },
  { semitones = 5, quality = "m", steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
  { semitones = 3, quality = "", steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
  { semitones = 5, quality = "m", steps = 16 },
  { semitones = 0, quality = "m", steps = 16 },
  { semitones = 3, quality = "", steps = 16 },
] }, { weight = 1, chords = [
  { semitones = 0, quality = "m", steps = 32 },
  { semitones = 5, quality = "m", steps = 32 },
  { semitones = 3, quality = "", steps = 16 },
  { semitones = 5, quality = "m", steps = 16 },
  { semitones = 0, quality = "m", steps = 32 },
] }]
# R1, P1 §6.1/§6.4 : boucle générée à côté des deux écrites, poids 2 (= total des écrites),
# même réglage que pour C.
generated = [{ weight = 2, count = 8, qualities = ["", "m"], key_fit = "within", motion = { kind = "intervals", intervals = [{ semitones = 3, weight = 2 }, { semitones = 5, weight = 3 }, { semitones = -3, weight = 2 }, { semitones = -5, weight = 2 }, { semitones = 0, weight = 1 }] } }]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Riff de Fundamentum à l'octave F#2 : F# tenu, E en passage au milieu de la
