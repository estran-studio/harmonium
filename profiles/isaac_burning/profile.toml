# Nappe liée : un plaqué tenu par mesure, médium (center 60).
[accompaniment.chords]
center = 60
max_drift = 6
strings = 4
default_pattern = 0
patterns = [{ hits = [{ step = 0, stroke = "block", duration = 16, velocity = 58, tie = true }] }]

[instruments]
# GeneralUser GS : basse médiator 34, orgue rock 18, chœur Aahs 52.
melody_program = 52
chords_program = 18
bass_program = 34
percussion_bank = 128
percussion_program = 0

# Odin, écoute du propriétaire : Bass Crusher + Haunt (« plus trad », retenu),
# comme isaac_basement. Variante aimée aussi, « plus psychédélique » :
# profil isaac_burning_psyche (Bass Low [RM] + Moonshade).
# Sausage Bassener + Phazzy Organ rejetés (« micro vibration »).
[odin.Bass]
preset = "Bass Crusher [RM]"
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[odin.Chords]
preset = "Haunt [RM]"
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[mix]
master_db = 9.0
[mix.room]
room_size = 0.3
damping = 0.5
width = 0.6
level = 0.25
[mix.tracks.Melody]
level_db = -8.0
pan = 0.05
reverb_send = 0.2
[mix.tracks.Chords]
level_db = 0.0
pan = -0.3
reverb_send = 0.25
[mix.tracks.Bass]
level_db = 0.0
pan = 0.0
reverb_send = 0.1
[mix.tracks.Heel]
level_db = -5.0
pan = -0.06
reverb_send = 0.06
[mix.tracks.Toe]
level_db = -6.0
pan = 0.06
reverb_send = 0.06
[mix.eq]
highpass_hz = 40.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8

# Groove : micro-timing léger et accent du temps fort sur les deux pieds.
[performance.tracks.Heel]
jitter = 0.02
[[performance.tracks.Heel.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
[performance.tracks.Toe]
jitter = 0.02
[[performance.tracks.Toe.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
