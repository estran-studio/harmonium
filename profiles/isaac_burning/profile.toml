  { step = 0, duration = 2, semitones = 1, octave = 1, velocity = 84 },
  { step = 2, duration = 6, semitones = 0, octave = 1, velocity = 80, legato = true },
  { step = 8, duration = 3, semitones = 1, octave = 1, velocity = 80, legato = true },
  { step = 11, duration = 5, semitones = 0, octave = 1, velocity = 80, legato = true },
]

# R1, P1 §6.1/§6.4 : gabarits de C et C2 ; huit croches sur la fondamentale à l'octave 1
# (accents aux pas 0 et 8, comme le motif écrit), plus une relance de deux pas vers la basse
# de l'accord suivant avant chaque changement. Poids 3 (= total des motifs écrits de
# chaque partie), dans le même pool que les motifs.
[[accompaniment.bass.templates]]
part = "C"
weight = 3
rhythm = [
  { step = 0, duration = 2, velocity = 96 },
  { step = 2, duration = 2, velocity = 80 },
  { step = 4, duration = 2, velocity = 80 },
  { step = 6, duration = 2, velocity = 80 },
  { step = 8, duration = 2, velocity = 96 },
  { step = 10, duration = 2, velocity = 80 },
  { step = 12, duration = 2, velocity = 80 },
  { step = 14, duration = 2, velocity = 80 },
]
