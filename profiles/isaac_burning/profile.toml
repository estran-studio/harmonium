# R1 (phase 019), P2 `isaac_burning` (proposals/isaac_burning.toml), 36_fundamentum,
# confiance 0,939 (part de trames voisées). Poids rééquilibrés au total des motifs écrits
# de la partie (3) : R 2 → 3 ; C 3 et 2 → 2 et 1.
# R : mesures 2-4 (0:04,9-0:08,3), soutien 2 sur 4 fenêtres, F#2 tenu 23 pas puis deux
# notes liées (11 demi-tons sans octave, puis b2 à l'octave 1).
[[accompaniment.bass.motifs]]
part = "R"
bars = 2
weight = 3
reference = "tonic"
notes = [
  { step = 0, duration = 23, semitones = 0, octave = 1, velocity = 95 },
  { step = 23, duration = 3, semitones = 11, velocity = 91, legato = true },
  { step = 26, duration = 6, semitones = 1, octave = 1, velocity = 91, legato = true },
]
# C : mesures 32-33 (0:56,3-0:58,0), soutien 3 sur 9 fenêtres, fondamentale tenue une mesure.
[[accompaniment.bass.motifs]]
part = "C"
bars = 1
weight = 2
reference = "chord_root"
notes = [
  { step = 0, duration = 16, semitones = 0, octave = 1, velocity = 84 },
]
# C : mesures 35-36 (1:01,4-1:03,2), soutien 2 sur 9 fenêtres, voisin supérieur en appui.
[[accompaniment.bass.motifs]]
