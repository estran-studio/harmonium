# Odin : A « plus trad » par défaut ; B « psychédélique » si tension >= 0.6
# (validés à l'écoute). Z1 ajoute combat (arousal >= 0,7) et menace
# (valence <= -0,3) entre les deux. Hystérésis 0,03, bascule à la prochaine
# frontière de partie ; niveaux de zone appariés au défaut.
[[odin.Bass.zones]]
when = { tension = [0.6, 1.0] }
preset = "Bass Low [RM]"
level_db = -5.0
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
when = { arousal = [0.7, 1.0] }
preset = "Growly FM Bass [XR]"
level_db = -5.0
