  { step = 0, duration = 2, semitones = 0, octave = 1, velocity = 96 },
  { step = 2, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 4, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 6, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  { step = 8, duration = 2, semitones = 0, octave = 1, velocity = 96 },
