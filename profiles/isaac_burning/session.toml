weight = 1
instruments = { chords_program = 91 }
[variants.odin.Chords]
zones = [
  { when = { tension = [0.6, 1.0] }, preset = "Moonshade", level_db = -7.0, morph = [{ param = "fil1_freq", arousal = 2000.0, valence = 1000.0 }, { param = "env1_release", density = 0.6 }] },
  { when = { arousal = [0.7, 1.0] }, preset = "Haunt [RM]", morph = [{ param = "fil1_freq", arousal = 2000.0, valence = 1000.0 }, { param = "env1_release", density = 0.6 }] },
  { when = { valence = [-1.0, -0.3] }, preset = "Clouded [RM]", morph = [{ param = "fil1_freq", arousal = 2000.0, valence = 1000.0 }, { param = "env1_release", density = 0.6 }] },
  { preset = "Prophet", level_db = -3.0, morph = [{ param = "fil1_freq", arousal = 2000.0, valence = 1000.0 }, { param = "env1_release", density = 0.6 }] },
