# Chœur (piste Melody, sans zone Odin) : 52 Concert Choir (« Choir Aahs ») ou 53 Voice Oohs, les
# deux programmes du labo (README § 4).
[[variants]]
group = "choeur"
name = "aahs"
weight = 3
instruments = { melody_program = 52 }

[[variants]]
group = "choeur"
name = "oohs"
weight = 2
instruments = { melody_program = 53 }

# Kit rock de la banque 128 de GeneralUser GS : standard 0, room 8, power 16 (le README § 4 du labo
# décrit un kit rock sec et compressé, caisse claire claquante).
[[variants]]
group = "kit"
name = "standard"
weight = 6
instruments = { percussion_bank = 128, percussion_program = 0 }

[[variants]]
group = "kit"
name = "room"
weight = 2
instruments = { percussion_bank = 128, percussion_program = 8 }

[[variants]]
group = "kit"
name = "power"
weight = 1
instruments = { percussion_bank = 128, percussion_program = 16 }

# Famille de voicings de la nappe (sections d'accords ; la pédale du riff garde sa note seule).
# Poids faibles pour les voicings non serrés : mesure `symdist` accords 61,9 (avant) → 61,1 avec
# serre 8 / ouvert 2 / drop_2 1 / quinte_tierce 1 ; avec serre 3 / 2 / 1 / 1, 60,5 (perte > 1 point).
[[variants]]
group = "voicing"
name = "serre"
weight = 8
voicing = "close_triad"

[[variants]]
group = "voicing"
name = "ouvert"
weight = 2
voicing = "open"

[[variants]]
group = "voicing"
name = "drop_2"
weight = 1
voicing = "drop2"

[[variants]]
group = "voicing"
name = "quinte_tierce"
weight = 1
voicing = "shell"

# Énergie de base : multiplicateurs modestes, l'intensité vient des émotions du jeu.
[[variants]]
group = "energie"
name = "calme"
weight = 1
intensity = 0.9
density = 0.9

[[variants]]
group = "energie"
name = "nominale"
weight = 3

[[variants]]
group = "energie"
name = "tendue"
weight = 1
intensity = 1.1
density = 1.1

# Batterie (tags de repli, quand le chorus de l'arc n'en nomme pas) : l'ossature backbeat de
# Fundamentum (tag `backbeat` : patterns écrits, réponses, groove de P2) ou plus de relances de
# grosse caisse et de charleston en croches (tag `drive`, règle de métier du rock en demi-temps).
[[variants]]
group = "batterie"
name = "backbeat"
weight = 4
percussion = [{ tag = "backbeat" }]

[[variants]]
group = "batterie"
name = "mixte"
weight = 2
percussion = [{ tag = "backbeat", weight = 3 }, { tag = "drive", weight = 1 }]

[[variants]]
group = "batterie"
name = "drive"
weight = 1
percussion = [{ tag = "backbeat", weight = 1 }, { tag = "drive", weight = 3 }]

# Arc : celui de `arc.toml` (montée), ou un arc nommé ci-dessous.
[[variants]]
group = "arc"
name = "montee"
weight = 3

[[variants]]
group = "arc"
name = "orchestre"
weight = 2
arc = "orchestre"

[[variants]]
group = "arc"
name = "plateau"
weight = 1
arc = "plateau"

# Arc « orchestre » : le kit et le chœur changent à la frontière de chorus (les programmes du
# chorus remplacent ceux de la session, un chorus qui n'en déclare pas les rend). Le kit est
# SoundFont dans tous les rendus ; Odin ne joue que basse et nappe. Chorus 1 : programmes de la
# session, plus calme ; chorus 2 : kit room ; chorus 3 : kit power et chœur oohs ; puis 2-3 en
# boucle (aucune retombée : un jeu n'a pas de fin connue).
[arcs.orchestre]
repeat_from = 1

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { weight = 3, intensity = 0.9, density = 0.9, percussion = [{ tag = "backbeat" }] },
  { weight = 1, intensity = 0.95, density = 0.9, percussion = [{ tag = "backbeat" }] },
]

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { weight = 2, instruments = { percussion_program = 8 }, percussion = [{ tag = "backbeat", weight = 3 }, { tag = "drive", weight = 1 }] },
  { weight = 1, instruments = { percussion_program = 8 }, density = 1.05, percussion = [{ tag = "backbeat", weight = 1 }, { tag = "drive", weight = 1 }] },
]

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { weight = 2, instruments = { percussion_program = 16, melody_program = 53 }, intensity = 1.1, density = 1.1, percussion = [{ tag = "drive", weight = 3 }, { tag = "backbeat" }], breaks = [{ start = -1, bars = 1, chance = 0.3, tracks = ["PercussionLow", "PercussionHigh"] }] },
  { weight = 1, instruments = { percussion_program = 16 }, intensity = 1.1, density = 1.1, percussion = [{ tag = "drive", weight = 2 }, { tag = "backbeat" }] },
]

# Arc « plateau » : un seul palier, tous les chorus pareils, sauf une relance de silence de la
# batterie sur la dernière mesure de temps en temps. Le jeu garde sa bande plate.
[arcs.plateau]

[[arcs.plateau.stages]]
choruses = 1
variants = [
  { weight = 3, percussion = [{ tag = "backbeat" }] },
  { weight = 1, percussion = [{ tag = "backbeat" }], breaks = [{ start = -1, bars = 1, chance = 0.5, tracks = ["PercussionLow", "PercussionHigh"] }] },
]
