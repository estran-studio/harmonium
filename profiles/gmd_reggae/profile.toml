# Profil `gmd_reggae` (phase 019, B8) : accompagnement reggae sous une grille.
#
# Le nom est celui de la source qui définit le style (principe VII) : le style `reggae` du Groove MIDI Dataset v1.0.0 (3 fichiers `beat`, 253 mesures, « juste » au sens de L2 ; le groupe 4/4 droit retenu n'en compte que 2, 132 mesures, deux batteurs, 16 fichiers `fill`). `reggae/slow` (1 fichier, 29 mesures, « trop peu ») et l'unique fichier ternaire ne sont pas lus.
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : la basse (motifs), les accords
# (rythmes de comping, phrases) et la batterie (patterns, phrases, relances) ne dépendent que de l'accord
# publié et de la graine. Les deux parties par défaut (A et B de 8 mesures, quatre grilles chacune), quand
# l'utilisateur n'en fournit pas, sont des progressions d'accords de forme commune écrites pour ce profil
# (voir README, provenance et droits). La grille s'écrit relative à la tonique : la tonalité est tirée par la graine
# (`session.toml`, par défaut la ionien) et training la remplace par `[fixed_tonality]`.
#
# Ce qui vient de la source : la batterie, le tempo et le feel (`percussion.toml` est GÉNÉRÉ par
# `specs/019-bibliotheque-accompagnements/b8/generer.py`). Ce qui n'en vient pas, DIT ICI : la basse, le comping
# et les grilles sont des règles de métier (aucune mesure de basse ni de voicings pour ce style), le mixage et
# l'arc sont des réglages de service. L'habillage par graine (`session.toml`, A2 ; R2-styles) tire le tempo dans
# la plage de la source, la tonalité, les instruments, le kit, la famille de voicings, le registre, l'énergie et
# l'arc ; la variété vient aussi des boucles de grille, des phrases et relances, des motifs de basse et des
# patterns de batterie (coups probabilistes et micro-timing par voix mesurés dans le GMD).
#
# Aucune mélodie : la piste `Melody` est absente de l'arrangement.

[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
arc = "arc.toml"
session = "session.toml"

[meta]
id = "gmd_reggae"
name = "Accompagnement reggae (Groove MIDI Dataset, style reggae)"
tradition = "Groove MIDI Dataset v1.0.0, style reggae, 4/4 droit : 2 fichiers de batterie, 2 batteurs (3 fichiers `beat` en tout) ; basse et guitare : règles de métier"
tags = ["reggae", "accompagnement", "grille"]
aliases = ["reggae"]
corpus = """\
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; dix batteurs, kit électronique Roland TD-11. Seuls des agrégats entrent dans le profil (probabilités par pas d'un groupe de mesures, suites de groupes, moyennes de relances, plage de tempo) : aucune mesure d'un enregistrement n'est copiée. Basse, comping et grilles : règles de métier et formes communes écrites pour ce profil (aucune source mesurée de basse ni de voicings pour ce style : voir README). Manifeste et mesures : harmonium_lab corpus/gmd, references/gmd-*."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# GMD : feel droit (rapport médian 0,50) dans tous les fichiers retenus.
default_swing_ratio = 0.5
# tempo des 2 fichiers `beat` du GMD (BPM du nom de fichier) : centile 10 = 83, médiane = 102, centile 90 = 121.
default_bpm = 102.0
min_bpm = 83.0
max_bpm = 121.0

[form]
sequence = [0, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

# Pas de mélodie jouée : mêmes réglages neutres que `wjazzd_swing`.
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 9, mode = "ionian", weight = 3 }, { key = 7, mode = "ionian", weight = 2 }, { key = 2, mode = "ionian", weight = 2 }, { key = 0, mode = "ionian", weight = 1 }, { key = 4, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4
# Un tirage de grille par chorus (A7) : le chorus n joue le tirage n mod 4 (le premier est celui de l\'air).
tour_variants = 4

# Couplet (huit mesures) : quatre grilles de forme commune, deux accords ou boucle de quatre.
[harmony.parts.A]
kind = "chord_loop"
loops = [
  # I I IV IV (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
  ] },
  # I IV I V (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
  # I vi IV V (deux fois)
  { weight = 2, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
  # vi vi IV IV vi vi iii iii
  { weight = 1, chords = [
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 4, quality = "m", steps = 16 },
    { semitones = 4, quality = "m", steps = 16 },
  ] },
]

# Refrain (huit mesures) : trois grilles.
[harmony.parts.B]
kind = "chord_loop"
loops = [
  # IV IV I I IV IV V V
  { weight = 3, chords = [
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
  ] },
  # I V vi IV (deux fois)
  { weight = 2, chords = [
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 9, quality = "m", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
  ] },
  # IV I IV I IV V I I
  { weight = 2, chords = [
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 7, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
    { semitones = 0, quality = "", steps = 16 },
  ] },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 28
high = 39
motifs = [
  # 0 : temps 1 laissé vide (one drop), basse sur le temps 3
  { bars = 1, weight = 4, reference = "chord_root", notes = [{ step = 6, duration = 2, semitones = 0, velocity = 92 }, { step = 8, duration = 4, semitones = 0, velocity = 100 }, { step = 12, duration = 2, semitones = 7, velocity = 90 }, { step = 14, duration = 2, semitones = 0, velocity = 86 }] },
  # 1 : fondamentale longue, temps 3, quinte au temps 4
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 6, semitones = 0, velocity = 100 }, { step = 8, duration = 4, semitones = 0, velocity = 96 }, { step = 12, duration = 4, semitones = 7, velocity = 90 }] },
  # 2 : noires à la fondamentale
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 4, semitones = 0, velocity = 96 }, { step = 4, duration = 4, semitones = 0, velocity = 88 }, { step = 8, duration = 4, semitones = 0, velocity = 94 }, { step = 12, duration = 4, semitones = 0, velocity = 88 }] },
  # 3 : contretemps, quinte au temps 3
  { bars = 1, weight = 2, reference = "chord_root", notes = [{ step = 2, duration = 2, semitones = 0, velocity = 90 }, { step = 6, duration = 2, semitones = 0, velocity = 88 }, { step = 8, duration = 4, semitones = 7, velocity = 94 }, { step = 12, duration = 4, semitones = 0, velocity = 92 }] },
  # 4 : deux mesures : one drop, puis octave et quinte
  { bars = 2, weight = 2, reference = "chord_root", notes = [{ step = 6, duration = 2, semitones = 0, velocity = 92 }, { step = 8, duration = 4, semitones = 0, velocity = 100 }, { step = 14, duration = 2, semitones = 7, velocity = 88 }, { step = 16, duration = 4, semitones = 0, velocity = 100 }, { step = 20, duration = 2, semitones = 0, velocity = 88 }, { step = 22, duration = 2, semitones = 12, velocity = 90 }, { step = 24, duration = 4, semitones = 7, velocity = 94 }, { step = 28, duration = 4, semitones = 0, velocity = 92 }] },
]

[accompaniment.chords]
center = 64
max_drift = 6
default_pattern = 0
voicing = "close_triad"
color = { none_weight = 4, published_weight = 1, ninth_weight = 1 }
register_drift = { step = 2, max = 4 }
low = 52
high = 76
patterns = [{ hits = [{ step = 6, duration = 2, velocity = 80, direction = "up" }, { step = 14, duration = 2, velocity = 76, direction = "up" }] }]
comping = [
  # 0 sparse : skank sur les contretemps des temps 2 et 4
  { weight = 4, tag = "sparse", hits = [{ step = 6, duration = 2, velocity = 80, direction = "up" }, { step = 14, duration = 2, velocity = 76, direction = "up" }] },
  # 1 sparse : un seul skank (temps 4)
  { weight = 2, tag = "sparse", hits = [{ step = 14, duration = 2, velocity = 74, direction = "up" }] },
  # 2 sparse : silence
  { weight = 1, tag = "sparse", hits = [] },
  # 3 medium : skank sur tous les contretemps
  { weight = 4, tag = "medium", hits = [{ step = 2, duration = 2, velocity = 74, direction = "up" }, { step = 6, duration = 2, velocity = 82, direction = "up" }, { step = 10, duration = 2, velocity = 74, direction = "up" }, { step = 14, duration = 2, velocity = 82, direction = "up" }] },
  # 4 medium : skank, premier contretemps vide
  { weight = 3, tag = "medium", hits = [{ step = 6, duration = 2, velocity = 82, direction = "up" }, { step = 10, duration = 2, velocity = 72, direction = "up" }, { step = 14, duration = 2, velocity = 80, direction = "up" }] },
  # 5 medium : skank, troisième contretemps vide
  { weight = 3, tag = "medium", hits = [{ step = 2, duration = 2, velocity = 76, direction = "up" }, { step = 6, duration = 2, velocity = 82, direction = "up" }, { step = 14, duration = 2, velocity = 82, direction = "up" }] },
  # 6 dense : skank doublé en doubles croches
  { weight = 4, tag = "dense", hits = [{ step = 2, duration = 2, velocity = 74, direction = "up" }, { step = 3, duration = 1, velocity = 60, direction = "up" }, { step = 6, duration = 2, velocity = 82, direction = "up" }, { step = 7, duration = 1, velocity = 60, direction = "up" }, { step = 10, duration = 2, velocity = 74, direction = "up" }, { step = 11, duration = 1, velocity = 60, direction = "up" }, { step = 14, duration = 2, velocity = 82, direction = "up" }, { step = 15, duration = 1, velocity = 60, direction = "up" }] },
  # 7 dense : skank et gratté sur le temps 4
  { weight = 2, tag = "dense", hits = [{ step = 2, duration = 2, velocity = 76, direction = "up" }, { step = 6, duration = 2, velocity = 84, direction = "up" }, { step = 10, duration = 2, velocity = 76, direction = "up" }, { step = 12, duration = 2, velocity = 66, direction = "down" }, { step = 14, duration = 2, velocity = 84, direction = "up" }] },
]

[accompaniment.chords.spread]
down_gap_ms = 5.0
up_gap_ms = 4.0
up_note_count = 3
gap_jitter = 0.3
anchor = 0.5
tempo_exponent = 0.0
ref_bpm = 120.0
max_spread_ratio = 0.4
velocity_slope = 4
velocity_jitter = 4

[[accompaniment.chords.phrases]]
weight = 3
tag = "sparse"
motifs = [0, 0, 1, 0]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [0, 0]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [0, 0, 0, 2]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
at = "part_end"
motifs = [1, 0]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [3, 3, 4, 3]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [3, 5, 3, 4]

[[accompaniment.chords.phrases]]
weight = 2
tag = "medium"
motifs = [3, 4]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
at = "part_end"
motifs = [3, 5]

[[accompaniment.chords.phrases]]
weight = 3
tag = "dense"
motifs = [6, 6, 6, 7]

[[accompaniment.chords.phrases]]
weight = 2
tag = "dense"
motifs = [6, 7, 6, 6]

[[accompaniment.chords.phrases]]
weight = 2
tag = "dense"
motifs = [6, 7]

[[accompaniment.chords.phrases]]
weight = 3
tag = "dense"
at = "part_end"
motifs = [6, 3]

[instruments]
