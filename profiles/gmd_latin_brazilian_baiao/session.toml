[[variants]]
group = "kit"
name = "standard"
instruments = { percussion_bank = 128, percussion_program = 0 }

[[variants]]
group = "kit"
name = "salle"
instruments = { percussion_bank = 128, percussion_program = 8 }

[[variants]]
group = "kit"
name = "jazz"
instruments = { percussion_bank = 128, percussion_program = 32 }

[[variants]]
group = "kit"
name = "balais"
instruments = { percussion_bank = 128, percussion_program = 40 }

[[variants]]
group = "voicing"
name = "serre"
voicing = "close_triad"

[[variants]]
group = "voicing"
name = "drop_2"
voicing = "drop2"

[[variants]]
