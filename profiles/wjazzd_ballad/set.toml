# Forme longue : chaque set contient un air de trois chorus, raccord direct sans pause, pas d'outro, pas de
# rampe de tempo ni d'intensité. Un seul air par set : les poids de changement de tonalité n'ont pas d'effet ;
# la tonalité vient de la variante de session (`session.toml`) ou, sous la grille de l'utilisateur, de
# `[fixed_tonality]` du profil de l'hôte.
length = [{ tunes = 1, weight = 1 }]

[key]
same = 1.0
parallel = 1.0
relative = 1.0
fifth_up = 1.0
fourth_up = 1.0
step_up = 1.0
step_down = 1.0
other = 1.0
last_dark = 1.0

[[transitions]]
kind = "direct"
weight = 100

[end]
outro = false
gap_bars = [{ bars = 0, weight = 1 }]

[ramp]
tempo_bpm = [[0.0, 0.0], [1.0, 0.0]]
intensity_lift = [[0.0, 0.0], [1.0, 0.0]]
gate = [[0.0, 0.0], [0.2, 1.0], [0.8, 1.0], [1.0, 0.0]]

[signature]
return_rate = 0.0
memory = 1
