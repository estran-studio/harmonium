# Trois chorus par air (une passe de la forme AABA de trente-deux mesures chacun : 96 mesures par air,
# environ 397 s, soit 6 min 37 s à 58 BPM) : exposition, corps, retombée (le nombre de chorus est connu : l'arc joue la
# retombée au dernier). Tout joue dès la première mesure (accompagnement sous une grille, pas de montée en
# couches) ; l'arc (`arc.toml`) module l'intensité, la densité, le feel de basse, le comping et la batterie.
# Pas de piste Melody : absente des entrées.
tours_per_tune = 3

[entries]
