  { step = 14, track = "PercussionHigh", note = 43, delta_velocity = -10 },
  { step = 15, track = "PercussionHigh", note = 41, delta_velocity = -8 },
] }]

# Fin de chorus (la dernière phrase du chorus, la reprise A1' ; `chorus_end` l'emporte sur `part_end`
# à cet endroit) : deux mesures, un roulement de toms descendant sur la seconde. Le tour suivant
# repart sur le stomp ; sans arc, ni tag, rien ne change de la mécanique de fin de phrase.
[[fills]]
density = 1
weight = 7
tag = "stomp"
at = "chorus_end"
start_step = 12
bars = [
  { hits = [{ step = 14, track = "PercussionHigh", note = 41, delta_velocity = -16 }] },
