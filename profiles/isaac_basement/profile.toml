notes = [
  { step = 0, duration = 28, semitones = 0, octave = 1, velocity = 82, legato = true },
  { step = 28, duration = 4, semitones = -1, octave = 1, velocity = 76, legato = true },
]

# R1 (phase 019), P2 `isaac_basement` (références labo isaac-basement,
# proposals/isaac_basement.toml) : motif d'A1 extrait de 02_diptera_sonata (mesures 0-2,
# 0:00,7-0:04,1), soutien 2 sur 7 fenêtres, confiance 0,886 (part de trames voisées).
# Poids rééquilibré au total des motifs d'A1 écrits (3). Variété de basse d'A1 :
# 4,92 → 6,25 signatures distinctes par partie, distance de couche −0,2.
[[accompaniment.bass.motifs]]
part = "A1"
bars = 2
weight = 3
reference = "tonic"
notes = [
  { step = 0, duration = 15, semitones = 0, velocity = 96 },
  { step = 16, duration = 16, semitones = 0, velocity = 96 },
]

# Nappe sombre liée : un plaqué tenu par mesure, médium (center 60).
[accompaniment.chords]
center = 60
max_drift = 6
note_count = 4
default_pattern = 0
patterns = [{ hits = [{ step = 0, direction = "block", duration = 16, velocity = 56, tie = true }] }]

[instruments]
# GeneralUser GS : basse doigts 33, nappe chœur 91, chœur Aahs 52 en dessus.
melody_program = 52
chords_program = 91
bass_program = 33
percussion_bank = 128
percussion_program = 0

# Zones de timbre Odin (Z1), priorité dans l'ordre : étrange (tension >= 0,6),
# combat (arousal >= 0,7), menace (valence <= -0,3), puis le son par défaut,
# validé à l'écoute et inchangé. Niveaux de zone appariés au défaut (RMS du solo
# de piste, ±0,5 dB). Bascule à la frontière de partie suivante (T1).
[[odin.Bass.zones]]
when = { tension = [0.6, 1.0] }
preset = "Bass Low [RM]"
level_db = -14.5
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
when = { arousal = [0.7, 1.0] }
preset = "Growly FM Bass [XR]"
level_db = -13.0
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
when = { valence = [-1.0, -0.3] }
preset = "DeepBass [Photonic]"
level_db = -7.0
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
preset = "Bass Crusher [RM]"
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Chords.zones]]
when = { tension = [0.6, 1.0] }
