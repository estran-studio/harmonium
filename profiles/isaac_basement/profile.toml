# Essai : Basement de The Binding of Isaac (Ridiculon, Repentance), d'après
# Diptera Sonata et Periculum (références labo isaac-basement, G9-G0).
# Données seulement, aucun mécanisme nouveau : mineur harmonique sur D (G1),
# pédales et boucles d'accords par partie (G2), basse motivique liée (G3,
# G7e), forme en boucle sans cadence (G4), nappe liée (G5), pistes tues par
# partie (G7b), Odin par piste (G6d). 4/4 à 140.
# Arche : A1 pédale D1 + relance C#, A2 montée F-G-A-Bb, D descente
# Bb-A-G-F-E (V majeur avec sensible C#), A2 et D repris, pont chromatique G#m-Gm-Fm-C#m à la
# Periculum, reprise A1'. Le chœur n'entre qu'en descente et au pont.
[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"

[meta]
id = "isaac_basement"
name = "Basement de The Binding of Isaac (essai)"
tradition = "The Binding of Isaac, Basement — Ridiculon, 2014-2021"
tags = ["isaac", "basement", "boucle", "sombre"]
corpus = "harmonium_lab corpus/isaac/manifest.jsonl : 02 Diptera Sonata et 21 Periculum, Ridiculon (Matthias Bossi, Jon Evans), droits réservés (analyse et inspiration seulement ; audio, stems et transcriptions hors dépôt)"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 140.0
min_bpm = 120.0
max_bpm = 160.0

# Arche de 40 mesures (A1 A2 D A2 D Pont A1'), deux tours : les frontières de phrase déclenchent les
# fills, sans cadence harmonique.
[form]
sequence = [0, 1, 2, 1, 2, 3, 0]
resolve = "per_tune"
repeat_variation = 0.15
tour_variation = 0.20
variation_operations = ["varied_end", "repeated_notes"]
varied_end_keep = 0.5
avoid_adjacent = false
[[form.parts]]
name = "A1"
melody_center_offset = 0
phrase_ends = [8]
tracks_off = ["Melody"]
roles = ["Open", "Open", "Open", "Open", "Open", "Open", "Open", "Open"]
[[form.parts]]
name = "A2"
melody_center_offset = 0
phrase_ends = [4]
tracks_off = ["Melody"]
roles = ["Open", "Open", "Open", "Open"]
[[form.parts]]
name = "D"
melody_center_offset = 0
phrase_ends = [4]
roles = ["Open", "Free", "Open", "Free"]
[[form.parts]]
name = "Pont"
melody_center_offset = -3
phrase_ends = [8]
# Retombée : la batterie se tait, nappe, basse et chœur seuls.
tracks_off = ["Heel", "Toe"]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 2, mode = "harmonic_minor", weight = 1 }]
[melody.params]
weight_role_run = 2
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 67
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 57
tessitura_max = 77
base_velocity = 58
strong_eighth_velocity_offset = 4
even_eighth_velocity_offset = -4

# Demi-tons relatifs à la tonique D : A1 pédale, A2 i-iv-i, D descente sur
# VI-V-iv-V (V majeur = sensible C#), pont chromatique de Periculum.
[harmony]
model = "loop"
steps_per_chord = 16
default_bars_per_chord = 1
[harmony.parts.A1]
kind = "pedal"
degree = 1
[harmony.parts.A2]
kind = "chord_loop"
chords = [
  { semitones = 0, quality = "Minor", bars = 1 },
  { semitones = 5, quality = "Minor", bars = 1 },
  { semitones = 0, quality = "Minor", bars = 2 },
]
[harmony.parts.D]
kind = "chord_loop"
chords = [
  { semitones = 8, quality = "Major", bars = 1 },
  { semitones = 7, quality = "Major", bars = 1 },
  { semitones = 5, quality = "Minor", bars = 1 },
  { semitones = 7, quality = "Major", bars = 1 },
]
[harmony.parts.Pont]
kind = "chord_loop"
chords = [
  { semitones = 6, quality = "Minor", bars = 2 },
  { semitones = 5, quality = "Minor", bars = 2 },
  { semitones = 3, quality = "Minor", bars = 2 },
  { semitones = 11, quality = "Minor", bars = 2 },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Basse : pédale D1 réattaquée à chaque mesure (relance C#2-D2 en fin de
# cycle), montée et descente d'une note par mesure en D2-Bb2 (registre
# lisible, leçon G7h), liées (G7e). Pont : fondamentale tenue de l'accord.
[accompaniment.bass]
low = 26
high = 37
[[accompaniment.bass.motifs]]
part = "A1"
bars = 2
weight = 1
reference = "tonic"
notes = [
  { step = 0, duration = 16, semitones = 0, velocity = 96 },
  { step = 16, duration = 10, semitones = 0, velocity = 90 },
  { step = 26, duration = 2, semitones = -1, octave = 1, velocity = 86, legato = true },
  { step = 28, duration = 4, semitones = 0, octave = 1, velocity = 98, legato = true },
]
[[accompaniment.bass.motifs]]
part = "A2"
bars = 4
weight = 1
reference = "tonic"
notes = [
  { step = 0, duration = 16, semitones = 3, octave = 1, velocity = 95, legato = true },
  { step = 16, duration = 16, semitones = 5, octave = 1, velocity = 95, legato = true },
  { step = 32, duration = 16, semitones = 7, octave = 1, velocity = 97, legato = true },
  { step = 48, duration = 16, semitones = 8, octave = 1, velocity = 100, legato = true },
]
[[accompaniment.bass.motifs]]
part = "D"
bars = 4
weight = 1
reference = "tonic"
notes = [
  { step = 0, duration = 16, semitones = 8, octave = 1, velocity = 96, legato = true },
  { step = 16, duration = 16, semitones = 7, octave = 1, velocity = 94, legato = true },
  { step = 32, duration = 16, semitones = 5, octave = 1, velocity = 92, legato = true },
  { step = 48, duration = 8, semitones = 3, octave = 1, velocity = 92, legato = true },
  { step = 56, duration = 8, semitones = 2, octave = 1, velocity = 94, legato = true },
]
[[accompaniment.bass.motifs]]
part = "Pont"
bars = 2
weight = 1
reference = "chord_root"
notes = [
  { step = 0, duration = 24, semitones = 0, octave = 1, velocity = 84, legato = true },
  { step = 24, duration = 8, semitones = 1, octave = 1, velocity = 78, legato = true },
]

# Nappe sombre liée : un plaqué tenu par mesure, médium (center 60).
[accompaniment.chords]
center = 60
max_drift = 6
strings = 4
default_pattern = 0
patterns = [{ hits = [{ step = 0, stroke = "block", duration = 16, velocity = 56, tie = true }] }]

[instruments]
# GeneralUser GS : basse doigts 33, nappe chœur 91, chœur Aahs 52 en dessus.
melody_program = 52
chords_program = 91
bass_program = 33
percussion_bank = 128
percussion_program = 0

[odin.Bass]
preset = "Bass Crusher [RM]"
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[odin.Chords]
preset = "Haunt [RM]"
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[mix]
master_db = 9.0
[mix.room]
room_size = 0.3
damping = 0.5
width = 0.6
level = 0.25
[mix.tracks.Melody]
level_db = -8.0
pan = 0.05
reverb_send = 0.2
[mix.tracks.Chords]
level_db = 0.0
pan = -0.3
reverb_send = 0.25
[mix.tracks.Bass]
level_db = 0.0
pan = 0.0
reverb_send = 0.1
[mix.tracks.Heel]
level_db = -5.0
pan = -0.06
reverb_send = 0.06
[mix.tracks.Toe]
level_db = -6.0
pan = 0.06
reverb_send = 0.06
[mix.eq]
highpass_hz = 40.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8

# Groove : micro-timing léger et accent du temps fort sur les deux pieds.
[performance.tracks.Heel]
jitter = 0.02
[[performance.tracks.Heel.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
[performance.tracks.Toe]
jitter = 0.02
[[performance.tracks.Toe.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
