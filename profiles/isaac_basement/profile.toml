notes = [
  { step = 0, duration = 12, semitones = 3, octave = 1, velocity = 94, legato = true },
  { step = 12, duration = 4, semitones = 3, octave = 1, velocity = 84 },
  { step = 16, duration = 16, semitones = 5, octave = 1, velocity = 94, legato = true },
  { step = 32, duration = 16, semitones = 7, octave = 1, velocity = 96, legato = true },
  { step = 48, duration = 16, semitones = 8, octave = 1, velocity = 98, legato = true },
]
[[accompaniment.bass.motifs]]
part = "D"
bars = 4
