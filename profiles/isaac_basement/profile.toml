reference = "tonic"
notes = [
  { step = 0, duration = 16, semitones = 8, octave = 1, velocity = 94, legato = true },
  { step = 16, duration = 16, semitones = 7, octave = 1, velocity = 92, legato = true },
  { step = 32, duration = 16, semitones = 5, octave = 1, velocity = 90, legato = true },
  { step = 48, duration = 12, semitones = 3, octave = 1, velocity = 90, legato = true },
  { step = 60, duration = 4, semitones = 2, octave = 1, velocity = 92, legato = true },
]
[[accompaniment.bass.motifs]]
