# Habillage par graine de `gmd_latin_brazilian_bossa` (A2) : un tirage par groupe, les groupes se combinent ; deux
# groupes ne règlent jamais le même champ. « New seed » doit s'entendre (D6) : tempo, tonalité, instruments, kit, voicings,
# registre, énergie et arc changent d'une graine à l'autre, dans les bornes du style.
#
# SOURCES. Seul le TEMPO a une source : GMD latin/brazilian-bossa 127 BPM (les deux fichiers) ; WJazzD LATIN : tempo de solo
# p10 104, médiane 152,7, p90 227,5, classe 120 à 180 « juste » (15 solos), classe < 120 « trop peu » (un solo avec mesures),
# classe 180 à 240 « trop peu ». Trois plages séparées de plus de 8 BPM, toutes dans la plage mesurée et sans l'étendre :
# lent 104 à 112 (p10 de WJazzD ; classe « trop peu »), médium 122 à 132 (autour des 127 du GMD, classe « juste »), vif 152
# à 180 (de la médiane de WJazzD à la borne de la classe « juste »). Le GMD n'a qu'un tempo : l'étendue des tempos de bossa
# est une limite de la source, écrite dans le README. Tout le reste (tonalités, timbres, kits, voicings, registre, énergie,
# arc « orchestre ») est de MÉTIER : aucune mesure ne relie une tonalité ou un timbre au style.
#
# 3 tempos × 6 tonalités × 5 comping × 3 basses × 4 kits × 5 voicings × 2 registres × 3 énergies × 2 arcs = 64 800 habillages possibles en 33 variantes.

[[variants]]
group = "tempo"
name = "lent"
weight = 1
bpm = [104.0, 112.0]

