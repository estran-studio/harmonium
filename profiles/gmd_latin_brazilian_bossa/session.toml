# Arc « orchestre » : l'orchestration change à chaque frontière de chorus. Chorus 1 aux balais (exposition, charleston) ;
# chorus 2 et 3 : instruments de la session ; sommet : le piano électrique (Tine) prend le comping ; retombée : balais et
# guitare nylon. Les programmes d'un chorus remplacent ceux de la session ; un chorus qui n'en déclare pas les rend. Mêmes
# tags, intensités, densités et breaks que `arc.toml` (valeurs de métier).
[arcs.orchestre]
repeat_from = 1

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { weight = 3, instruments = { percussion_program = 40 }, intensity = 0.7, density = 0.6, comping = [{ tag = "sparse", weight = 3 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "hat" }] },
  { weight = 1, instruments = { percussion_program = 40 }, intensity = 0.8, density = 0.7, comping = [{ tag = "medium" }], percussion = [{ tag = "hat" }] },
]

[[arcs.orchestre.stages]]
choruses = 2
variants = [
  { weight = 2, comping = [{ tag = "medium", weight = 2 }, { tag = "dense", weight = 1 }], percussion = [{ tag = "ride", weight = 3 }, { tag = "hat", weight = 1 }], breaks = [{ start = 9, bars = 1, chance = 0.4, tracks = ["Chords"] }] },
  { weight = 1, intensity = 1.15, density = 1.1, comping = [{ tag = "dense" }], percussion = [{ tag = "ride" }], breaks = [{ start = -1, bars = 1, chance = 0.5, tracks = ["Chords", "Bass"] }] },
]

[[arcs.orchestre.stages]]
choruses = 1
variants = [
  { instruments = { chords_program = 4 }, intensity = 1.3, density = 1.3, comping = [{ tag = "dense" }], percussion = [{ tag = "ride" }], breaks = [{ start = -2, bars = 2, chance = 0.5, tracks = ["Chords", "Bass"], keep_steps = [0] }] },
]

[[arcs.orchestre.fall]]
instruments = { percussion_program = 40, chords_program = 24 }
intensity = 0.6
density = 0.5
comping = [{ tag = "sparse" }]
percussion = [{ tag = "hat" }]
breaks = [{ start = -2, bars = 2, tracks = ["Chords", "Bass"], keep_steps = [0] }]
