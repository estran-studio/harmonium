# Mixage de service (rien de mesuré sur un corpus) : réglé sur le LUFS intégré en solo de chaque piste (48 mesures, graines 1
# et 2, instruments par défaut : nylon, contrebasse, kit jazz), voir README et `b3/gmd_latin_brazilian_bossa_mix.py`. Cibles :
# accords −26, basse −25, batterie −25,5, mix ≈ −21 à −22 LUFS. `PercussionLow` et `PercussionHigh` partagent le canal 9 du kit GM :
# le niveau de `PercussionHigh` gagne pour les deux ; la grosse caisse se règle par la vélocité de sa voix (`percussion.toml`).
[mix]
master_db = 25.0
[mix.room]
room_size = 0.25
damping = 0.6
width = 0.5
level = 0.1
[mix.tracks.Melody]
level_db = 0.0
pan = 0.0
reverb_send = 0.0
[mix.tracks.Chords]
level_db = -16.3
pan = -0.3
reverb_send = 0.1
[mix.tracks.Bass]
level_db = -18.7
pan = 0.0
reverb_send = 0.03
[mix.tracks.PercussionLow]
level_db = -10.0
pan = 0.0
reverb_send = 0.06
[mix.tracks.PercussionHigh]
level_db = -10.0
pan = 0.0
reverb_send = 0.06
[mix.eq]
highpass_hz = 35.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8
