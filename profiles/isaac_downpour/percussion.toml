# Ossature clairsemée de River of Despair (grille §6.2 des références) :
# caisse claire au temps 3 (pas 8), grosse caisse douce aux temps 1 et 2,
# charleston épars seulement à densité 2. Vélocités basses : la batterie
# reste sous la nappe.
#
# Phase 019 vague 4 (R2-jeux) : tags, phrases et relances (A1). Trois tags nommés par l'arc et la
# session : « tapis » (le plus clairsemé : caisse claire seule, respiration de grosse caisse),
# « pouls » (grosse caisse aux temps 1 et 2, comme l'ossature de la référence) et « charleston »
# (le groove de densité 1 de R1). Les `[[fills]]` remplacent les `[[cadence_patterns]]` des trois
# densités : leur contenu est repris tel quel (tags « tapis »), les autres tags en dérivent.
low_note = 36
high_note = 38
low_velocity = 82
high_velocity = 74
percussion_gain = 1.0
velocity_humanize = 4
# Relance de fin de phrase : jamais obligatoire (poids 3 contre les relances de la classe de place),
# la batterie reste clairsemée. Les anciennes cadences jouaient à chaque 8e et 16e mesure.
fills_none_weight = 3

# 0
[[patterns]]
density = 0
tag = "tapis"
hits = [
  { step = 8, track = "PercussionHigh", delta_velocity = -6 },
]

# 1
[[patterns]]
density = 1
weight = 1
tag = "pouls"
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 4, track = "PercussionLow", delta_velocity = -14 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
]

# 2
[[patterns]]
density = 2
weight = 1
tag = "pouls"
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 4, track = "PercussionLow", delta_velocity = -14 },
  { step = 6, track = "PercussionHigh", note = 42, delta_velocity = -36 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
  { step = 14, track = "PercussionHigh", note = 42, delta_velocity = -36 },
]

# Variante de respiration : grosse caisse tardive, nappe toujours au premier plan.
# 3
[[patterns]]
density = 1
weight = 2
tag = "tapis"
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 8, track = "PercussionHigh" },
  { step = 12, track = "PercussionLow", delta_velocity = -18 },
]

# 4
[[patterns]]
density = 2
weight = 2
tag = "tapis"
hits = [
  { step = 0, track = "PercussionLow" },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -36 },
  { step = 8, track = "PercussionHigh" },
  { step = 12, track = "PercussionLow", delta_velocity = -18 },
  { step = 14, track = "PercussionHigh", note = 42, delta_velocity = -36 },
]

# R1 (phase 019), P2 `isaac_downpour` (proposals/isaac_downpour.toml) : groove de densité 1
# extrait de 47_river_of_despair (mesures 20, 22, 24, 26, 28, 30 ; 0:33,7 à 0:50,4), soutien 6
# sur 16 fenêtres, confiance 0,315 (marge de classification moyenne, faible). Poids 3 =
# total des patterns de densité 1 écrits (rééquilibré). Le pattern de densité 2 (0H 2S 4K
# 8S 10K 14S, confiance 0,291, taux d'attaques plus dense que l'écrit : audio −2,1) n'est
# pas retenu : décision du propriétaire du 2026-11-02.
# 5
[[patterns]]
density = 1
weight = 3
tag = "charleston"
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = 0 },
  { step = 4, track = "PercussionHigh", note = 42, delta_velocity = -40 },
  { step = 8, track = "PercussionHigh", delta_velocity = 0 },
  { step = 12, track = "PercussionHigh", note = 42, delta_velocity = -40 },
]

# R2 (phase 019, vague 4) : densité 0 avec la grosse caisse au premier temps, d'après la grille
# §7 du labo (isaac-basement/README.md : « River of Despair : densité 0 seulement (Kick {0},
# Snare {8}) »). Confiance de la grille : moyenne (marge 0,28).
# 6
[[patterns]]
density = 0
weight = 1
tag = "pouls"
hits = [
  { step = 0, track = "PercussionLow", delta_velocity = -8 },
  { step = 8, track = "PercussionHigh", delta_velocity = -6 },
]

# ── Phrases (A1) : suites de patterns de même densité, indices de `[[patterns]]`.
# Les longueurs (4 ou 8 mesures) divisent le bloc de 16 mesures ; une relance de fin de phrase
# tombe donc aux mesures 4, 8, 12 et 16 de chaque partie (les anciennes cadences : 8 et 16).
# Les poids par tag reprennent ceux des patterns (1 pouls : 2 tapis : 3 charleston à densité 1).

# Densité 0 : caisse claire seule ou avec la grosse caisse du premier temps.
