# Essai : Downpour de The Binding of Isaac (Ridiculon, Repentance), d'après
# River of Despair (références labo isaac-basement). Données seulement.
# Tapis lent en D mineur harmonique à 144 : blocs de 16 mesures où chaque
# accord (et sa basse) tient deux mesures — A descente chromatique G→Bb en
# triades mineures parallèles, B élan C-C#-D-Bb-F#-F-E-D#, C montée
# D-G-Bb-C-C#-D-D#-F ; batterie clairsemée, chœur dès B.
# Variantes par graine : descentes A/B et montée C gardent les blocs de
# seize mesures, mais changent un palier mineur ou la relance sensible.
# Basses tenues ou réarticulées pondérées, demi-temps discret alternatif
# aux densités 1/2 et cellules chorales lentes supplémentaires.
# R1 (phase 019, propositions P2 du labo, provenance en commentaire) : une boucle
# de C, deux motifs de basse d'A et, dans percussion.toml, un groove de densité 1
# extraits de River of Despair. Pas de groove de densité 2 (décision du 2026-11-02).
# R2 (phase 019 vague 4) : habillage en groupes, arc sans fin, phrases de batterie ;
# les trois blocs de 16 mesures et les motifs de basse R1 restent inchangés.
[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
session = "session.toml"
arc = "arc.toml"

[meta]
id = "isaac_downpour"
name = "Downpour de The Binding of Isaac (essai)"
tradition = "The Binding of Isaac, Downpour — Ridiculon, 2021"
tags = ["isaac", "downpour", "boucle", "sombre"]
corpus = "harmonium_lab corpus/isaac/manifest.jsonl : 47 River of Despair, Ridiculon (Matthias Bossi, Jon Evans), droits réservés (analyse et inspiration seulement ; audio, stems et transcriptions hors dépôt)"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 144.0
min_bpm = 124.0
max_bpm = 164.0

# Arche de 48 mesures (A B C), un tour ; l'air suivant reprend en A.
[form]
sequence = [0, 1, 2]
resolve = "per_tune"
repeat_variation = 0.15
tour_variation = 0.20
variation_operations = ["varied_end", "repeated_notes"]
varied_end_keep = 0.5
avoid_adjacent = false
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8, 16]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]
[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8, 16]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]
[[form.parts]]
name = "C"
melody_center_offset = 0
phrase_ends = [8, 16]
roles = ["Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free", "Open", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 2, mode = "harmonic_minor", weight = 1 }]
[melody.params]
weight_role_run = 2
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 67
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 57
tessitura_max = 77
base_velocity = 58
strong_eighth_velocity_offset = 4
even_eighth_velocity_offset = -4

# Deux mesures par accord, demi-tons relatifs à D. Triades mineures
# parallèles qui glissent par demi-tons (lecture du labo), Eb majeur
# napolitain et V majeur dans la montée.
[harmony]
model = "loop"
steps_per_chord = 16
[harmony.parts.A]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 5, quality = "m", steps = 32 },
  { semitones = 4, quality = "m", steps = 32 },
  { semitones = 3, quality = "", steps = 32 },
  { semitones = 2, quality = "m", steps = 32 },
  { semitones = 1, quality = "m", steps = 32 },
  { semitones = 0, quality = "m", steps = 32 },
  { semitones = 10, quality = "m", steps = 32 },
  { semitones = 8, quality = "", steps = 32 },
