# R1 (phase 019), P2 `isaac_downpour` (références labo isaac-basement, proposals/isaac_downpour.toml),
# 47_river_of_despair, confiance 0,959 (part de trames voisées), 20 fenêtres. Poids rééquilibrés
# au total des motifs d'A écrits (3, effectifs 3 et 2 → 2 et 1).
# Motif 1 : mesures 24-26 (0:40,4-0:43,7), soutien 3 ; la tierce majeure de l'accord (4 demi-tons
# sans octave) tenue deux mesures. Motif 2 : mesures 26-28 (0:43,7-0:47,0), soutien 2.
[[accompaniment.bass.motifs]]
part = "A"
bars = 2
weight = 2
reference = "chord_root"
notes = [
  { step = 0, duration = 32, semitones = 4, velocity = 84 },
]
[[accompaniment.bass.motifs]]
part = "A"
bars = 2
weight = 1
reference = "chord_root"
notes = [
  { step = 0, duration = 5, semitones = 0, velocity = 84 },
  { step = 5, duration = 8, semitones = 0, octave = 1, velocity = 80, legato = true },
  { step = 14, duration = 15, semitones = 0, octave = 1, velocity = 80 },
  { step = 29, duration = 2, semitones = 1, octave = 1, velocity = 80, legato = true },
]

# Nappe liée : un plaqué tenu par mesure, médium (center 60).
[accompaniment.chords]
center = 60
max_drift = 6
note_count = 4
# Fenêtre commune des voicings de nappe (close / drop2 / open), sans tensions ajoutées.
low = 45
high = 77
default_pattern = 0
patterns = [{ hits = [{ step = 0, direction = "block", duration = 16, velocity = 58, tie = true }] }]
# Règle de métier : nappe lente liée, jamais de comping de jazz ; les phrases
# portent seulement un souffle de vélocité sur les changements d'accord.
comping = [
  { weight = 6, tag = "tenue", hits = [{ step = 0, direction = "block", duration = 16, velocity = 58, tie = true }] },
  { weight = 2, tag = "souffle", hits = [{ step = 0, direction = "block", duration = 16, velocity = 53, tie = true }] },
  { weight = 1, tag = "plein", hits = [{ step = 0, direction = "block", duration = 16, velocity = 62, tie = true }] },
]
[[accompaniment.chords.phrases]]
weight = 4
tag = "tenue"
motifs = [0, 0, 0, 0]
[[accompaniment.chords.phrases]]
weight = 2
tag = "souffle"
motifs = [1, 1, 0, 0]
[[accompaniment.chords.phrases]]
weight = 1
tag = "plein"
motifs = [2, 2, 0, 0]

[instruments]
# GeneralUser GS : basse doigts 33, nappe chaude 89, chœur Aahs 52.
melody_program = 52
chords_program = 89
bass_program = 33
percussion_bank = 128
percussion_program = 0

# Zones de timbre Odin (Z1), priorité dans l'ordre : étrange (tension >= 0,6),
# combat (arousal >= 0,7), menace (valence <= -0,3), puis le son par défaut,
# validé à l'écoute et inchangé. Niveaux de zone appariés au défaut (RMS du solo
# de piste, ±0,5 dB). Bascule à la frontière de partie suivante (T1).
[[odin.Bass.zones]]
when = { tension = [0.6, 1.0] }
preset = "BS PWM Bass XY"
level_db = 9.5
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
when = { arousal = [0.7, 1.0] }
preset = "Growly FM Bass [XR]"
level_db = 1.0
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
when = { valence = [-1.0, -0.3] }
preset = "BS Decay Bass MW"
level_db = 6.0
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Bass.zones]]
preset = "Bass Low [RM]"
morph = [
  { param = "fil1_freq", arousal = 3000.0, tension = 1500.0 },
  { param = "fil1_res", tension = 0.3 },
]

[[odin.Chords.zones]]
when = { tension = [0.6, 1.0] }
preset = "Haunt [RM]"
level_db = 5.0
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[[odin.Chords.zones]]
when = { arousal = [0.7, 1.0] }
preset = "Darken Nature [RM]"
level_db = 3.5
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[[odin.Chords.zones]]
when = { valence = [-1.0, -0.3] }
preset = "Drifter"
level_db = 3.0
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[[odin.Chords.zones]]
preset = "Moonshade"
morph = [
  { param = "fil1_freq", arousal = 2000.0, valence = 1000.0 },
  { param = "env1_release", density = 0.6 },
]

[mix]
master_db = 9.0
[mix.room]
room_size = 0.3
damping = 0.5
width = 0.6
level = 0.25
[mix.tracks.Melody]
level_db = -8.0
pan = 0.05
reverb_send = 0.2
[mix.tracks.Chords]
# Preset Odin plus fort que ceux d'isaac_basement (crête > 0 dBFS au rendu).
level_db = -7.0
pan = -0.3
reverb_send = 0.25
[mix.tracks.Bass]
# Preset Odin plus fort que ceux d'isaac_basement (crête > 0 dBFS au rendu).
level_db = -5.0
pan = 0.0
reverb_send = 0.1
[mix.tracks.PercussionLow]
level_db = -5.0
pan = -0.06
reverb_send = 0.06
[mix.tracks.PercussionHigh]
level_db = -6.0
pan = 0.06
reverb_send = 0.06
[mix.eq]
highpass_hz = 40.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8

# Groove : micro-timing léger et accent du temps fort sur les deux pieds.
[performance.tracks.PercussionLow]
jitter = 0.02
[[performance.tracks.PercussionLow.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
[performance.tracks.PercussionHigh]
jitter = 0.02
[[performance.tracks.PercussionHigh.rules]]
articulation = "Accent"
weight = 4.0
steps = [0]
accent = 4.0
