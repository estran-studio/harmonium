# Forme longue : un set est une suite d'airs de ce profil (même mètre, même forme).
# Schéma et effet à l'oreille : profiles/README.md#forme-longue-set.

# Nombre d'airs d'un set : distribution pondérée (The Session, 105 959 sets de 2 airs ou plus :
# 2 airs 45,2 %, 3 : 44,3 %, 4 : 6,8 %, 5 et plus : 3,8 %, repliés sur 5).
length = [
  { tunes = 2, weight = 45 },
  { tunes = 3, weight = 44 },
  { tunes = 4, weight = 7 },
  { tunes = 5, weight = 4 },
]

# Facteurs sur le poids de base de chaque tonalité candidate selon sa classe de transition
# depuis l'air précédent. Rapports observé / indépendance, reel → reel (80 553 transitions, The Session).
[key]
same      = 1.28   # même tonique, même mode
parallel  = 1.00   # même tonique, autre mode
relative  = 1.02   # même collection diatonique, autre tonique
fifth_up  = 0.97   # tonique +7 demi-tons
fourth_up = 1.01   # tonique +5
step_up   = 0.91   # tonique +2
step_down = 0.73   # tonique −2
other     = 0.75   # autre
last_dark = 0.80   # dernier air du set : facteur des modes sombres (28,9 % contre 36,2 % aux deux premiers airs de 19 771 sets de 3 reels)

# Raccords proposés par l'étude §4.5, à valider à l'oreille (non mesurés dans le corpus).
[[transitions]]
kind = "direct"
weight = 70
[[transitions]]
kind = "call"
weight = 20
bars = 1
[[transitions]]
kind = "held"
weight = 10

[end]
outro = true
gap_bars = [{ bars = 0, weight = 1 }]

# Paliers de médley, borne Garner (+2,6 à +5,5 % pour les reels), étude §4.5.
[ramp]
tempo_bpm = [[0.0, 0.0], [1.0, 8.0]]
intensity_lift = [[0.0, 0.0], [1.0, 0.08]]
gate = [[0.0, 0.0], [0.2, 1.0], [0.8, 1.0], [1.0, 0.0]]
ceiling_bpm = 240.0
