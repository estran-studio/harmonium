[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"

[meta]
id = "marche_britannique_coloniale"
name = "Marche britannique coloniale"
tradition = "Musique militaire britannique, régiments et garnisons d'Amérique du Nord, c. 1760–1840"
tags = ["marche", "march", "britannique", "coloniale", "fifre", "tambour", "1837", "garnison"]
corpus = "Nottingham Music Database, John Chambers AmRev, Cahusac 1809 (25 airs de marche du corpus bascanada/harmonium_lab)"
aliases = ["marche", "march"]

[meter]
time_signature = { numerator = 2, denominator = 2 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 8
pulses_per_bar = 2
default_swing_ratio = 0.5
default_bpm = 108.0
min_bpm = 90.0
max_bpm = 126.0

[form]
sequence = [0, 0, 1, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = [
  "Open",
  { choose = [{ role = { SequenceOf = { bar = 1, shift = [{ degrees = 1, weight = 1 }, { degrees = 4, weight = 1 }] } }, weight = 1176 }, { role = { VariedEndOf = 1 }, weight = 3529 }, { role = "Free", weight = 5295 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 1176 }, { role = { SequenceOf = { bar = 1, shift = [{ degrees = -1, weight = 2 }, { degrees = 2, weight = 1 }] } }, weight = 1765 }, { role = "Free", weight = 7059 }] },
  { choose = [{ role = "CadTonic", weight = 588 }, { role = "CadHalf", weight = 2941 }, { role = "CadOpen", weight = 6471 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 5294 }, { role = { VariedEndOf = 1 }, weight = 1176 }, { role = "Free", weight = 3530 }] },
  { choose = [{ role = { CopyOf = 2 }, weight = 2941 }, { role = { VariedEndOf = 2 }, weight = 2353 }, { role = "Free", weight = 4706 }] },
  { choose = [{ role = { CopyOf = 3 }, weight = 1765 }, { role = { VariedEndOf = 3 }, weight = 588 }, { role = "Free", weight = 7647 }] },
  { choose = [{ role = "CadTonic", weight = 4118 }, { role = "CadHalf", weight = 2353 }, { role = "CadOpen", weight = 3529 }] },
]
second_ending = { choose = [{ role = "CadTonic", weight = 11 }, { role = "CadFifth", weight = 2 }, { role = "CadOther", weight = 1 }] }
[[form.parts]]
name = "B"
melody_center_offset = 2
roles = [
  "Open",
  { choose = [{ role = { VariedEndOf = 1 }, weight = 1111 }, { role = "Free", weight = 8889 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 2222 }, { role = { SequenceOf = { bar = 1, shift = [{ degrees = -1, weight = 2 }, { degrees = 4, weight = 1 }] } }, weight = 1667 }, { role = { VariedEndOf = 1 }, weight = 556 }, { role = "Free", weight = 5555 }] },
  { choose = [{ role = "CadTonic", weight = 1111 }, { role = "CadHalf", weight = 4444 }, { role = "CadOpen", weight = 4445 }] },
  { choose = [{ role = { CopyOf = 1 }, weight = 3333 }, { role = { VariedEndOf = 1 }, weight = 556 }, { role = "Free", weight = 6111 }] },
  { choose = [{ role = { CopyOf = 2 }, weight = 1667 }, { role = { SequenceOf = { bar = 2, shift = [{ degrees = -2, weight = 1 }] } }, weight = 556 }, { role = { VariedEndOf = 2 }, weight = 556 }, { role = "Free", weight = 7221 }] },
  { choose = [{ role = { CopyOf = 3 }, weight = 294 }, { role = { VariedEndOf = 3 }, weight = 588 }, { role = { CopyOfPart = { part = "A", bar = 7 } }, weight = 4706 }, { role = "Free", weight = 4412 }] },
  { choose = [{ role = "CadTonic", weight = 5000 }, { role = "CadHalf", weight = 1667 }, { role = "CadOpen", weight = 3333 }] },
]
second_ending = { choose = [{ role = "CadTonic", weight = 9 }, { role = "CadOther", weight = 1 }] }

[melody]
cell_units = 8
strong_units = [0, 4]
weak_units = [1, 3, 5, 7]
key_modes = [
  { key = 2, mode = "ionian", weight = 6 },
  { key = 7, mode = "ionian", weight = 6 },
  { key = 9, mode = "ionian", weight = 2 },
  { key = 2, mode = "aeolian", weight = 2 },
]

[melody.params]
weight_role_run = 4
weight_role_arp = 4
weight_role_turn = 1
max_continuity_step_distance = 3
continuity_max_retries = 24
melody_center_midi = 84
tonic_midi_min = 74
tonic_midi_max = 86
tessitura_min = 72
tessitura_max = 102
base_velocity = 95
strong_eighth_velocity_offset = 10
even_eighth_velocity_offset = -6

[harmony]
model = "none"
steps_per_chord = 16

[instruments]
melody_program = 72
percussion_bank = 128
percussion_program = 0
