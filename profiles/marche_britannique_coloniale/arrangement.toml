# Arrangement pour la marche britannique coloniale (fifre et tambour).
#
# Pas d'accords, pas de basse. Fifre et tambour jouent ensemble dès le début,
# précédés par une mesure d'intro en décompte de tambour.

tours_per_tune = 3
intro_each_tune = true

[entries]
Melody = { tour = 1, part = 0, pass = 1 }
Heel = { tour = 1, part = 0, pass = 1 }
Toe = { tour = 1, part = 0, pass = 1 }

[intro]
pickup_eighths = 0
each_tune = true

[[intro.forms]]
role = "percussion"
weight = 1
bars = 1
