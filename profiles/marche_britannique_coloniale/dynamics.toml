# Pilotage dynamique de la marche britannique coloniale (fifre et tambour).
#
# Réaction aux 4 émotions (constitution V et P4-T1) :
# - arousal : accélère le pas cadencé (tempo_offset) et renforce les frappes de tambour (feet_velocity)
# - density : intensifie le jeu percussif et active les roulements en doubles-croches (density_feet)
# - tension : accentue les frappes et les flams (strong_accent, tension_offbeat)
# - valence : module la brillance et bascule le mode (ionien / éolien) au prochain air (color, parallel_modes)

