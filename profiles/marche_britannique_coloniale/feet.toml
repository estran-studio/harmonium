# Table de percussion militaire (fifre et tambour) pour la marche britannique coloniale.
#
# Voix :
# - Grosse caisse (Bass drum) : touche GM 36 sur piste Heel (canal MIDI 9)
# - Caisse claire standard (Snare) : touche GM 38 sur piste Toe (canal MIDI 9)
# - Caisse claire flam / coup accentué : touche GM 40 sur piste Toe (canal MIDI 9)
#
# Motifs :
# - Pas cadencé : pulsation de marche aux temps forts (gauche 0, droite 8)
# - Roulements (16ᵉ) : doubles croches soutenues à densité 2
# - Flams : frappes accentuées de conclusion aux cadences (m.4 et m.8)

heel_note = 36
toe_note = 38
heel_velocity = 85
toe_velocity = 80
feet_gain = 1.0
velocity_humanize = 8
intro_tracks = ["Heel", "Toe"]

[[voices]]
name = "bass_drum"
note = 36
velocity = 85
track = "Heel"

[[voices]]
name = "snare"
note = 38
velocity = 80
track = "Toe"

[[voices]]
name = "flam"
note = 40
velocity = 95
track = "Toe"

# -----------------------------------------------------------------------------
# Patterns courants (densités 0, 1, 2)
# -----------------------------------------------------------------------------

[[patterns]]
density = 0
hits = [
  { step = 0, track = "Heel" },
  { step = 4, track = "Toe" },
  { step = 8, track = "Heel" },
  { step = 12, track = "Toe" },
]

[[patterns]]
density = 1
hits = [
  { step = 0, track = "Heel" },
  { step = 0, track = "Toe" },
  { step = 4, track = "Toe" },
  { step = 6, track = "Toe" },
  { step = 7, track = "Toe", delta_velocity = -15 },
  { step = 8, track = "Heel" },
  { step = 8, track = "Toe" },
  { step = 12, track = "Toe" },
  { step = 14, track = "Toe" },
]

[[patterns]]
density = 2
hits = [
  { step = 0, track = "Heel" },
  { step = 0, track = "Toe" },
  { step = 4, track = "Toe" },
  { step = 6, track = "Toe" },
  { step = 7, track = "Toe", delta_velocity = -10 },
  { step = 8, track = "Heel" },
  { step = 8, track = "Toe" },
  { step = 9, track = "Toe", delta_velocity = -8 },
  { step = 10, track = "Toe" },
  { step = 11, track = "Toe", delta_velocity = -8 },
  { step = 12, track = "Toe" },
  { step = 13, track = "Toe", delta_velocity = -8 },
  { step = 14, track = "Toe" },
  { step = 15, track = "Toe" },
]

