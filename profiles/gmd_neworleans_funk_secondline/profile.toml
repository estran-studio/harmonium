# Profil `gmd_neworleans_funk_secondline` (phase 019, B7) : accompagnement New Orleans, second line
# et funk de la Nouvelle-Orléans, sous une grille d'accords.
#
# Le nom est celui des sources qui définissent le style (principe VII) : les styles
# `neworleans/funk` (8 fichiers `beat` de 4 batteurs, « assez » ; 40 `fill` de 2 batteurs, « juste »)
# et `neworleans/secondline` (3 fichiers `beat` de 2 batteurs, « juste ») du Groove MIDI Dataset
# v1.0.0, soit 51 des 53 fichiers `neworleans` ; `neworleans/chacha` et `neworleans/shuffle`
# (un fichier chacun, « trop peu ») ne sont pas lus. La batterie (patterns, phrases, relances), le
# feel et les tempos viennent de là. La basse (tuba) et le comping (piano) n'ont aucune source
# ouverte : règles de métier, documentées dans `README.md`. Aucune mesure de basse de WJazzD n'est
# reprise (aucun sous-ensemble New Orleans).
#
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : basse, comping et
# batterie ne dépendent que de l'accord publié. Les cinq grilles par défaut, quand l'utilisateur
# n'en fournit pas, sont des formes communes écrites ici (pas des partitions) de douze mesures : le
# blues de la Nouvelle-Orléans et des vamps à un ou deux accords. Tonique si bémol pour toutes
# (tonalité des fanfares), verrouillée ; la grille s'écrit relative. Aucune réharmonisation (D4).
#
# Aucune mélodie (piste `Melody` absente de l'arrangement). Tout sonne avec GeneralUser GS (tuba,
# piano, kit standard) : aucune banque ni preset Odin.
[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
arc = "arc.toml"

[meta]
id = "gmd_neworleans_funk_secondline"
name = "New Orleans, second line et funk (Groove MIDI Dataset, neworleans)"
tradition = "Groove MIDI Dataset v1.0.0, styles neworleans/funk (8 fichiers beat, 40 fills) et neworleans/secondline (3 fichiers beat) : 4 batteurs, kit électronique Roland TD-11 ; basse et comping par règles de métier"
tags = ["neworleans", "second-line", "funk", "accompagnement", "grille"]
corpus = """\
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; probabilités par pas, groupes de mesures, phrases et relances de la batterie New Orleans, agrégés, jamais un enregistrement. \
Manifestes et mesures : harmonium_lab corpus/gmd, references/gmd-neworleans/, references/gmd-neworleans-funk/, references/gmd-neworleans-secondline/. Grilles par défaut, basse et comping : formes et règles de métier écrites pour ce profil (voir README)."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# Feel droit en 16 pas (GMD neworleans : 11 fichiers beat sur 11 « straight » ; rapport de swing
# médian 0,50, secondline p90 0,53).
default_swing_ratio = 0.5
# GMD neworleans/funk + secondline, 11 fichiers beat : 82 à 124 BPM, médiane 93 (funk 82 à 102,
# médiane 90 ; secondline 94 à 124, médiane 99).
default_bpm = 93.0
min_bpm = 82.0
max_bpm = 124.0

[fixed_tonality]
key = 10
mode = "mixolydian"

# Une partie de douze mesures : un chorus (la longueur du blues de la Nouvelle-Orléans).
[form]
sequence = [0]
[[form.parts]]
name = "Grille"
melody_center_offset = 0
phrase_ends = [4, 8, 12]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

# Pas de mélodie jouée : mêmes réglages neutres que `wjazzd_swing`.
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 10, mode = "mixolydian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

# Grilles relatives à la tonique (si bémol) ; un créneau de quatre pas (une noire).
[harmony]
model = "loop"
steps_per_chord = 4

[harmony.parts.Grille]
kind = "chord_loop"
loops = [
  # Blues de la Nouvelle-Orléans : I7 IV7 I7 I7 | IV7 IV7 I7 I7 | V7 IV7 I7 | I7 V7 à la blanche.
  { weight = 4, chords = [
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 5, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 5, quality = "7", steps = 32 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 5, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 8 },
    { semitones = 7, quality = "7", steps = 8 },
  ] },
  # Blues à changement rapide : IV7 dès la deuxième mesure, V7 au neuvième.
  { weight = 3, chords = [
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 5, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 5, quality = "7", steps = 32 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 5, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 32 },
  ] },
  # Vamp à deux accords : I7 pendant huit mesures, IV7 pendant quatre.
  { weight = 3, chords = [
    { semitones = 0, quality = "7", steps = 128 },
    { semitones = 5, quality = "7", steps = 64 },
  ] },
  # Vamp sur un accord : douze mesures de I9.
  { weight = 2, chords = [
    { semitones = 0, quality = "9", steps = 192 },
  ] },
  # Forme de fanfare : I6 (2), V7 (2), I6 (2), IV (1), IVm (1), I6 (2), V7 (1), I6 (1).
  { weight = 2, chords = [
    { semitones = 0, quality = "6", steps = 32 },
    { semitones = 7, quality = "7", steps = 32 },
    { semitones = 0, quality = "6", steps = 32 },
    { semitones = 5, quality = "", steps = 16 },
    { semitones = 5, quality = "m", steps = 16 },
    { semitones = 0, quality = "6", steps = 32 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 0, quality = "6", steps = 16 },
  ] },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Basse : tuba (GeneralUser GS 58), registre 28..39 pour la fondamentale (E1 à D#2 ; la tonique si
# bémol tombe sur 34). Riffs d'une ou deux mesures écrits par règles de métier : deux temps
# (fondamentale sur le un, quinte sur le trois), syncopes sur les positions de la grosse caisse
# du second line (GMD neworleans/secondline, pas 0, 3, 6, 8, 11, 14, 7 % des mesures et le plus
# fréquent), marche de quatre noires. Aucune mesure de basse (WJazzD n'a pas de sous-ensemble New
# Orleans) ; intervalles sans tierce (la qualité de l'accord n'est pas connue du riff).
[accompaniment.bass]
low = 28
high = 39
walk_low = 26
walk_high = 52
motifs = [
  # 1. Deux temps : fondamentale blanche, quinte blanche.
  { bars = 1, weight = 5, reference = "chord_root", notes = [
    { step = 0, duration = 7, semitones = 0, velocity = 100 },
    { step = 8, duration = 7, semitones = 7, octave = -1, velocity = 92 },
  ] },
  # 2. Deux temps syncopé : un, le « et » du deux, trois et la levée du quatre.
  { bars = 1, weight = 4, reference = "chord_root", notes = [
    { step = 0, duration = 5, semitones = 0, velocity = 100 },
    { step = 6, duration = 2, semitones = 7, octave = -1, velocity = 86 },
    { step = 8, duration = 5, semitones = 0, velocity = 96 },
    { step = 14, duration = 2, semitones = 7, octave = -1, velocity = 84 },
  ] },
  # 3. Positions de la grosse caisse du second line : pas 0, 3, 6, 8, 11, 14.
  { bars = 1, weight = 4, reference = "chord_root", notes = [
    { step = 0, duration = 3, semitones = 0, velocity = 104 },
    { step = 3, duration = 3, semitones = 0, velocity = 88 },
    { step = 6, duration = 2, semitones = 7, octave = -1, velocity = 84 },
    { step = 8, duration = 3, semitones = 0, velocity = 98 },
    { step = 11, duration = 3, semitones = 0, velocity = 86 },
    { step = 14, duration = 2, semitones = 0, octave = 1, velocity = 80 },
  ] },
  # 4. Marche de quatre noires : fondamentale, quinte, fondamentale, septième mineure.
  { bars = 1, weight = 3, reference = "chord_root", notes = [
    { step = 0, duration = 4, semitones = 0, velocity = 98 },
    { step = 4, duration = 4, semitones = 7, octave = -1, velocity = 86 },
    { step = 8, duration = 4, semitones = 0, velocity = 94 },
    { step = 12, duration = 4, semitones = 10, octave = -1, velocity = 84 },
  ] },
  # 5. Croches : fondamentale et octave, appuyées sur le un et le trois.
  { bars = 1, weight = 2, reference = "chord_root", notes = [
    { step = 0, duration = 2, semitones = 0, velocity = 100 },
    { step = 2, duration = 2, semitones = 0, octave = 1, velocity = 78 },
    { step = 4, duration = 2, semitones = 0, velocity = 84 },
    { step = 6, duration = 2, semitones = 0, octave = 1, velocity = 76 },
    { step = 8, duration = 2, semitones = 0, velocity = 96 },
    { step = 10, duration = 2, semitones = 0, octave = 1, velocity = 78 },
    { step = 12, duration = 2, semitones = 0, velocity = 84 },
    { step = 14, duration = 2, semitones = 7, octave = -1, velocity = 82 },
  ] },
  # 6. Deux mesures : syncope du second line puis deux temps.
  { bars = 2, weight = 3, reference = "chord_root", notes = [
    { step = 0, duration = 3, semitones = 0, velocity = 104 },
    { step = 3, duration = 3, semitones = 0, velocity = 88 },
    { step = 6, duration = 2, semitones = 7, octave = -1, velocity = 84 },
    { step = 8, duration = 3, semitones = 0, velocity = 98 },
    { step = 11, duration = 3, semitones = 0, velocity = 86 },
    { step = 14, duration = 2, semitones = 0, octave = 1, velocity = 80 },
    { step = 16, duration = 7, semitones = 0, velocity = 100 },
    { step = 24, duration = 7, semitones = 7, octave = -1, velocity = 90 },
  ] },
  # 7. Tenue : une ronde.
  { bars = 1, weight = 1, reference = "chord_root", notes = [
    { step = 0, duration = 16, semitones = 0, velocity = 96 },
  ] },
]

# Approche d'un changement d'accord, un temps avant la cible : valeurs de service (aucune mesure de
# basse New Orleans), chromatique plutôt que diatonique comme les lignes de fanfare.
[accompaniment.bass.passing]
none_weight = 60
density = [[0.0, 0.2], [0.5, 1.0], [1.0, 1.8]]
phrase = [[0.0, 1.0], [1.0, 1.0]]
avoid_melody_intervals = []
rules = [
  { when = "next_target_differs", before = [4], motion = "chromatic", weight = 28, duration = 2, velocity_delta = -14, min_leap = 0 },
  { when = "next_target_differs", before = [4], motion = "scale_step", weight = 12, duration = 2, velocity_delta = -14, min_leap = 0 },
]

# Comping : piano (GeneralUser GS 0) en accords à quatre sons (drop 2) sur des rythmes syncopés du
# second line (3-3-2 des pas 0, 3, 6, 8, 11, 14 de la grosse caisse), des contretemps et des
# tenues. Règles de métier (aucun corpus ouvert de comping, décision F3 de 018). Étiquettes
# `sparse` / `medium` / `dense` : l'arc nomme celles d'un chorus.
[accompaniment.chords]
center = 62
max_drift = 8
default_pattern = 0
voicing = "drop2"
low = 48
high = 76
patterns = [{ hits = [{ step = 0, direction = "block", duration = 8, velocity = 72 }, { step = 8, direction = "block", duration = 8, velocity = 68 }] }]
comping = [
  # 0-3 : clairsemé, tenues.
  { weight = 4, tag = "sparse", hits = [{ step = 0, duration = 14, velocity = 70 }] },
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 6, velocity = 74 }, { step = 8, duration = 6, velocity = 68 }] },
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 3, velocity = 76 }, { step = 6, duration = 2, velocity = 62 }, { step = 14, duration = 2, velocity = 66, anticipate = true }] },
  { weight = 1, tag = "sparse", hits = [] },
  # 4-7 : médian.
  { weight = 4, tag = "medium", hits = [{ step = 0, duration = 3, velocity = 80 }, { step = 3, duration = 3, velocity = 68 }, { step = 6, duration = 2, velocity = 64 }, { step = 8, duration = 3, velocity = 76 }, { step = 11, duration = 3, velocity = 66 }, { step = 14, duration = 2, velocity = 66, anticipate = true }] },
  { weight = 3, tag = "medium", hits = [{ step = 2, duration = 2, velocity = 72 }, { step = 6, duration = 2, velocity = 68 }, { step = 10, duration = 2, velocity = 72 }, { step = 14, duration = 2, velocity = 68 }] },
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 2, velocity = 82 }, { step = 3, duration = 2, velocity = 66 }, { step = 8, duration = 2, velocity = 78 }, { step = 11, duration = 2, velocity = 64 }] },
  { weight = 2, tag = "medium", hits = [{ step = 0, duration = 5, velocity = 78 }, { step = 6, duration = 2, velocity = 66 }, { step = 10, duration = 2, velocity = 70 }, { step = 12, duration = 3, velocity = 74 }] },
  # 8-11 : dense, croches et doubles croches.
  { weight = 4, tag = "dense", hits = [{ step = 0, duration = 2, velocity = 84 }, { step = 2, duration = 1, velocity = 66 }, { step = 3, duration = 1, velocity = 62 }, { step = 4, duration = 2, velocity = 76 }, { step = 6, duration = 2, velocity = 68 }, { step = 8, duration = 2, velocity = 82 }, { step = 10, duration = 1, velocity = 66 }, { step = 11, duration = 1, velocity = 62 }, { step = 12, duration = 2, velocity = 76 }, { step = 14, duration = 2, velocity = 68, anticipate = true }] },
  { weight = 3, tag = "dense", hits = [{ step = 0, duration = 1, velocity = 84 }, { step = 1, duration = 1, velocity = 58 }, { step = 3, duration = 1, velocity = 70 }, { step = 4, duration = 1, velocity = 78 }, { step = 6, duration = 1, velocity = 66 }, { step = 7, duration = 1, velocity = 60 }, { step = 8, duration = 1, velocity = 82 }, { step = 9, duration = 1, velocity = 58 }, { step = 11, duration = 1, velocity = 70 }, { step = 12, duration = 1, velocity = 78 }, { step = 14, duration = 1, velocity = 66 }, { step = 15, duration = 1, velocity = 62 }] },
  { weight = 3, tag = "dense", hits = [{ step = 0, duration = 3, velocity = 86 }, { step = 3, duration = 1, velocity = 66 }, { step = 4, duration = 1, velocity = 60 }, { step = 7, duration = 1, velocity = 68 }, { step = 8, duration = 3, velocity = 84 }, { step = 11, duration = 1, velocity = 66 }, { step = 12, duration = 1, velocity = 60 }, { step = 15, duration = 1, velocity = 68, anticipate = true }] },
  { weight = 2, tag = "dense", hits = [{ step = 0, duration = 2, velocity = 86 }, { step = 2, duration = 2, velocity = 70 }, { step = 4, duration = 2, velocity = 78 }, { step = 6, duration = 2, velocity = 70 }, { step = 8, duration = 2, velocity = 84 }, { step = 10, duration = 2, velocity = 70 }, { step = 12, duration = 2, velocity = 78 }, { step = 14, duration = 2, velocity = 72, anticipate = true }] },
]
# Phrases de 2 et 4 mesures : suites des motifs ci-dessus (indices 0..11), règles de métier.
phrases = [
  { weight = 3, tag = "sparse", motifs = [0, 0, 1, 0] },
  { weight = 3, tag = "sparse", motifs = [1, 1, 2, 1] },
  { weight = 2, tag = "sparse", motifs = [0, 3] },
  { weight = 2, tag = "sparse", motifs = [2, 2] },
  { weight = 3, tag = "sparse", at = "part_end", motifs = [1, 1, 2, 0] },
  { weight = 3, tag = "medium", motifs = [4, 4, 5, 4] },
  { weight = 3, tag = "medium", motifs = [4, 6, 4, 6] },
  { weight = 2, tag = "medium", motifs = [5, 7, 5, 7] },
  { weight = 2, tag = "medium", motifs = [4, 5] },
  { weight = 2, tag = "medium", motifs = [6, 6] },
  { weight = 3, tag = "medium", at = "part_end", motifs = [4, 4, 5, 7] },
  { weight = 3, tag = "dense", motifs = [8, 8, 9, 8] },
  { weight = 3, tag = "dense", motifs = [9, 10, 9, 10] },
  { weight = 2, tag = "dense", motifs = [8, 11, 8, 11] },
  { weight = 2, tag = "dense", motifs = [10, 10] },
  { weight = 2, tag = "dense", motifs = [8, 9] },
  { weight = 3, tag = "dense", at = "part_end", motifs = [8, 8, 9, 11] },
]

[instruments]
melody_program = 0
chords_program = 0
bass_program = 58
percussion_bank = 128
percussion_program = 0

[ornaments]
rate_scale = 0.0

# Micro-timing de la batterie : médianes du GMD neworleans/funk et secondline (écart à la grille,
# en pas) : sur le temps −0,08 à −0,12 (grosse caisse, caisse claire, pédale), hors temps de −0,06
# à +0,08 : derrière le temps sur les contretemps. Valeurs reprises en arrondi, dispersion 0,12 à
# 0,20 pas bornée à 0,1 par le moteur.
[performance.tracks.PercussionLow]
offsets = [-0.09, 0.0, 0.02, -0.06, -0.09, 0.0, 0.02, -0.06, -0.09, 0.0, 0.02, -0.06, -0.09, 0.0, 0.02, -0.06]
jitter = 0.08
[performance.tracks.PercussionHigh]
offsets = [-0.09, 0.0, 0.02, -0.04, -0.09, 0.0, 0.02, -0.04, -0.09, 0.0, 0.02, -0.04, -0.09, 0.0, 0.02, -0.04]
jitter = 0.08
[performance.tracks.Bass]
jitter = 0.04
[performance.tracks.Chords]
jitter = 0.05

# Mixage de service, réglé sur le LUFS en solo de chaque piste (README).
[mix]
master_db = 25.0
[mix.room]
room_size = 0.3
damping = 0.6
width = 0.55
level = 0.12
[mix.tracks.Melody]
level_db = 0.0
pan = 0.0
reverb_send = 0.0
[mix.tracks.Chords]
level_db = -19.0
pan = -0.25
reverb_send = 0.12
[mix.tracks.Bass]
level_db = -11.0
pan = 0.0
reverb_send = 0.04
[mix.tracks.PercussionLow]
level_db = -19.0
pan = 0.0
reverb_send = 0.08
[mix.tracks.PercussionHigh]
level_db = -19.0
pan = 0.0
reverb_send = 0.08
[mix.eq]
highpass_hz = 35.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8
