# Profil `wjazzd_swing` (phase 018, E7 ; phase 019, B1) : accompagnement swing sous une grille d'accords.
#
# Le nom est celui de la source qui définit le style (principe VII) : le sous-ensemble
# `rhythmfeel = SWING` de la Weimar Jazz Database v2.1 (361 solos, parutions de 1937 à 2007,
# styles SWING, BEBOP, COOL, HARDBOP, POSTBOP, FREE). Il ne dit rien des couches d'appoint :
# la batterie vient du Groove MIDI Dataset (jazz, jazz/swing), le rapport de swing et le
# placement des instruments de la Jazz Trio Database. Les valeurs sont fixées par les mesures
# du labo (`references/wjazzd-swing/`, commande `python -m harmonium_lab.backing.engine_values`) ;
# la table « mesure → paramètre » est dans `README.md`.
#
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : la basse (marche),
# les accords (voicings, rythmes et phrases de comping) et la batterie ne dépendent que de
# l'accord publié. Les grilles par défaut, quand l'utilisateur n'en fournit pas, sont des formes
# communes écrites ici (pas des partitions) : un blues de douze mesures (quatre variantes de la
# forme) puis une forme AABA sur la progression dite « rhythm changes » (voir README, provenance
# et droits). Une boucle est tirée par partie et par graine ; elles ne servent que sans grille
# utilisateur (D4 : aucune réharmonisation sous une grille fournie).
#
# Phase 019, B1 : ce qui change d'une graine à l'autre (`session.toml`, A2) est le tempo (sous-plages
# de la distribution des solos), la tonalité, le comping (piano, guitare, orgue), la basse, le kit
# (baguettes ou balais, plus probables aux tempos lents), la famille de voicings, le registre,
# l'énergie et l'arc sur plusieurs chorus (`arcs` de `session.toml`, A3) ; la batterie et le comping
# jouent par phrases (A1) ; la basse a ses options mesurées (A4) ; le rapport de swing suit le tempo
# piste par piste (`swing.toml`, A6, JTD). Pas de `[fixed_tonality]` : la tonalité vient de la
# graine ; un hôte qui impose la sienne (grille de training) la fait gagner sur la variante (A2).
#
# Mélodie (E12) : une piste `Melody` jouée par un saxophone ténor, cellules synthétisées depuis des
# statistiques agrégées de WJazzD (les solos sont sous droits : aucune phrase n'est copiée), voir
# `cells.toml`. Coupable par `EnableMelody(false)` (impro de training).
[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
session = "session.toml"
swing = "swing.toml"

[meta]
id = "wjazzd_swing"
name = "Accompagnement swing (Weimar Jazz Database, sous-ensemble swing)"
tradition = "Weimar Jazz Database v2.1, sous-ensemble rhythmfeel = SWING : 361 solos, parutions de 1937 à 2007 ; batterie du Groove MIDI Dataset (jazz) ; timing et swing selon le tempo de la Jazz Trio Database"
tags = ["jazz", "swing", "accompagnement", "grille"]
corpus = """\
Contains information from the Weimar Jazz Database (Jazzomat Research Project, HfM Weimar), which is made available here under the Open Database License (ODbL) 1.0, https://opendatacommons.org/licenses/odbl/1-0/ ; individual contents under the Database Contents License (DbCL) 1.0, https://opendatacommons.org/licenses/dbcl/1-0/. \
Statistiques agrégées seulement (basse par temps, rythme harmonique, tempos, formes, mélodie : rythmes en croches, pas diatoniques, cibles sur les temps, cadences, longueur des phrases) ; aucune note de solo, aucune phrase de solo ni ligne de basse copiée : les cellules de `cells.toml` sont synthétisées depuis ces statistiques et toute cellule qui reprendrait une suite de 6 notes (pas et durées) ou de 7 notes (pas) d'un solo est refusée à la génération (Produced Work, ODbL §4.3). \
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; probabilités par pas, suites de figures et relances agrégées de la batterie jazz, jamais un enregistrement. \
Jazz Trio Database v0.2, MIT License, Copyright (c) Huw Cheston et al. : H. Cheston, J. L. Schlichting, I. Cross, P. M. C. Harrison, TISMIR 2024, https://doi.org/10.5334/tismir.186 ; rapport de swing par tempo et par piste, placement relatif des instruments, agrégés. \
Manifestes et mesures : harmonium_lab corpus/wjazzd, corpus/gmd, corpus/jtd, references/wjazzd-swing/, references/wjazzd-melodie/, references/jtd-swing-tempo/. Grilles par défaut : formes communes écrites pour ce profil (voir README)."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# JTD, rapport de swing de la batterie au plateau de sa courbe (`swing.toml`, 140 BPM et moins) : 0,7213.
# Le rapport réel suit le tempo piste par piste ; cette valeur est celle que l'hôte demande par défaut
# (aucun décalage des courbes tant que la demande lui est égale).
default_swing_ratio = 0.7213
# Tempo de repli quand la graine n'en tire pas (la session le remplace : `session.toml`, groupe `rythme`).
# WJazzD, tempo moyen par solo (swing) : médiane 177,5, blues 147,4 ; centiles 10 et 90 : 93 et 284.
default_bpm = 150.0
min_bpm = 90.0
max_bpm = 285.0

# Un tour : le blues de douze mesures, puis la forme AABA de trente-deux mesures (44 mesures). C'est
# le chorus de l'arc de `session.toml` ; une grille d'un hôte (une partie de N mesures) le remplace.
[form]
sequence = [0, 1, 1, 2, 1]
# Variation de la mélodie (règle de métier, rien de mesuré) : la reprise d'un A et chaque chorus suivant
# varient une part des mesures (fin variée, note répétée remplacée par sa voisine) ; sans elle, les quatre
# chorus rejouent les mêmes notes. Pas d'opération `octave` : elle ajoute des sauts de plus d'une octave
# (22 demi-tons mesurés) que les solos n'ont pas. Le schéma AABA reste lisible.
repeat_variation = 0.25
tour_variation = 0.35
variation_operations = ["varied_end", "repeated_notes"]
# Phrases de quatre mesures : ouverture, trois mesures libres dont la demi-cadence (m.4), reprise, fin
# sur la tonique (m.8 ou m.12). `phrase_ends` reste celui de la batterie (une phrase par partie).
[[form.parts]]
name = "Blues"
melody_center_offset = 0
phrase_ends = [12]
roles = ["Open", "Free", "Free", "CadHalf", "Open", "Free", "Free", "CadHalf", "Open", "Free", "Free", "CadFull"]

[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "CadHalf", "Open", "Free", "Free", "CadFull"]

[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "CadHalf", "Open", "Free", "Free", "CadHalf"]


# Mélodie (E12) : cellules synthétisées depuis les statistiques de la Weimar Jazz Database (`cells.toml`,
# `references/wjazzd-melodie/` du labo), jamais une phrase de solo. Les rôles libres se tirent selon les
# parts mesurées des mesures ni ouvrantes ni cadentielles (conjoint 21, arpège 6, broderie 16).
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 5, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 21
weight_role_arp = 6
weight_role_turn = 16
max_continuity_step_distance = 2
continuity_max_retries = 8
# Registre : centiles 5, 50 et 95 des hauteurs des solos swing de WJazzD (`measures-melody.json`,
# `register` : 53, 65, 77), concert.
melody_center_midi = 65
tonic_midi_min = 58
tonic_midi_max = 69
tessitura_min = 53
tessitura_max = 77
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

# Grilles relatives à la tonique (la tonalité de la graine) ; un créneau de quatre pas (une noire) :
# chaque changement d'accord tombe sur une pulsation de la marche.
[harmony]
model = "loop"
steps_per_chord = 4

# Blues de douze mesures : quatre variantes de la forme, tirées par graine (poids ≈ fréquence d'usage
# dans les recueils : la forme simple et celle de jazz, qui ajoute les ii-V, dominent). Un accord par
# mesure sauf aux ii-V et au turnaround : WJazzD (measures-bass.json, groupe blues) a 92 % de mesures
# à un accord, 8 % à deux, changement au temps 1 dans 89 % des cas.
#   1. forme simple      I7 IV7 I7 I7 | IV7 IV7 I7 I7 | ii7 V7 I7 | I7 V7 (blanches à la mesure 12)
#   2. changement rapide I7 IV7 I7 I7 | IV7 IV7 I7 VI7 | ii7 V7 I7 | I7 V7
#   3. blues de jazz     I7 IV7 I7 v7-I7 | IV7 #ivdim7 I7 iii7-VI7 | ii7 V7 I7-VI7 | ii7-V7
#   4. sous-dominante mineure : I7 IV7 I7 I7 | IV7 ivm7-bVII7 I7 VI7 | ii7 V7 I7 | I7 V7
# Toutes les qualités sont des symboles de formes publiées (voir README, provenance et droits).
[harmony.parts.Blues]
kind = "chord_loop"
loops = [
  { weight = 3, chords = [
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 5, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 5, quality = "7", steps = 32 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 2, quality = "m7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 8 },
    { semitones = 7, quality = "7", steps = 8 },
  ] },
  { weight = 2, chords = [
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 5, quality = "7", steps = 16 },
    { semitones = 0, quality = "7", steps = 32 },
    { semitones = 5, quality = "7", steps = 32 },
    { semitones = 0, quality = "7", steps = 16 },
    { semitones = 9, quality = "7", steps = 16 },
    { semitones = 2, quality = "m7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
