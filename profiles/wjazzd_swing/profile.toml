# Forme AABA sur la progression dite « rhythm changes », écrite en fa (la tonique du profil) : deux
# versions de A (la seconde garde le I6 aux mesures 1 et 3, sans le iii7 du tour d'origine), deux
# de B (le cycle des dominantes à deux mesures par accord ; le même cycle en ii-V, une mesure par
# accord). A (huit mesures) : I6 VI7 | ii7 V7 | iii7 VI7 | ii7 V7 | v7 I7 (sous-dominante) | IV6 IVm |
# I6/V VI7 | ii7 V7 (retour sur I6).
[harmony.parts.A]
kind = "chord_loop"
loops = [
  { weight = 3, chords = [
    { semitones = 0, quality = "6", steps = 8 },
    { semitones = 9, quality = "7", steps = 8 },
    { semitones = 2, quality = "m7", steps = 8 },
    { semitones = 7, quality = "7", steps = 8 },
    { semitones = 4, quality = "m7", steps = 8 },
    { semitones = 9, quality = "7", steps = 8 },
    { semitones = 2, quality = "m7", steps = 8 },
    { semitones = 7, quality = "7", steps = 8 },
    { semitones = 7, quality = "m7", steps = 8 },
    { semitones = 0, quality = "7", steps = 8 },
    { semitones = 5, quality = "6", steps = 8 },
    { semitones = 5, quality = "m6", steps = 8 },
    { semitones = 0, quality = "6", bass = 7, steps = 8 },
    { semitones = 9, quality = "7", steps = 8 },
    { semitones = 2, quality = "m7", steps = 8 },
    { semitones = 7, quality = "7", steps = 8 },
  ] },
