# Tempo, kit, tonalité, comping, basse, voicings, registre, énergie et arc : `session.toml` (A2).
[instruments]
# Saxophone ténor (programme 66 de GeneralUser GS, banque 0) : voix de tête d'un solo de swing.
melody_program = 66
chords_program = 0
bass_program = 32
percussion_bank = 128
percussion_program = 32

[ornaments]
rate_scale = 0.0

# Placement relatif (JTD, 976 pistes, médianes) : la batterie est la référence, la basse tombe
# avec elle (médiane 0,000 pas), le piano est en retard de 0,226 pas (+20 ms). Jitter borné à
# 0,1 pas par le moteur (écart-type mesuré 0,22 pas pour la basse, 0,33 pour le piano, dont le
# bruit de détection à 10 ms). Le rapport de swing de chaque piste suit le tempo (`swing.toml`) ; il est
# mesuré sur les contretemps du piano (déjà en retard) : le retard de 0,2 pas ne s'applique donc qu'aux
# temps (pas 0, 4, 8, 12), sinon il s'ajouterait au rapport (mesuré sur le MIDI : +0,03 de la courbe JTD).
[performance.tracks.Bass]
jitter = 0.1
[performance.tracks.Chords]
offsets = [0.2, 0.0, 0.0, 0.0, 0.2, 0.0, 0.0, 0.0, 0.2, 0.0, 0.0, 0.0, 0.2, 0.0, 0.0, 0.0]
jitter = 0.1

# Mixage de service (rien de mesuré sur un corpus). Écoute du propriétaire (2026-11-02) : la
# batterie couvrait tout à 0 dB. Elle passe à −9 dB : ride à −33,7 LUFS en solo, environ 8 LU
# sous la basse (−25,4) et les accords (−25,8) ; master remonté de 2 dB pour garder le volume.
[mix]
master_db = 25.0
[mix.room]
room_size = 0.3
damping = 0.6
width = 0.6
level = 0.15
[mix.tracks.Melody]
# Mixage de service (E12, rien de mesuré) : la ligne est la voix de tête, au-dessus du comping (−14 dB)
# et de la basse (−16 dB) ; calage définitif à l'écoute du propriétaire.
level_db = -10.0
pan = 0.2
reverb_send = 0.1
[mix.tracks.Chords]
level_db = -14.0
pan = -0.25
reverb_send = 0.15
[mix.tracks.Bass]
level_db = -16.0
pan = 0.0
reverb_send = 0.05
[mix.tracks.PercussionLow]
level_db = -9.0
pan = 0.1
reverb_send = 0.1
[mix.tracks.PercussionHigh]
level_db = -9.0
pan = 0.1
reverb_send = 0.1
[mix.eq]
highpass_hz = 35.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8
