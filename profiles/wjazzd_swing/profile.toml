[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Marche de basse (E6, A4). Fenêtre : WJazzD swing, hauteur de basse (centiles 1 à 99) 33..52, arrivées
# (centiles 10 à 90) 36..46, meilleure fenêtre de 12 demi-tons 36..47. `max_leap` 11 = centile 95 des
# intervalles mesurés.
# Poids : les parts mesurées sont celles de la NOTE jouée (approche chromatique, diatonique ou aucune ;
# note d'accord, de gamme ou chromatique au passage ; notes répétées ; côté de l'approche ; arrivée sur la
# basse, la tierce, la quinte ou la septième), pas celles du tirage du moteur. Les poids sont ajustés pour
# que les parts de notes générées retrouvent les parts mesurées (A4 : descente par coordonnée sur les
# graines 1 à 6, contrôle sur 16 autres ; `make backing-validate`, README du profil). L'arrivée « autre »
# de WJazzD (27 %, la base ne colle pas à la grille) n'est pas reproduite (D4).
# Sans source (WJazzD ne note qu'une hauteur par temps) : les croches (règle de métier, A4), le deux temps
# (quinte ou note de passage à la seconde blanche).
[accompaniment.bass]
low = 36
high = 47
walk_low = 33
walk_high = 50
[accompaniment.bass.walking]
velocity = 78
accent = 6
duration = 4
max_leap = 11
toward_target_weight = 2
keep_direction_weight = 1
approach = { none_weight = 70, chromatic_weight = 10, diatonic_weight = 6, side = { from_weight = 50, other_weight = 15, above_weight = 35 } }
passing = { chord_tone_weight = 40, scale_step_weight = 60, chromatic_weight = 30, repeat_weight = 40 }
arrival = { root_weight = 63, third_weight = 12, fifth_weight = 12, seventh_weight = 13 }
eighths = { none_weight = 84, chromatic_weight = 3, diatonic_weight = 3, ghost_weight = 10, velocity = 58, ghost_velocity = 34 }
two_feel = { passing_weight = 1, fifth_weight = 2 }

# Comping (E5, A1, A5) : voicings conduits par les voix communes (la famille se tire par graine :
# `session.toml`, groupe `voicing`), tension de couleur et dérive de registre tirées par graine, rythmes
# d'une mesure tirés par poids, ou joués en phrases de deux à quatre mesures. Aucun corpus distribuable de
# voicings ni de rythmes de comping (décision F3) : règles de métier, jugées à l'écoute (README du profil).
# Les motifs sont étiquetés par densité d'attaques pour l'arc : `sparse` (au plus une attaque par mesure),
# `medium` (deux), `dense` (trois ou quatre, dont une anticipée sur la mesure suivante, pas 14). Pas d'un
# motif : 0 = temps 1, 2 = « et » du 1, 4 = temps 2, 6 = « et » du 2, 8 = temps 3, 14 = « et » du 4.
[accompaniment.chords]
center = 62
max_drift = 8
default_pattern = 0
voicing = "rootless"
low = 52
high = 76
# Tension de couleur tirée par graine parmi celles que la qualité permet, dérive de registre bornée à
# six demi-tons autour du centre (règles de métier : aucune mesure de corpus).
color = { none_weight = 2, published_weight = 2, ninth_weight = 3, eleventh_weight = 1, thirteenth_weight = 3 }
register_drift = { step = 2, max = 6 }
patterns = [{ hits = [{ step = 0, direction = "block", duration = 8, velocity = 62 }, { step = 8, direction = "block", duration = 8, velocity = 62 }] }]
comping = [
  # 0-4 : sparse
  { weight = 3, tag = "sparse", hits = [{ step = 8, duration = 8, velocity = 60 }] },
  { weight = 1, tag = "sparse", hits = [] },
  { weight = 2, tag = "sparse", hits = [{ step = 0, duration = 12, velocity = 56 }] },
  { weight = 2, tag = "sparse", hits = [{ step = 6, duration = 6, velocity = 58 }] },
  { weight = 1, tag = "sparse", hits = [{ step = 14, duration = 2, velocity = 58, anticipate = true }] },
  # 5-10 : medium (5 et 6 : les motifs de la banque d'E7)
  { weight = 4, tag = "medium", hits = [{ step = 0, duration = 6, velocity = 66 }, { step = 6, duration = 4, velocity = 58 }] },
  { weight = 2, tag = "medium", hits = [{ step = 6, duration = 4, velocity = 58 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  { weight = 3, tag = "medium", hits = [{ step = 2, duration = 4, velocity = 58 }, { step = 10, duration = 4, velocity = 56 }] },
  { weight = 3, tag = "medium", hits = [{ step = 4, duration = 4, velocity = 60 }, { step = 12, duration = 4, velocity = 58 }] },
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 4, velocity = 62 }, { step = 8, duration = 6, velocity = 58 }] },
  { weight = 2, tag = "medium", hits = [{ step = 8, duration = 4, velocity = 60 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  # 11-14 : dense (11 et 12 : les motifs de la banque d'E7)
  { weight = 3, tag = "dense", hits = [{ step = 4, duration = 3, velocity = 60 }, { step = 10, duration = 3, velocity = 56 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  { weight = 3, tag = "dense", hits = [{ step = 0, duration = 4, velocity = 62 }, { step = 8, duration = 4, velocity = 58 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  { weight = 2, tag = "dense", hits = [{ step = 0, duration = 3, velocity = 62 }, { step = 6, duration = 3, velocity = 56 }, { step = 10, duration = 3, velocity = 58 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  { weight = 1, tag = "dense", hits = [{ step = 2, duration = 2, velocity = 56 }, { step = 6, duration = 3, velocity = 60 }, { step = 8, duration = 3, velocity = 58 }, { step = 12, duration = 3, velocity = 56 }] },
]

# Phrases de comping (A1) : suites de motifs de `comping`, même étiquette que leurs motifs pour que
# l'arc restreigne les phrases comme les motifs. `part_end` : mise en place avant un changement de section
# (la phrase couvre la fin de la passe) ; `part_start` : entrée de la section ; `chorus_end` : fin du
# chorus (turnaround). Règles de métier : le comping n'a aucune mesure distribuable.
[[accompaniment.chords.phrases]]
weight = 3
tag = "sparse"
motifs = [0, 1, 0, 1]
[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [2, 3, 2, 4]
[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [3, 0]
[[accompaniment.chords.phrases]]
weight = 1
tag = "sparse"
motifs = [1, 4, 0, 1, 3, 0, 4, 2]
[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
at = "part_end"
motifs = [1, 4]
[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
at = "part_start"
motifs = [2, 1]
[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
at = "chorus_end"
motifs = [3, 4]

[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [5, 6, 5, 6]
[[accompaniment.chords.phrases]]
weight = 2
tag = "medium"
motifs = [5, 5, 6, 5]
[[accompaniment.chords.phrases]]
weight = 3
tag = "medium"
motifs = [8, 9, 8, 10]
[[accompaniment.chords.phrases]]
weight = 2
tag = "medium"
motifs = [7, 5, 7, 6]
[[accompaniment.chords.phrases]]
weight = 2
tag = "medium"
motifs = [5, 6]
[[accompaniment.chords.phrases]]
weight = 1
tag = "medium"
motifs = [9, 10, 5, 6, 8, 7, 5, 10]
[[accompaniment.chords.phrases]]
