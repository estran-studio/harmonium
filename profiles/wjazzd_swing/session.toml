# ════════════════════════════════════════════════════════════════════════════════════════════════
# Arcs nommés (A3) : un chorus = une passe de la forme (44 mesures par défaut, une grille d'hôte sinon).
# Quatre chorus par air par défaut (`arrangement.toml`) : exposition, corps, sommet, retombée ; au-delà
# (une grille d'hôte à plus de chorus), le corps et le sommet reprennent en boucle (`repeat_from`), sans
# retombée avant le dernier chorus. Valeurs de métier, aucune mesure de corpus (WJazzD ne donne pas la
# dynamique d'un chorus, le GMD ne donne que des mesures isolées). Étiquettes : comping `sparse` / `medium`
# / `dense` (profile.toml), batterie `spang` (spang-a-lang) / `quarters` (ride aux noires) / `brush`
# (balais, percussion.toml). Breaks : une mesure avant le chorus suivant (accords et basse se taisent, la
# batterie continue) ; stop-time : accords et basse ne jouent que le premier temps, deux mesures.
#
#   exposition_*  chorus 1 à deux temps (comping clairsemé, ride aux noires ou balais), puis la marche ;
#   directe_*     la marche dès le chorus 1 (le jeu des disques de quartet, sans exposition) ;
#   orchestre     le kit et le comping changent à la frontière des chorus (balais, baguettes, orgue) ;
#   rapide        à partir de 190 BPM : comping plus clairsemé, jamais plus de deux attaques d'accords.
# ════════════════════════════════════════════════════════════════════════════════════════════════

[arcs.exposition_baguettes]
repeat_from = 1

[[arcs.exposition_baguettes.stages]]
choruses = 1
variants = [
  { weight = 3, intensity = 0.65, density = 0.5, bass_feel = "two_feel", comping = [{ tag = "sparse", weight = 3 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "quarters" }] },
  { weight = 1, intensity = 0.75, density = 0.6, bass_feel = "two_feel", comping = [{ tag = "medium" }], percussion = [{ tag = "quarters" }] },
]

[[arcs.exposition_baguettes.stages]]
choruses = 1
variants = [
  { weight = 3, bass_feel = "walking", comping = [{ tag = "medium", weight = 3 }, { tag = "dense", weight = 1 }], percussion = [{ tag = "spang" }] },
  { weight = 2, intensity = 1.1, density = 1.1, bass_feel = "walking", comping = [{ tag = "medium" }, { tag = "dense", weight = 2 }], percussion = [{ tag = "spang" }], breaks = [{ start = -1, bars = 1, chance = 0.4, tracks = ["Chords", "Bass"] }] },
  { weight = 1, intensity = 0.95, density = 0.9, bass_feel = "walking", comping = [{ tag = "sparse" }, { tag = "medium", weight = 2 }], percussion = [{ tag = "spang", weight = 2 }, { tag = "quarters" }] },
]

[[arcs.exposition_baguettes.stages]]
choruses = 1
variants = [
  { intensity = 1.3, density = 1.25, bass_feel = "walking", comping = [{ tag = "dense" }], percussion = [{ tag = "spang" }], breaks = [{ start = -2, bars = 2, chance = 0.5, tracks = ["Chords", "Bass"], keep_steps = [0] }] },
]

[[arcs.exposition_baguettes.fall]]
intensity = 0.55
density = 0.5
bass_feel = "two_feel"
comping = [{ tag = "sparse" }]
percussion = [{ tag = "quarters" }]
breaks = [{ start = -2, bars = 2, tracks = ["Chords", "Bass"], keep_steps = [0] }]

