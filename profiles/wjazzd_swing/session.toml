# Habillage par graine de `wjazzd_swing` (phase 019, B1, mécanisme A2) : « New seed » doit s'entendre.
# Une graine tire UNE variante par groupe, une fois, au premier air ; les groupes se combinent. Sept
# groupes, 19 656 combinaisons (13 × 7 × 3 × 2 × 6 × 2 × 3). Programmes General MIDI de
# GeneralUser GS (sans Odin, D1), 0-based : piano 0 (« Grand Piano »), guitare de jazz 26 (« Jazz
# Guitar »), orgue 17 (« Percussive Organ »), contrebasse 32 (« Acoustic Bass »), basse aux doigts 33
# (« Finger Bass »), kits de la banque 128 : jazz 32 (baguettes), balais 40 (« Brush »).
#
# Ce qui est mesuré : les plages de tempo (distribution des tempos moyens par solo de WJazzD, sous-ensemble
# swing : centiles 10 / 25 / 50 / 75 / 90 = 93 / 132 / 177,5 / 242,6 / 284,5 BPM, `references/wjazzd-swing/`
# README ; la ballade, sous 100 BPM, est le profil B2) et leurs poids (à peu près les parts des solos,
# aplaties pour que chaque classe s'entende). Le rapport de swing n'est PAS tiré ici : il suit le tempo
# piste par piste (`swing.toml`, JTD). Ce qui est règle de métier, sans corpus : tonalités courantes du
# répertoire, instruments, voicings, énergie, arcs (aucune mesure de la dynamique d'un chorus).
#
# Un hôte qui impose son tempo (`SetBpm`) ou sa tonalité (`[fixed_tonality]` de son profil, grille de
# training) gagne sur la variante ; le kit et l'arc restent ceux de la graine (T1 : le choix du profil par
# tempo, `README.md`, « Swing rapide »).

# ── Tempo, kit et arc, ensemble (un kit aux balais n'a de sens qu'à tempo lent ou modéré ; un arc à deux
# temps, pas à 230) : un seul groupe pour que le poids des balais suive le tempo. Plages séparées de plus
# de 8 BPM. Cinq classes : lent (100-118, balais en majorité), medium (122-142), medium-up (148-186),
# up (192-225), très rapide (232-265).
[[variants]]
group = "rythme"
name = "lent_balais_exposition"
weight = 2
bpm = [100.0, 118.0]
instruments = { percussion_bank = 128, percussion_program = 40 }
arc = "exposition_balais"

[[variants]]
group = "rythme"
name = "lent_balais_directe"
weight = 1
bpm = [100.0, 118.0]
instruments = { percussion_bank = 128, percussion_program = 40 }
arc = "directe_balais"

[[variants]]
