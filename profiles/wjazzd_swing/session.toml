variants = [
  { weight = 3, instruments = { percussion_program = 40 }, intensity = 0.6, density = 0.5, bass_feel = "two_feel", comping = [{ tag = "sparse", weight = 3 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "brush" }] },
