# Profil `gmd_hiphop` (phase 019, B8) : accompagnement hip-hop sous une grille.
#
# Le nom est celui de la source qui définit le style (principe VII) : la famille `hiphop` du Groove MIDI Dataset v1.0.0 (`hiphop` : 30 fichiers, 796 mesures, « assez » ; `hiphop/groove6` : « juste » ; fills « juste », L2 § 4.2). 90 % des fichiers sont droits (80 sur 91 ; 10 swing, 1 ternaire), seuls les droits sont retenus.
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : la basse (motifs), les accords
# (rythmes de comping, phrases) et la batterie (patterns, phrases, relances) ne dépendent que de l'accord
# publié et de la graine. Les deux parties par défaut (A et B de 8 mesures, quatre grilles chacune), quand
# l'utilisateur n'en fournit pas, sont des progressions d'accords de forme commune écrites pour ce profil
# (voir README, provenance et droits). La grille s'écrit relative à la tonique : la tonalité est tirée par la graine
# (`session.toml`, par défaut do éolien) et training la remplace par `[fixed_tonality]`.
#
# Ce qui vient de la source : la batterie, le tempo et le feel (`percussion.toml` est GÉNÉRÉ par
# `specs/019-bibliotheque-accompagnements/b8/generer.py`). Ce qui n'en vient pas, DIT ICI : la basse, le comping
# et les grilles sont des règles de métier (aucune mesure de basse ni de voicings pour ce style), le mixage et
# l'arc sont des réglages de service. L'habillage par graine (`session.toml`, A2 ; R2-styles) tire le tempo dans
# la plage de la source, la tonalité, les instruments, le kit, la famille de voicings, le registre, l'énergie et
# l'arc ; la variété vient aussi des boucles de grille, des phrases et relances, des motifs de basse et des
# patterns de batterie (coups probabilistes et micro-timing par voix mesurés dans le GMD).
#
# Aucune mélodie : la piste `Melody` est absente de l'arrangement.

[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
arc = "arc.toml"
session = "session.toml"

[meta]
id = "gmd_hiphop"
name = "Accompagnement hip-hop (Groove MIDI Dataset, famille hiphop)"
tradition = "Groove MIDI Dataset v1.0.0, famille hiphop (hiphop, hiphop/groove6), 4/4 droit : 34 fichiers de batterie, 5 batteurs ; basse et piano électrique : règles de métier"
tags = ["hiphop", "accompagnement", "grille"]
aliases = ["hiphop", "hip-hop"]
corpus = """\
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; dix batteurs, kit électronique Roland TD-11. Seuls des agrégats entrent dans le profil (probabilités par pas d'un groupe de mesures, suites de groupes, moyennes de relances, plage de tempo) : aucune mesure d'un enregistrement n'est copiée. Basse, comping et grilles : règles de métier et formes communes écrites pour ce profil (aucune source mesurée de basse ni de voicings pour ce style : voir README). Manifeste et mesures : harmonium_lab corpus/gmd, references/gmd-*."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# GMD : feel droit (rapport médian 0,50) dans tous les fichiers retenus.
default_swing_ratio = 0.5
# tempo des 34 fichiers `beat` du GMD (BPM du nom de fichier) : centile 10 = 70, médiane = 91, centile 90 = 100.
default_bpm = 91.0
min_bpm = 70.0
max_bpm = 100.0

[form]
sequence = [0, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

# Pas de mélodie jouée : mêmes réglages neutres que `wjazzd_swing`.
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 0, mode = "aeolian", weight = 3 }, { key = 9, mode = "aeolian", weight = 2 }, { key = 7, mode = "aeolian", weight = 2 }, { key = 5, mode = "aeolian", weight = 2 }, { key = 2, mode = "aeolian", weight = 1 }, { key = 4, mode = "aeolian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4
# Un tirage de grille par chorus (A7) : le chorus n joue le tirage n mod 4 (le premier est celui de l\'air).
tour_variants = 4

# Couplet (huit mesures) : quatre boucles mineures de forme commune (septièmes).
[harmony.parts.A]
kind = "chord_loop"
loops = [
  # i7 bVI bIII bVII7 (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
  ] },
  # i7 i7 iv7 iv7 (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
  ] },
  # i7 bVII7 bVI V7 (deux fois)
  { weight = 2, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
  # i7 bIII bVII7 iv7 i7 bIII bVII7 V7
  { weight = 1, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
]

# Refrain (huit mesures) : quatre boucles.
[harmony.parts.B]
kind = "chord_loop"
loops = [
  # bVI bVII7 i7 i7 (deux fois)
  { weight = 3, chords = [
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
  ] },
  # iv7 i7 bVI V7 (deux fois)
  { weight = 2, chords = [
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
  # bIII bVII7 i7 i7 bIII bVII7 iv7 V7
  { weight = 2, chords = [
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
  # i7 (quatre mesures) bVI bVI bVII7 bVII7
  { weight = 1, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
  ] },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 24
high = 35
motifs = [
  # 0 : sub : fondamentale longue, temps 3, temps 4
  { bars = 1, weight = 4, reference = "chord_root", notes = [{ step = 0, duration = 6, semitones = 0, velocity = 104 }, { step = 8, duration = 4, semitones = 0, velocity = 96 }, { step = 12, duration = 4, semitones = 0, velocity = 90 }] },
  # 1 : sub syncopé
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 3, semitones = 0, velocity = 104 }, { step = 3, duration = 3, semitones = 0, velocity = 90 }, { step = 8, duration = 6, semitones = 0, velocity = 98 }, { step = 14, duration = 2, semitones = 0, velocity = 88 }] },
  # 2 : fondamentale tenue, octave au temps 3,5
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 8, semitones = 0, velocity = 102 }, { step = 10, duration = 6, semitones = 12, velocity = 90 }] },
  # 3 : note tenue
  { bars = 1, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 16, semitones = 0, velocity = 100 }] },
  # 4 : deux mesures : sub, puis octave et quinte pour relancer
  { bars = 2, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 4, semitones = 0, velocity = 104 }, { step = 6, duration = 2, semitones = 0, velocity = 88 }, { step = 8, duration = 6, semitones = 0, velocity = 98 }, { step = 16, duration = 6, semitones = 0, velocity = 102 }, { step = 22, duration = 2, semitones = 12, velocity = 86 }, { step = 24, duration = 4, semitones = 0, velocity = 96 }, { step = 28, duration = 4, semitones = 7, velocity = 88 }] },
]

[accompaniment.chords]
center = 62
max_drift = 8
default_pattern = 0
voicing = "drop2"
color = { none_weight = 2, published_weight = 1, ninth_weight = 3, eleventh_weight = 1, thirteenth_weight = 2 }
register_drift = { step = 2, max = 6 }
low = 52
high = 76
patterns = [{ hits = [{ step = 0, duration = 8, velocity = 70 }, { step = 8, duration = 8, velocity = 66 }] }]
comping = [
  # 0 sparse : accord tenu
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 16, velocity = 68 }] },
  # 1 sparse : deux accords, le second en contretemps
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 6, velocity = 72 }, { step = 10, duration = 6, velocity = 64 }] },
  # 2 sparse : silence
  { weight = 1, tag = "sparse", hits = [] },
  # 3 medium : x..x..x.
  { weight = 4, tag = "medium", hits = [{ step = 0, duration = 6, velocity = 74 }, { step = 6, duration = 4, velocity = 66 }, { step = 12, duration = 4, velocity = 68 }] },
  # 4 medium : contretemps, anticipation
  { weight = 3, tag = "medium", hits = [{ step = 4, duration = 4, velocity = 70 }, { step = 10, duration = 4, velocity = 68 }, { step = 14, duration = 2, velocity = 68, anticipate = true }] },
  # 5 medium : temps 1, 3 et anticipation
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 4, velocity = 74 }, { step = 8, duration = 4, velocity = 70 }, { step = 14, duration = 2, velocity = 66, anticipate = true }] },
  # 6 dense : syncopé en doubles croches
  { weight = 3, tag = "dense", hits = [{ step = 0, duration = 2, velocity = 76 }, { step = 3, duration = 2, velocity = 68 }, { step = 6, duration = 2, velocity = 72 }, { step = 10, duration = 2, velocity = 70 }, { step = 13, duration = 3, velocity = 68 }] },
  # 7 dense : croches en contretemps
  { weight = 3, tag = "dense", hits = [{ step = 2, duration = 2, velocity = 70 }, { step = 6, duration = 2, velocity = 74 }, { step = 10, duration = 2, velocity = 70 }, { step = 14, duration = 2, velocity = 74 }] },
]

[[accompaniment.chords.phrases]]
weight = 3
tag = "sparse"
motifs = [0, 1, 0, 1]

[[accompaniment.chords.phrases]]
weight = 2
tag = "sparse"
motifs = [1, 1]

[[accompaniment.chords.phrases]]
