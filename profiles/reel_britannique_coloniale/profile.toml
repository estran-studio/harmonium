# Ornements idiomatiques (V3b). Taux : plancher écrit du corpus, références/ornaments/britannique_coloniale-reel.json
# du labo (DS-T10), pour 100 notes de la mélodie ; `rate_scale` les relève (les ABC sous-notent).
[ornaments]
rate_scale = 4.0

[ornaments.types.passing]
min_carrier_eighths = 1.5
density_curve = [[0.0, 0.0], [0.5, 0.0], [1.0, 1.0]]

[ornaments.types.grace_single]
written_per_100_notes = 0.009753
min_carrier_eighths = 1.0
span = 0.4
velocity_scale = 0.75

[ornaments.types.triplet_repeated]
written_per_100_notes = 0.009753
min_carrier_eighths = 2.0
velocity_scale = 0.9

[ornaments.types.double_stop]
written_per_100_notes = 0.294542
per_100_notes_by_bar = [0.478412, 0.380868, 0.292513, 0.302741, 0.248282, 0.200581, 0.093352, 0.359587]
min_carrier_eighths = 2.0
strings = [55, 62, 69, 76]
min_interval = 3
max_interval = 12
velocity_scale = 0.8

[ornaments.types.chord]
written_per_100_notes = 0.003901
min_carrier_eighths = 2.0
strings = [55, 62, 69, 76]
min_interval = 3
max_interval = 24
velocity_scale = 0.75

[ornaments.types.trill]
written_per_100_notes = 0.001951
min_carrier_eighths = 2.0
velocity_scale = 0.8
