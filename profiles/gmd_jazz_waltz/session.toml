# Kit : baguettes (dominantes) ou balais ; l'étiquette de batterie suit le kit (l'arc d'un chorus qui en déclare passe devant).
[[variants]]
group = "kit"
name = "baguettes"
weight = 3
instruments = { percussion_bank = 128, percussion_program = 32 }
percussion = [{ tag = "ride" }]

[[variants]]
group = "kit"
name = "balais"
weight = 1
instruments = { percussion_bank = 128, percussion_program = 40 }
percussion = [{ tag = "brush" }]

