# Arcs nommés. Un chorus qui ne déclare pas de programmes rend ceux de la session.

# Deux temps long : blanche et noire pendant deux chorus, puis marche seulement au troisième.
[arcs.deux_temps_long]
repeat_from = 1
[[arcs.deux_temps_long.stages]]
choruses = 2
variants = [
  { weight = 3, intensity = 0.65, density = 0.5, bass_feel = "three_feel", comping = [{ tag = "sparse", weight = 2 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "hat" }] },
  { weight = 1, intensity = 0.8, density = 0.7, bass_feel = "two_feel", comping = [{ tag = "medium" }], percussion = [{ tag = "ride" }] },
]
[[arcs.deux_temps_long.stages]]
choruses = 1
variants = [
  { bass_feel = "walking", comping = [{ tag = "medium", weight = 2 }, { tag = "dense", weight = 1 }], percussion = [{ tag = "ride" }], breaks = [{ start = 24, bars = 1, chance = 0.5, tracks = ["Chords", "Bass"] }] },
]
[[arcs.deux_temps_long.fall]]
intensity = 0.5
density = 0.4
bass_feel = "three_feel"
comping = [{ tag = "sparse" }]
percussion = [{ tag = "hat" }]
breaks = [{ start = -2, bars = 2, tracks = ["Chords", "Bass"], keep_steps = [0] }]

# L'orgue prend le comping au corps, le comping de la session revient à la retombée.
[arcs.sans_sommet_orgue]
repeat_from = 1
[[arcs.sans_sommet_orgue.stages]]
choruses = 1
variants = [
  { intensity = 0.6, density = 0.5, bass_feel = "two_feel", comping = [{ tag = "sparse", weight = 3 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "hat" }] },
]
[[arcs.sans_sommet_orgue.stages]]
choruses = 2
variants = [
  { instruments = { chords_program = 16 }, bass_feel = "walking", comping = [{ tag = "medium" }], percussion = [{ tag = "ride" }] },
  { instruments = { chords_program = 16 }, intensity = 1.15, density = 1.1, bass_feel = "walking", comping = [{ tag = "dense" }], percussion = [{ tag = "ride" }] },
]
[[arcs.sans_sommet_orgue.fall]]
intensity = 0.5
density = 0.4
bass_feel = "two_feel"
comping = [{ tag = "sparse" }]
percussion = [{ tag = "hat" }]
breaks = [{ start = -2, bars = 2, tracks = ["Chords", "Bass"], keep_steps = [0] }]

# Balais à l'exposition et à la retombée, baguettes (ride du kit jazz) au corps.
[arcs.balais_puis_baguettes]
repeat_from = 1
[[arcs.balais_puis_baguettes.stages]]
choruses = 1
variants = [
  { instruments = { percussion_bank = 128, percussion_program = 40 }, intensity = 0.6, density = 0.5, bass_feel = "two_feel", comping = [{ tag = "sparse", weight = 3 }, { tag = "medium", weight = 1 }], percussion = [{ tag = "brush" }] },
]
[[arcs.balais_puis_baguettes.stages]]
choruses = 2
variants = [
  { instruments = { percussion_bank = 128, percussion_program = 32 }, bass_feel = "walking", comping = [{ tag = "medium", weight = 2 }, { tag = "dense", weight = 1 }], percussion = [{ tag = "ride" }] },
]
[[arcs.balais_puis_baguettes.fall]]
instruments = { percussion_bank = 128, percussion_program = 40 }
intensity = 0.5
density = 0.4
bass_feel = "two_feel"
comping = [{ tag = "sparse" }]
percussion = [{ tag = "brush" }]
breaks = [{ start = -2, bars = 2, tracks = ["Chords", "Bass"], keep_steps = [0] }]
