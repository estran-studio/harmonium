# Habillage par graine de `gmd_jazz_waltz` (A2) : un tirage par groupe, les groupes se combinent. Valeurs de
# métier dans les bornes de la valse jazz (la source GMD n'a que deux fichiers, 120 et 200 BPM, un batteur ; aucune
# mesure d'habillage). Programmes General MIDI de GeneralUser GS vérifiés dans la banque (SF2) : piano 0, piano
# électrique « Tine » 4, orgue « Tonewheel » 16, guitare de jazz 26, contrebasse 32, basse aux doigts 33, basse
# fretless 35 ; kits de la banque 128 : jazz 32 (baguettes), balais 40.

# Tempo et swing ensemble (swing de la JTD à ces tempos : 0,72 puis 0,70, 0,66 ; la variante décale la courbe). Plages
# séparées de plus de 8 BPM.
[[variants]]
group = "tempo"
name = "modere"
weight = 2
bpm = [118.0, 134.0]
swing = 0.72

[[variants]]
group = "tempo"
name = "medium"
weight = 3
bpm = [150.0, 170.0]
swing = 0.69

[[variants]]
group = "tempo"
name = "vif"
weight = 2
bpm = [186.0, 206.0]
swing = 0.64

[[variants]]
group = "tonalite"
name = "fa"
weight = 3
tonality = { key = 5, mode = "ionian" }

[[variants]]
group = "tonalite"
name = "si_bemol"
weight = 2
tonality = { key = 10, mode = "ionian" }

[[variants]]
group = "tonalite"
name = "mi_bemol"
weight = 2
tonality = { key = 3, mode = "ionian" }

[[variants]]
