[melody]
cell_units = 6
strong_units = [0, 3]
weak_units = [1, 2, 4, 5]
key_modes = [
  { key = 2, mode = "ionian", weight = 8 },
  { key = 7, mode = "ionian", weight = 8 },
  { key = 9, mode = "ionian", weight = 4 },
  { key = 0, mode = "ionian", weight = 2 },
  { key = 9, mode = "aeolian", weight = 2 },
  { key = 4, mode = "aeolian", weight = 1 },
]

[melody.params]
weight_role_run = 4
weight_role_arp = 4
weight_role_turn = 1
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 71
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 92
strong_eighth_velocity_offset = 10
even_eighth_velocity_offset = -8

[harmony]
model = "trad_functional"
steps_per_chord = 12
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="II",quality="Minor"}, {degree="VI",quality="Minor"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 6]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV", "II"]

[accompaniment.bass]
low = 40
high = 50
walk_low = 38
walk_high = 52
hits = [
  { step = 0, degree = "root", duration = 4, velocity = 70 },
  { step = 6, degree = "fifth_if_held", duration = 4, velocity = 70 },
]

[accompaniment.bass.passing]
none_weight = 4
density = [[0.0, 0.0], [0.5, 0.6], [1.0, 1.0]]
phrase = [[0.0, 0.7], [0.75, 1.0], [1.0, 1.3]]
avoid_melody_intervals = [1, 6, 11]
arousal_low_multiplier = 0.5
arousal_high_multiplier = 1.5
rules = [
  { when = "next_target_differs", before = [4], motion = "scale_step", weight = 3, duration = 2, velocity_delta = -12, min_leap = 0 },
  { when = "next_target_differs", before = [4, 2], motion = "scale_walk", weight = 2, duration = 1, velocity_delta = -12, min_leap = 5 },
  { when = "next_target_differs", before = [2], motion = "chromatic", weight = 1, duration = 2, velocity_delta = -12, min_leap = 0 },
]

[accompaniment.chords]
center = 60
max_drift = 6
default_pattern = 1
patterns = [
  { hits = [{ step = 0, duration = 3, velocity = 60 }] },
  { hits = [{ step = 0, duration = 3, velocity = 60 }, { step = 6, duration = 3, velocity = 60 }] },
  { hits = [{ step = 0, duration = 3, velocity = 60 }, { step = 6, duration = 3, velocity = 60 }] },
]

