[files]
cells = "cells.toml"
feet = "feet.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"

[meta]
id = "gigue_britannique_coloniale"
name = "Gigue britannique coloniale"
tradition = "Musique britannique coloniale, régiments et bals d'officiers d'Amérique du Nord, c. 1760–1840"
tags = ["gigue", "jig", "britannique", "coloniale", "violon", "1837", "garnison", "bal"]
corpus = "Nottingham Music Database, John Chambers AmRev, Cahusac 1809 (365 airs de jig du corpus bascanada/harmonium_lab)"

[meter]
time_signature = { numerator = 6, denominator = 8 }
steps_per_bar = 12
steps_per_unit = 2
steps_per_pulse = 6
pulses_per_bar = 2
default_swing_ratio = 0.5
default_bpm = 156.0
min_bpm = 144.0
max_bpm = 168.0

[form]
sequence = [0, 0, 1, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "CadHalf", { CopyOf = 1 }, { CopyOf = 2 }, "Free", "CadFull"]
[[form.parts]]
name = "B"
melody_center_offset = 1
roles = ["Open", "Free", "Free", "CadHalf", { CopyOf = 1 }, { CopyOf = 2 }, "Free", "CadFull"]

[melody]
cell_units = 6
strong_units = [0, 3]
weak_units = [1, 2, 4, 5]
key_modes = [
  { key = 2, mode = "ionian", weight = 8 },
  { key = 7, mode = "ionian", weight = 8 },
  { key = 9, mode = "ionian", weight = 4 },
  { key = 0, mode = "ionian", weight = 2 },
  { key = 9, mode = "aeolian", weight = 2 },
  { key = 4, mode = "aeolian", weight = 1 },
]

[melody.params]
weight_role_run = 4
weight_role_arp = 4
weight_role_turn = 1
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 71
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 92
strong_eighth_velocity_offset = 10
even_eighth_velocity_offset = -8

[harmony]
model = "trad_functional"
steps_per_chord = 12
[[harmony.candidates]]
mode = "ionian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Major"}, {degree="II",quality="Minor"}, {degree="VI",quality="Minor"}]
[[harmony.candidates]]
mode = "mixolydian"
chords = [{degree="I",quality="Major"}, {degree="IV",quality="Major"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}]
[[harmony.candidates]]
mode = "dorian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Major"}, {degree="BVII",quality="Major"}, {degree="V",quality="Minor"}]
[[harmony.candidates]]
mode = "aeolian"
chords = [{degree="I",quality="Minor"}, {degree="IV",quality="Minor"}, {degree="V",quality="Minor"}, {degree="BVII",quality="Major"}, {degree="VI",quality="Major"}]

[accompaniment]
strong_steps = [0, 6]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV", "II"]
bass_steps = [0, 6]
bass_duration_steps = 4
bass_velocity = 70
bass_low = 40
bass_high = 50
chop_steps = [0, 6]
chop_duration_steps = 3
chop_velocity = 60
guitar_center = 60
guitar_max_drift = 6

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0
