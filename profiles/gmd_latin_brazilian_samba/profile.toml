# Micro-timing de la batterie : médianes du GMD brazilian-samba (écart à la grille, en pas ; un batteur, kit
# électronique contre un métronome) : grosse caisse −0,008 sur le temps, −0,046 hors temps (n = 1192 et 1136), tom grave
# (surdo) −0,021 et −0,040 (406 et 137), caisse claire −0,035 et −0,048 (734 et 2941), charleston au pied −0,027 et
# −0,025 (24 et 1145). Voix latines (agogô, tamborim, chocalho, pandeiro) : aucune mesure, aucun décalage. Aucun
# `jitter` sur la batterie (il partage son tirage avec la basse à notes de passage ; contrat de B4).
