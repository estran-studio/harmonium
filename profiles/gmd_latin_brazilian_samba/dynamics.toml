# Pilotage par les quatre émotions. Aucune mesure de corpus ne relie une émotion à un paramètre du jeu : les courbes
# sont des réglages de service (README du profil).
# Arousal : le tempo (± 4 BPM autour du tempo de la graine, dans la plage 85..120 : les tempos mesurés 89 à 116 ± 4),
# la vélocité et le niveau de densité de la batterie (0 : surdo et chocalho ; 1, neutre : l'ensemble ; 2 : doubles
# croches, caisse claire fantôme) ; l'arc (`arc.toml`) nomme l'étiquette (surdo, ensemble, batucada) de chaque chorus
# et multiplie l'intensité et la densité lues ici : le niveau du chorus est round(1 + percussion_intensity(i) +
# density_percussion(d)), i = intensité × arc, d = densité × arc (neutres à 0,5).
# Vélocités par piste élargies (0,6 à 1,3) pour que l'écart de l'arc s'entende (réglage de service, aucune mesure).
# Pas de `fixed_tonality` : la tonalité vient de l'habillage (`session.toml`) ; les seuils de bascule parallèle sont
# écartés de la valence neutre pour que le mode tiré ne bascule pas de lui-même.
