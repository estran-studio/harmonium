# Profil `gmd_dance_disco` (phase 019, B8) : accompagnement disco sous une grille.
#
# Le nom est celui de la source qui définit le style (principe VII) : le style `dance/disco` du Groove MIDI Dataset v1.0.0 (5 fichiers `beat`, 431 mesures, 4/4 droit, « juste », L2 § 4.2 ; aucun fichier `fill`).
# Ce profil est fait pour jouer sous une grille fournie par l'utilisateur : la basse (motifs), les accords
# (rythmes de comping, phrases) et la batterie (patterns, phrases, relances) ne dépendent que de l'accord
# publié et de la graine. Les deux parties par défaut (A et B de 8 mesures, quatre grilles chacune), quand
# l'utilisateur n'en fournit pas, sont des progressions d'accords de forme commune écrites pour ce profil
# (voir README, provenance et droits). La grille s'écrit relative à la tonique : la tonalité est tirée par la graine
# (`session.toml`, par défaut la éolien) et training la remplace par `[fixed_tonality]`.
#
# Ce qui vient de la source : la batterie, le tempo et le feel (`percussion.toml` est GÉNÉRÉ par
# `specs/019-bibliotheque-accompagnements/b8/generer.py`). Ce qui n'en vient pas, DIT ICI : la basse, le comping
# et les grilles sont des règles de métier (aucune mesure de basse ni de voicings pour ce style), le mixage et
# l'arc sont des réglages de service. L'habillage par graine (`session.toml`, A2 ; R2-styles) tire le tempo dans
# la plage de la source, la tonalité, les instruments, le kit, la famille de voicings, le registre, l'énergie et
# l'arc ; la variété vient aussi des boucles de grille, des phrases et relances, des motifs de basse et des
# patterns de batterie (coups probabilistes et micro-timing par voix mesurés dans le GMD).
#
# Aucune mélodie : la piste `Melody` est absente de l'arrangement.

[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"
arc = "arc.toml"
session = "session.toml"

[meta]
id = "gmd_dance_disco"
name = "Accompagnement disco (Groove MIDI Dataset, style dance/disco)"
tradition = "Groove MIDI Dataset v1.0.0, style dance/disco, 4/4 droit : 5 fichiers de batterie, 2 batteurs ; basse octaves et guitare : règles de métier"
tags = ["disco", "dance", "accompagnement", "grille"]
aliases = ["disco"]
corpus = """\
Groove MIDI Dataset v1.0.0 (Google LLC), CC BY 4.0, https://creativecommons.org/licenses/by/4.0/ : Jon Gillick, Adam Roberts, Jesse Engel, Douglas Eck, David Bamman, « Learning to Groove with Inverse Sequence Transformations », ICML 2019 ; dix batteurs, kit électronique Roland TD-11. Seuls des agrégats entrent dans le profil (probabilités par pas d'un groupe de mesures, suites de groupes, moyennes de relances, plage de tempo) : aucune mesure d'un enregistrement n'est copiée. Basse, comping et grilles : règles de métier et formes communes écrites pour ce profil (aucune source mesurée de basse ni de voicings pour ce style : voir README). Manifeste et mesures : harmonium_lab corpus/gmd, references/gmd-*."""

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
# GMD : feel droit (rapport médian 0,50) dans tous les fichiers retenus.
default_swing_ratio = 0.5
# tempo des 5 fichiers `beat` du GMD (BPM du nom de fichier) : centile 10 = 120, médiane = 120, centile 90 = 137.
default_bpm = 120.0
min_bpm = 120.0
max_bpm = 137.0

[form]
sequence = [0, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "B"
melody_center_offset = 0
phrase_ends = [8]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

# Pas de mélodie jouée : mêmes réglages neutres que `wjazzd_swing`.
[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 9, mode = "aeolian", weight = 3 }, { key = 2, mode = "aeolian", weight = 2 }, { key = 4, mode = "aeolian", weight = 2 }, { key = 7, mode = "aeolian", weight = 1 }, { key = 11, mode = "aeolian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4
# Un tirage de grille par chorus (A7) : le chorus n joue le tirage n mod 4 (le premier est celui de l\'air).
tour_variants = 4

# Couplet (huit mesures) : quatre boucles mineures de forme commune (septièmes).
[harmony.parts.A]
kind = "chord_loop"
loops = [
  # i7 i7 iv7 iv7 (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
  ] },
  # i7 iv7 bVII7 bIII (deux fois)
  { weight = 3, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
  ] },
  # i7 bVII7 bVI V7 (deux fois)
  { weight = 2, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
  # i7 (quatre mesures) iv7 iv7 V7 V7
  { weight = 1, chords = [
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
]

# Refrain (huit mesures) : trois boucles.
[harmony.parts.B]
kind = "chord_loop"
loops = [
  # bVI bVII7 i7 i7 bVI bVII7 i7 V7
  { weight = 3, chords = [
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
  # bIII bVI bVII7 i7 (deux fois)
  { weight = 2, chords = [
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 3, quality = "maj7", steps = 16 },
    { semitones = 8, quality = "maj7", steps = 16 },
    { semitones = 10, quality = "7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
  ] },
  # iv7 iv7 i7 i7 iv7 iv7 V7 V7
  { weight = 2, chords = [
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 0, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 5, quality = "m7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
    { semitones = 7, quality = "7", steps = 16 },
  ] },
]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 28
high = 39
motifs = [
  # 0 : octaves en croches
  { bars = 1, weight = 4, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 100 }, { step = 2, duration = 2, semitones = 12, velocity = 88 }, { step = 4, duration = 2, semitones = 0, velocity = 94 }, { step = 6, duration = 2, semitones = 12, velocity = 88 }, { step = 8, duration = 2, semitones = 0, velocity = 98 }, { step = 10, duration = 2, semitones = 12, velocity = 88 }, { step = 12, duration = 2, semitones = 0, velocity = 94 }, { step = 14, duration = 2, semitones = 12, velocity = 88 }] },
  # 1 : octaves en croches, quinte au temps 4
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 100 }, { step = 2, duration = 2, semitones = 12, velocity = 86 }, { step = 4, duration = 2, semitones = 0, velocity = 92 }, { step = 6, duration = 2, semitones = 12, velocity = 86 }, { step = 8, duration = 2, semitones = 0, velocity = 98 }, { step = 10, duration = 2, semitones = 12, velocity = 86 }, { step = 12, duration = 2, semitones = 7, velocity = 92 }, { step = 14, duration = 2, semitones = 12, velocity = 90 }] },
  # 2 : octaves syncopées
  { bars = 1, weight = 3, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 100 }, { step = 3, duration = 1, semitones = 12, velocity = 88 }, { step = 4, duration = 2, semitones = 0, velocity = 94 }, { step = 6, duration = 2, semitones = 12, velocity = 88 }, { step = 8, duration = 2, semitones = 0, velocity = 98 }, { step = 11, duration = 1, semitones = 12, velocity = 88 }, { step = 12, duration = 2, semitones = 0, velocity = 92 }, { step = 14, duration = 2, semitones = 12, velocity = 90 }] },
  # 3 : fondamentale longue, octave en levée
  { bars = 1, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 6, semitones = 0, velocity = 100 }, { step = 6, duration = 2, semitones = 12, velocity = 90 }, { step = 8, duration = 6, semitones = 0, velocity = 96 }, { step = 14, duration = 2, semitones = 12, velocity = 90 }] },
  # 4 : deux mesures : octaves, puis remontée par la quinte et la septième
  { bars = 2, weight = 2, reference = "chord_root", notes = [{ step = 0, duration = 2, semitones = 0, velocity = 94 }, { step = 2, duration = 2, semitones = 12, velocity = 94 }, { step = 4, duration = 2, semitones = 0, velocity = 94 }, { step = 6, duration = 2, semitones = 12, velocity = 94 }, { step = 8, duration = 2, semitones = 0, velocity = 94 }, { step = 10, duration = 2, semitones = 12, velocity = 94 }, { step = 12, duration = 2, semitones = 0, velocity = 94 }, { step = 14, duration = 2, semitones = 12, velocity = 94 }, { step = 16, duration = 2, semitones = 0, velocity = 100 }, { step = 18, duration = 2, semitones = 12, velocity = 86 }, { step = 20, duration = 2, semitones = 0, velocity = 92 }, { step = 22, duration = 2, semitones = 12, velocity = 86 }, { step = 24, duration = 2, semitones = 0, velocity = 98 }, { step = 26, duration = 2, semitones = 7, velocity = 90 }, { step = 28, duration = 2, semitones = 10, velocity = 92 }, { step = 30, duration = 2, semitones = 12, velocity = 94 }] },
]

