low = 52
high = 76
patterns = [{ hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 6, duration = 2, velocity = 76 }, { step = 10, duration = 2, velocity = 80 }] }]
comping = [
  # 0 sparse : accord tenu
  { weight = 3, tag = "sparse", hits = [{ step = 0, duration = 16, velocity = 72 }] },
  # 1 sparse : deux coups en contretemps
  { weight = 3, tag = "sparse", hits = [{ step = 2, duration = 2, velocity = 76, direction = "up" }, { step = 10, duration = 2, velocity = 72, direction = "up" }] },
  # 2 sparse : silence
  { weight = 1, tag = "sparse", hits = [] },
  # 3 medium : contretemps en croches
  { weight = 4, tag = "medium", hits = [{ step = 2, duration = 2, velocity = 78, direction = "up" }, { step = 6, duration = 2, velocity = 76, direction = "up" }, { step = 10, duration = 2, velocity = 78, direction = "up" }, { step = 14, duration = 2, velocity = 76, direction = "up" }] },
  # 4 medium : syncopé
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 2, velocity = 80 }, { step = 3, duration = 1, velocity = 66, direction = "up" }, { step = 6, duration = 2, velocity = 76, direction = "up" }, { step = 10, duration = 2, velocity = 78, direction = "up" }, { step = 14, duration = 2, velocity = 74, direction = "up", anticipate = true }] },
  # 5 medium : bas-haut sur les temps
  { weight = 3, tag = "medium", hits = [{ step = 0, duration = 2, velocity = 80, direction = "down" }, { step = 4, duration = 2, velocity = 72, direction = "up" }, { step = 8, duration = 2, velocity = 78, direction = "down" }, { step = 12, duration = 2, velocity = 72, direction = "up" }] },
