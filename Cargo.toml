[workspace]
members = [
    "harmonium_core",
    "harmonium_audio",
    "harmonium_host",
    "harmonium_cli",
    "harmonium_lab",
    "harmonium_determinism",
    "harmonium_studio",
    "harmonium_bevy",
]
# Dépendance tierce vendue, pas un paquet du moteur ni une cible des tests workspace.
exclude = ["vendor/oxisynth"]
# Le studio est toujours compilé avec `odin` (GPL) ; les options s'unifient entre les paquets
# compilés ensemble. Un `cargo build` ou `cargo test` nu reste donc sans `odin`, comme 1837.
# Le studio se construit et se teste par son nom (`-p harmonium_studio`, `make studio*`).
# Le plugin Bevy reste lui aussi hors des membres par défaut : les jeux le compilent
# explicitement, sans imposer Bevy ni l'option GPL `odin` aux outils du moteur.
default-members = [
    "harmonium_core",
    "harmonium_audio",
    "harmonium_host",
    "harmonium_cli",
    "harmonium_lab",
    "harmonium_determinism",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
expect_used = "warn"
