[workspace]
members = [
    "harmonium_core",
    "harmonium_audio",
    "harmonium_host",
    "harmonium_cli",
    "harmonium_lab",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
expect_used = "warn"
