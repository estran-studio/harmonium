<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harmonium Studio</title>

    <!-- Le moteur, en wasm. L'initialiseur rapporte le téléchargement du wasm (étape 1 du chargement). -->
    <link data-trunk rel="rust" data-bin="harmonium_studio" data-initializer="initializer.js" />
    <!-- Manifeste et ressources à empreinte, générés par `make studio/assets` (étape 2 : écran egui). -->
    <link data-trunk rel="copy-dir" href="resources" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b1b;
        color: #d0d0d0;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #1b1b1b;
      }
      #boot progress {
        width: min(320px, 80vw);
      }
      #boot-error {
        color: #ff8f8f;
        max-width: 80vw;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="studio_canvas"></canvas>
    <div id="boot">
      <h1>Harmonium Studio</h1>
      <div id="boot-text">Loading the application…</div>
      <progress id="boot-bar"></progress>
      <div id="boot-error"></div>
    </div>
  </body>
</html>
