# Modifié par le projet Harmonium le 2026-10-30 :
# exemples et dépendances de développement retirés de la copie locale.

[package]
edition = "2021"
name = "oxisynth"
version = "0.1.0"
authors = ["Poly <marynczak.bartlomiej@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust soundfont synthesizer"
documentation = "https://docs.rs/oxisynth"
readme = false
keywords = [
    "audio",
    "soundfont",
]
license = "LGPL-2.1"
repository = "https://github.com/PolyMeilex/oxisynth"

[features]
i16-out = [
    "getrandom",
    "rand",
]
sf3 = ["lewton"]

[lib]
name = "oxisynth"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.4"

[dependencies.getrandom]
version = "0.3"
optional = true

[dependencies.lewton]
version = "0.10.2"
optional = true

[dependencies.log]
version = "0.4.14"

[dependencies.oxisynth-chorus]
version = "0.1.0"

[dependencies.oxisynth-reverb]
version = "0.1.0"

[dependencies.rand]
version = "0.9.1"
optional = true

[dependencies.soundfont]
version = "0.1.0"

