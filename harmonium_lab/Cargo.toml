[package]
name = "harmonium_lab"
version = "0.1.0"
edition = "2024"
description = "Musical DNA extraction, benchmarking, and profile rendering for Harmonium"
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "harmonium-lab"
path = "src/main.rs"

[dependencies]
harmonium_core = { path = "../harmonium_core" }
harmonium = { path = "../harmonium_host", default-features = false, features = ["standalone"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Progress & UX
indicatif = "0.17"

# File system
walkdir = "2.5"
zip = "9.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
