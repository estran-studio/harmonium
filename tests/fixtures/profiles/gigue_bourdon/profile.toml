# Fixture technique, non validée à l’écoute ; banques de la gigue québécoise.
[files]
cells = "cells.toml"
feet = "feet.toml"
dynamics = "dynamics.toml"

[meta]
id = "gigue_bourdon"
name = "Fixture technique gigue avec bourdon"
tradition = "Québec / Canada français, répertoire traditionnel de violon"
tags = ["gigue", "jig", "quebec", "violon", "podorythmie"]
corpus = "harmonium_lab: corpus 2026-10-19+764, 88 gigues; provenance dans le manifeste du labo"
aliases = ["gigue", "jig"]

[meter]
