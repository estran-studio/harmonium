[melody]
cell_units = 6
strong_units = [0, 3]
weak_units = [1, 2, 4, 5]
key_modes = [{ key = 2, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 4
weight_role_arp = 3
weight_role_turn = 3
max_continuity_step_distance = 2
continuity_max_retries = 16
melody_center_midi = 71
tonic_midi_min = 66
tonic_midi_max = 77
tessitura_min = 55
tessitura_max = 88
base_velocity = 94
strong_eighth_velocity_offset = 12
even_eighth_velocity_offset = -10

[harmony]
model = "loop"
steps_per_chord = 12
default_bars_per_chord = 2
[harmony.parts.A]
kind = "pedal"
degree = 1
[harmony.parts.B]
kind = "chord_loop"
chords = [{degree=1,quality="Major"}, {degree=4,quality="Major"}, {degree=5,quality="Major"}, {degree=1,quality="Major"}]

[accompaniment]
strong_steps = [0, 6]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 40
high = 50
walk_low = 38
walk_high = 52
hits = [
  { step = 0, degree = "root", duration = 4, velocity = 78 },
  { step = 6, degree = "root", duration = 4, velocity = 78 },
]

[accompaniment.chords]
center = 60
max_drift = 6
strings = 4
default_pattern = 1
patterns = [
  { hits = [{ step = 4, stroke = "down", duration = 1, velocity = 72 }] },
  { hits = [{ step = 4, stroke = "down", duration = 1, velocity = 72 }, { step = 10, stroke = "down", duration = 1, velocity = 72 }] },
  { hits = [{ step = 2, stroke = "down", duration = 1, velocity = 66 }, { step = 4, stroke = "down", duration = 1, velocity = 72 }, { step = 8, stroke = "down", duration = 1, velocity = 66 }, { step = 10, stroke = "down", duration = 1, velocity = 72 }] },
  { hits = [{ step = 0, stroke = "down", duration = 1, velocity = 72 }, { step = 2, stroke = "up", duration = 1, velocity = 54 }, { step = 4, stroke = "down", duration = 1, velocity = 72 }, { step = 6, stroke = "down", duration = 1, velocity = 72 }, { step = 8, stroke = "up", duration = 1, velocity = 54 }, { step = 10, stroke = "down", duration = 1, velocity = 72 }] },
]

[accompaniment.chords.strum]
down_gap_ms = 7.0
up_gap_ms = 5.0
up_strings = 3
gap_jitter = 0.3
anchor = 0.5
tempo_exponent = 0.0
ref_bpm = 172.5
max_spread_ratio = 0.4
velocity_slope = 4
velocity_jitter = 5

[instruments]
melody_program = 40
countermelody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0

[mix]
master_db = 12.5
[mix.room]
room_size = 0.38
damping = 0.58
width = 0.7
level = 0.28
[mix.eq]
highpass_hz = 40.0
presence_hz = 2800.0
presence_db = 1.3
presence_q = 0.8
[mix.tracks.Melody]
level_db = 0.0
pan = 0.04
reverb_send = 0.16
[mix.tracks.Chords]
level_db = -5.0
pan = -0.35
reverb_send = 0.22
[mix.tracks.Bass]
level_db = -8.0
pan = 0.0
reverb_send = 0.08
[mix.tracks.Heel]
level_db = -6.0
pan = -0.06
reverb_send = 0.1
[mix.tracks.Toe]
level_db = -6.0
pan = 0.06
reverb_send = 0.1

[arrangement]
tours_per_tune = 8
[arrangement.entries]
Melody = { tour = 1, part = 0, pass = 1 }
Chords = { tour = 1, part = 0, pass = 1 }
Bass = { tour = 1, part = 0, pass = 1 }
