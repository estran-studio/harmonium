# Phrases de batterie de deux mesures alignées sur la clave : les patterns de la mesure « trois »
# (claves aux pas 0, 6, 12) et de la mesure « deux » (pas 4, 8) d'une clave son ; `clave = "three"`
# fait commencer la phrase sur la mesure « trois » du cycle.
