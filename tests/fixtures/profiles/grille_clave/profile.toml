# Fixture technique clave 3-2 / 2-3 (4/4, 16 pas)
[files]
cells = "cells.toml"
percussion = "percussion.toml"
arrangement = "arrangement.toml"
dynamics = "dynamics.toml"
set = "set.toml"

[meta]
id = "grille_clave"
name = "Fixture technique clave 3-2 / 2-3 (4/4, 16 pas)"
tradition = "Exercice synthétique de contrat, non destiné à la distribution"
tags = ["test", "accompagnement", "grille", "clave", "latin"]
corpus = "Courbes de swing : Jazz Trio Database v0.2, MIT License, Copyright (c) Huw Cheston et al. (TISMIR 2024, https://doi.org/10.5334/tismir.186), régression robuste par piste, harmonium_lab references/jtd-swing-tempo/. Reste : valeurs d'exercice, aucune mesure de corpus."

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 110.0
min_bpm = 60.0
max_bpm = 285.0

[fixed_tonality]
key = 5
mode = "ionian"

[clave]
direction = "either"

[form]
sequence = [0]
[[form.parts]]
name = "Blues"
melody_center_offset = 0
phrase_ends = [12]
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 5, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4

[harmony.parts.Blues]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 0, quality = "7", steps = 16 },
  { semitones = 5, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 32 },
  { semitones = 5, quality = "7", steps = 32 },
  { semitones = 0, quality = "7", steps = 32 },
  { semitones = 2, quality = "m7", steps = 16 },
  { semitones = 7, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 8 },
  { semitones = 7, quality = "7", steps = 8 },
] }]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

[accompaniment.bass]
low = 36
high = 47
walk_low = 33
walk_high = 50
[[accompaniment.bass.templates]]
weight = 1
rhythm = [
  { step = 0, duration = 4, velocity = 80 },
  { step = 8, duration = 4, velocity = 76 },
]
cycle = [{ degree = "root" }, { degree = "fifth" }]
pickup = { lead = 2, duration = 2, velocity = 84, when = "bar_end" }

[accompaniment.chords]
center = 62
max_drift = 8
default_pattern = 0
voicing = "rootless"
low = 52
high = 76
patterns = [{ hits = [{ step = 0, direction = "block", duration = 3, velocity = 64 }, { step = 6, direction = "block", duration = 3, velocity = 60 }, { step = 12, direction = "block", duration = 3, velocity = 62 }] }]
comping = [
  { weight = 1, hits = [{ step = 0, duration = 3, velocity = 64 }, { step = 6, duration = 3, velocity = 60 }, { step = 12, duration = 3, velocity = 62 }] },
  { weight = 1, hits = [{ step = 4, duration = 3, velocity = 60 }, { step = 8, duration = 3, velocity = 60 }, { step = 14, duration = 2, velocity = 62, anticipate = true }] },
]


# Phrases de comping de deux mesures alignées sur la clave : « trois » d'abord (motifs 0 puis 1)
# ou « deux » d'abord (1 puis 0). Le sens de la clave est tiré une fois par air (`[clave]`).
[[accompaniment.chords.phrases]]
weight = 1
motifs = [0, 1]
clave = "three"

[[accompaniment.chords.phrases]]
weight = 1
motifs = [1, 0]
clave = "two"

[instruments]
melody_program = 0
chords_program = 0
bass_program = 32
percussion_bank = 128
percussion_program = 32

[ornaments]
rate_scale = 0.0

[mix]
master_db = 25.0
[mix.room]
room_size = 0.3
damping = 0.6
width = 0.6
level = 0.15
[mix.tracks.Melody]
level_db = 0.0
pan = 0.0
reverb_send = 0.0
[mix.tracks.Chords]
level_db = -14.0
pan = -0.25
reverb_send = 0.15
[mix.tracks.Bass]
level_db = -16.0
pan = 0.0
reverb_send = 0.05
[mix.tracks.PercussionLow]
level_db = -9.0
pan = 0.1
reverb_send = 0.1
[mix.tracks.PercussionHigh]
level_db = -9.0
pan = 0.1
reverb_send = 0.1
[mix.eq]
highpass_hz = 35.0
presence_hz = 3000.0
presence_db = 1.0
presence_q = 0.8
