# Source : cellules minées du corpus harmonium_lab (507 airs de reels québécois),
# extraction du 2026-10-19 (corpus 2026-10-19+764), top 30 par rôle : 180 cellules.
# `weight` = fréquence de la cellule au corpus ; le tirage d'un rôle est pondéré par ce poids.
# Fichier unique de vérité : pas de fichier de poids compagnon.
#
# Notation :
# - 1..7 : degrés de la gamme du mode dans l'octave principale (1 = tonique, ex. D en ré majeur)
# - 8..14 : degrés dans l'octave supérieure (8 = tonique + 1 octave, 10 = tierce supérieure, etc.)
# - k,   : degré k dans l'octave inférieure (5, = quinte grave, 7, = sensible/sous-tonique grave)
# - -    : prolongation de la note précédente
#
# Invariants D5 vérifiés au chargement (CellBank::from_toml) :
# - exactement 8 croches par cellule ;
# - la première croche n'est jamais "-" (Hold) ;
# - ambitus total de la cellule <= 1 octave (7 pas diatoniques / 12 demi-tons) ;
# - au plus 1 saut mélodique > quinte (> 4 pas diatoniques / > 7 demi-tons) par cellule ;
# - aucun chromatisme ;
# - `weight` entier > 0 (défaut 1 si absent).
#
# Cadences D4 : toutes les cellules `cad_half` / `cad_full` du corpus sont conservées, mais
# seules celles qui finissent comme le plan l'impose (m.4 sur 2, 5 ou 7 ; m.8 sur la tonique,
