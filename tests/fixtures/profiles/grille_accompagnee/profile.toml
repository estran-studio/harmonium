# Fixture technique synthétique de contrat (E5 + E6), sans validation d'écoute : deux grilles du
# modèle loop jouées par un comping sans fondamentale (voix conduites) et une marche de basse.
# Un blues de douze mesures avec un ii-V dans une mesure (fa), puis quatre mesures de ii-V-I avec
# changements à la noire (tensions, 7alt). Écriture relative à la tonique (fa par défaut) : les
# tests transposent par `[fixed_tonality]`. Grille harmonique : un créneau de quatre pas (une
# noire), donc chaque changement d'accord tombe sur une pulsation de la marche.
[files]
cells = "cells.toml"
dynamics = "dynamics.toml"

[meta]
id = "grille_accompagnee"
name = "Fixture technique grille accompagnée"
tradition = "Exercice synthétique de contrat, non destiné à la distribution"
tags = ["test"]
corpus = "Grilles synthétiques : blues de douze mesures et ii-V-I, aucune transcription"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 132.0
min_bpm = 100.0
max_bpm = 160.0

[fixed_tonality]
key = 5
mode = "ionian"

[form]
sequence = [0, 1]
[[form.parts]]
name = "Blues"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "ii-V-I"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 5, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4
# Blues en fa : F7 sur quatre mesures, Bb7 sur deux, F7 sur deux, ii-V dans la mesure 9 (Gm7 puis
# C7 à la blanche), Bb7, F7, puis F7 et C7 dans la dernière.
[harmony.parts.Blues]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 0, quality = "7", steps = 64 },
  { semitones = 5, quality = "7", steps = 32 },
  { semitones = 0, quality = "7", steps = 32 },
  { semitones = 2, quality = "m7", steps = 8 },
  { semitones = 7, quality = "7", steps = 8 },
  { semitones = 5, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 8 },
  { semitones = 7, quality = "7", steps = 8 },
] }]
# ii-V-I : Gm9 C7b9 | Fmaj7 | Gm7 C13 Fmaj9 (le ii-V tient en une noire chacun) | D7 G7 C7alt.
[harmony.parts.ii-V-I]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 2, quality = "m9", steps = 8 },
  { semitones = 7, quality = "7b9", steps = 8 },
  { semitones = 0, quality = "maj7", steps = 16 },
  { semitones = 2, quality = "m7", steps = 4 },
  { semitones = 7, quality = "13", steps = 4 },
  { semitones = 0, quality = "maj9", steps = 8 },
  { semitones = 9, quality = "7", steps = 8 },
  { semitones = 2, quality = "7", steps = 4 },
  { semitones = 7, quality = "7alt", steps = 4 },
] }]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Marche : une attaque par pulsation, arrivée sur la fondamentale à chaque changement d'accord,
# approche chromatique ou diatonique sur la pulsation qui précède.
[accompaniment.bass]
low = 36
high = 47
walk_low = 33
walk_high = 55
[accompaniment.bass.walking]
velocity = 76
accent = 8
duration = 4
max_leap = 5
toward_target_weight = 3
approach = { none_weight = 1, chromatic_weight = 4, diatonic_weight = 2 }
passing = { chord_tone_weight = 3, scale_step_weight = 3 }

# Comping sans fondamentale (types A et B choisis par la conduite de voix), dans la fenêtre
# 52..76. Quatre rythmes d'une mesure tirés par poids : deux avec une attaque anticipée sur la
# croche qui précède la mesure suivante, un silence.
[accompaniment.chords]
center = 62
max_drift = 8
default_pattern = 0
voicing = "rootless"
low = 52
high = 76
patterns = [{ hits = [{ step = 0, direction = "block", duration = 8, velocity = 62 }, { step = 8, direction = "block", duration = 8, velocity = 62 }] }]
comping = [
  { weight = 3, hits = [{ step = 0, duration = 6, velocity = 66 }, { step = 6, duration = 4, velocity = 58 }] },
  { weight = 2, hits = [{ step = 4, duration = 3, velocity = 60 }, { step = 10, duration = 3, velocity = 56 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  { weight = 2, hits = [{ step = 0, duration = 4, velocity = 62 }, { step = 8, duration = 4, velocity = 58 }, { step = 14, duration = 2, velocity = 60, anticipate = true }] },
  { weight = 1, hits = [] },
]

[percussion]
low_note = 36
high_note = 38
low_velocity = 55
high_velocity = 45
percussion_gain = 1.0
velocity_humanize = 0
patterns = [
  { density = 0, hits = [{ step = 0, track = "PercussionLow", delta_velocity = 0 }, { step = 8, track = "PercussionLow", delta_velocity = 0 }] },
  { density = 1, hits = [{ step = 0, track = "PercussionLow", delta_velocity = 0 }, { step = 4, track = "PercussionHigh", delta_velocity = 0 }, { step = 8, track = "PercussionLow", delta_velocity = 0 }, { step = 12, track = "PercussionHigh", delta_velocity = 0 }] },
  { density = 2, hits = [{ step = 0, track = "PercussionLow", delta_velocity = 0 }, { step = 4, track = "PercussionHigh", delta_velocity = 0 }, { step = 8, track = "PercussionLow", delta_velocity = 0 }, { step = 12, track = "PercussionHigh", delta_velocity = 0 }] },
]

[instruments]
melody_program = 65
chords_program = 4
bass_program = 32
percussion_bank = 128
percussion_program = 0

[arrangement]
tours_per_tune = 8
[arrangement.entries]
Melody = { tour = 1, part = 0, pass = 1 }
Chords = { tour = 1, part = 0, pass = 1 }
Bass = { tour = 1, part = 0, pass = 1 }
PercussionLow = { tour = 1, part = 0, pass = 1 }
PercussionHigh = { tour = 1, part = 0, pass = 1 }
[arrangement.intro]
forms = []
pickup_eighths = 0

[ornaments]
rate_scale = 0.0
