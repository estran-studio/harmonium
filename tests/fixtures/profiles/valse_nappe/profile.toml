 { key = 7, mode = "ionian", weight = 3 },
 { key = 9, mode = "ionian", weight = 2 },
 { key = 9, mode = "mixolydian", weight = 1 },
 { key = 2, mode = "mixolydian", weight = 1 },
]
[melody.params]
weight_role_run = 4
weight_role_arp = 3
weight_role_turn = 3
max_continuity_step_distance = 2
continuity_max_retries = 16
