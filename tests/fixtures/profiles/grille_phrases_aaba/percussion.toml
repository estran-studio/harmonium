# Fixture AABA : mêmes banques que `grille_phrases`, plus deux relances `chorus_end` (fin du
# chorus, qui l'emportent sur les relances `part_end` à cet endroit).
# Fixture technique des phrases sur plusieurs mesures (A1) : batterie de la fixture de l'arc (A3,
# copie de `wjazzd_swing`, E7), patterns étiquetés `ride` (les originaux) et `hat` (ajoutés),
# plus des phrases et une banque de relances (valeurs d'exercice, aucune mesure de corpus) ;
# origine des mesures des patterns : README du profil.
# Batterie du profil `wjazzd_swing` (E7) : GENÉRÉ par `python -m harmonium_lab.backing.engine_values
# --percussion` depuis `references/wjazzd-swing/measures-drums.json` (Groove MIDI Dataset v1.0.0,
# CC BY 4.0, Gillick et al., ICML 2019 : jazz et jazz/swing, 4/4, mesures `beat` et `fill`).
# Chaque pattern est construit sur les probabilités PAR PAS d'un groupe de mesures de même figure
# de ride ramenées à la grille 16 pas swinguée ; aucun n'est une mesure d'un enregistrement.
# Voix : ride (51) et charleston pédale (44), caisse claire (38), tom (43) sur PercussionHigh,
# grosse caisse (36) sur PercussionLow ; kit jazz de GeneralUser GS (banque 128, programme 32).
# Poids = effectif de mesures du groupe. Densité 0 : ride ; 1 : + pédale 2 et 4 ; 2 : + caisse
# claire (ghost notes) et grosse caisse. Les relances de fin de phrase (`[[fills]]`) remplacent le
# pattern de cadence de la fixture de l'arc.
low_note = 36
high_note = 51
low_velocity = 64
high_velocity = 64
percussion_gain = 1.0
velocity_humanize = 3
# Poids de « pas de relance » dans le tirage d'une fin de phrase.
fills_none_weight = 3

