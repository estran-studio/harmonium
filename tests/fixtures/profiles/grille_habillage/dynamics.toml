# Pilotage par les quatre émotions. Aucune mesure de corpus ne relie une émotion à un paramètre
# du jeu : les courbes sont des réglages de service, à juger à l'écoute (README du profil).
# Arousal : le tempo (± 20 BPM autour de 150), la vélocité et la densité de la batterie
# (0 : ride seul ; 1, neutre : ride + pédale ; 2 : + caisse claire et grosse caisse).
# Fixture de l'habillage : pas de `fixed_tonality` (la variante de session fixe la tonalité) ; les
# seuils de bascule parallèle sont écartés de la valence neutre (0,3) pour que le mode tiré ne
# bascule pas de lui-même.
neutral_valence = 0.3
valence_range = [-1.0, 1.0]
mode_shift_boundary = "part"
dark_below = 0.1
bright_above = 0.9
parallel_modes = [{ bright = "ionian", dark = "aeolian", weight = 1 }]
arousal_intensity = [[0.0, 0.0], [0.5, 0.5], [1.0, 1.0]]
tension_intensity = [[0.0, 0.0], [1.0, 0.0]]
tempo_offset = [[0.0, -20.0], [0.5, 0.0], [1.0, 20.0]]
melody_velocity = [[0.0, 1.0], [1.0, 1.0]]
# Fixture de l'arc : courbes de vélocité plus larges que celles de `wjazzd_swing` (0,85 à 1,1),
# pour que l'intensité de chaque chorus s'entende.
chords_velocity = [[0.0, 0.7], [0.5, 1.0], [1.0, 1.25]]
bass_velocity = [[0.0, 0.8], [0.5, 1.0], [1.0, 1.2]]
percussion_velocity = [[0.0, 0.7], [0.5, 1.0], [1.0, 1.3]]
percussion_intensity = [[0.0, -1.0], [0.5, 0.0], [1.0, 1.0]]
melody_duration = [[0.0, 1.0], [1.0, 1.0]]
strong_accent = [[0.0, 0.0], [1.0, 0.0]]
chords_intensity = [[0.0, 0.0], [1.0, 0.0]]
run_weight = [[0.0, 1.0], [1.0, 1.0]]
arp_weight = [[0.0, 1.0], [1.0, 1.0]]
turn_weight = [[0.0, 1.0], [1.0, 1.0]]
color_register = [[0.0, 0.0], [1.0, 0.0]]
brightness_accent = [[0.0, 0.0], [1.0, 0.0]]
# Fixture de l'arc : la densité rythmique (multipliée par l'arc) pilote la batterie de -1 à +1
# niveau de densité ; le profil `wjazzd_swing` a cette courbe à plat.
density_percussion = [[0.0, -1.0], [0.5, 0.0], [1.0, 1.0]]
density_chords = [[0.0, 0.0], [1.0, 0.0]]
density_tracks = []
tension_offbeat = [[0.0, 0.0], [1.0, 0.0]]
tension_duration = [[0.0, 1.0], [1.0, 1.0]]
tension_dominant = [[0.0, 0.0], [1.0, 0.0]]
tension_chord_duration = [[0.0, 1.0], [1.0, 1.0]]
color = [{ key = 5, mode = "ionian", weight = [[0.0, 1.0], [1.0, 1.0]] }]
