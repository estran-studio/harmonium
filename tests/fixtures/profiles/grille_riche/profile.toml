# Fixture technique synthétique de contrat (E1), sans validation d'écoute : la grille riche du
# modèle loop. Un blues de douze mesures en accords de septième (dont un ii-V dans une mesure),
# puis quatre mesures de cadence (accords slash, altérations, tensions). Écriture relative à la
# tonique : les tests transposent par `[fixed_tonality]`. Grille harmonique : un créneau de quatre pas (une noire).
[files]
cells = "cells.toml"
dynamics = "dynamics.toml"

[meta]
id = "grille_riche"
name = "Fixture technique grille riche"
tradition = "Exercice synthétique de contrat, non destiné à la distribution"
tags = ["test"]
corpus = "Grille synthétique : blues de douze mesures et cadence, aucune transcription"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.5
default_bpm = 120.0
min_bpm = 100.0
max_bpm = 140.0

[fixed_tonality]
key = 0
mode = "ionian"

[form]
sequence = [0, 1]
[[form.parts]]
name = "Blues"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free", "Free"]

[[form.parts]]
name = "Cadence"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "Free"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 0, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 3
weight_role_arp = 0
weight_role_turn = 0
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "loop"
steps_per_chord = 4
# Blues : F7 sur quatre mesures, Bb7 sur deux, F7 sur deux, ii-V dans la mesure 9, Bb7, F7,
# puis F7 et C7 dans la dernière (tonique = fa dans les tests ; ici symboles relatifs).
[harmony.parts.Blues]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 0, quality = "7", steps = 64 },
  { semitones = 5, quality = "7", steps = 32 },
  { semitones = 0, quality = "7", steps = 32 },
  { semitones = 2, quality = "m7", steps = 8 },
  { semitones = 7, quality = "7", steps = 8 },
  { semitones = 5, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 16 },
  { semitones = 0, quality = "7", steps = 8 },
  { semitones = 7, quality = "7", steps = 8 },
] }]
# Cadence en do : C/E, G7b9 ; Dm7b5, G7alt ; Cmaj9 ; D/C (basse hors de l'accord).
[harmony.parts.Cadence]
kind = "chord_loop"
loops = [{ weight = 1, chords = [
  { semitones = 0, quality = "", bass = 4, steps = 8 },
  { semitones = 7, quality = "7b9", steps = 8 },
  { semitones = 2, quality = "m7b5", steps = 8 },
  { semitones = 7, quality = "7alt", steps = 8 },
  { semitones = 0, quality = "maj9", steps = 16 },
  { semitones = 2, quality = "", bass = 0, steps = 16 },
] }]

[accompaniment]
strong_steps = [0, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]

# Fondamentale à chaque changement, quinte de la fondamentale au pas 4 et 12.
[accompaniment.bass]
low = 36
high = 59
hits = [
  { step = 0, degree = "root", duration = 3, velocity = 72 },
  { step = 4, degree = "fifth", duration = 3, velocity = 64 },
  { step = 8, degree = "root", duration = 3, velocity = 72 },
  { step = 12, degree = "fifth", duration = 3, velocity = 64 },
]

[accompaniment.chords]
center = 58
max_drift = 12
default_pattern = 0
patterns = [{ hits = [{ step = 0, direction = "block", duration = 8, velocity = 64 }, { step = 8, direction = "block", duration = 8, velocity = 64 }] }]

[percussion]
low_note = 36
high_note = 38
low_velocity = 55
high_velocity = 45
percussion_gain = 1.0
velocity_humanize = 0
patterns = [
  { density = 0, hits = [{ step = 0, track = "PercussionLow", delta_velocity = 0 }, { step = 8, track = "PercussionLow", delta_velocity = 0 }] },
  { density = 1, hits = [{ step = 0, track = "PercussionLow", delta_velocity = 0 }, { step = 4, track = "PercussionHigh", delta_velocity = 0 }, { step = 8, track = "PercussionLow", delta_velocity = 0 }, { step = 12, track = "PercussionHigh", delta_velocity = 0 }] },
  { density = 2, hits = [{ step = 0, track = "PercussionLow", delta_velocity = 0 }, { step = 4, track = "PercussionHigh", delta_velocity = 0 }, { step = 8, track = "PercussionLow", delta_velocity = 0 }, { step = 12, track = "PercussionHigh", delta_velocity = 0 }] },
]

[instruments]
melody_program = 40
chords_program = 81
bass_program = 32
percussion_bank = 128
percussion_program = 0

[arrangement]
tours_per_tune = 8
[arrangement.entries]
Melody = { tour = 1, part = 0, pass = 1 }
Chords = { tour = 1, part = 0, pass = 1 }
Bass = { tour = 1, part = 0, pass = 1 }
PercussionLow = { tour = 1, part = 0, pass = 1 }
PercussionHigh = { tour = 1, part = 0, pass = 1 }
[arrangement.intro]
forms = []
pickup_eighths = 0

[ornaments]
rate_scale = 0.0
