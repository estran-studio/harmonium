# Réemploi synthétique du mécanisme G3 dans la grille de valse_quebecoise.
# Les cellules et la marche de basse ci-dessous sont écrites pour le contrat.
[files]
cells = "cells.toml"
dynamics = "dynamics.toml"

[meta]
id = "valse_basse_motivique"
name = "Fixture valse à basse marchante"
tradition = "Valse québécoise, exercice synthétique non distribué"
tags = ["test"]
corpus = "Grille 3/4 de valse_quebecoise ; ostinato modal synthétique sur deux mesures"

[meter]
time_signature = { numerator = 3, denominator = 4 }
steps_per_bar = 12
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 3
default_swing_ratio = 0.5
default_bpm = 145.0
min_bpm = 140.0
max_bpm = 150.0

[form]
sequence = [0, 0, 1, 1]
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = ["Open", "Free", { CopyOf = 1 }, { CopyOf = 2 }]
[[form.parts]]
name = "B"
melody_center_offset = 2
roles = ["Open", "CadHalf", { CopyOfPart = { part = "A", bar = 1 } }, { CopyOfPart = { part = "A", bar = 2 } }]

[melody]
cell_units = 6
strong_units = [0, 2, 4]
weak_units = [1, 3, 5]
key_modes = [{ key = 2, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 1
weight_role_arp = 1
weight_role_turn = 1
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 71
tonic_midi_min = 62
tonic_midi_max = 74
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 0
even_eighth_velocity_offset = 0

[harmony]
model = "trad_functional"
steps_per_chord = 12
[[harmony.candidates]]
mode = "ionian"
chords = [{ degree = "I", quality = "Major" }, { degree = "IV", quality = "Major" }, { degree = "V", quality = "Major" }, { degree = "VI", quality = "Minor" }]
[[harmony.candidates]]
mode = "aeolian"
chords = [{ degree = "I", quality = "Minor" }, { degree = "IV", quality = "Minor" }, { degree = "V", quality = "Minor" }, { degree = "BVII", quality = "Major" }, { degree = "VI", quality = "Major" }]

[accompaniment]
strong_steps = [0, 4, 8]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]
[accompaniment.bass]
low = 38
high = 49
# Marche 1–2–3, puis 5–4–2, sur deux mesures ; degrés modaux.
[[accompaniment.bass.motifs]]
bars = 2
notes = [
 { step = 0, duration = 4, degree = 1, velocity = 78 },
 { step = 4, duration = 4, degree = 2, velocity = 70 },
 { step = 8, duration = 4, degree = 3, velocity = 72 },
 { step = 12, duration = 4, degree = 5, velocity = 78 },
 { step = 16, duration = 4, degree = 4, velocity = 70 },
 { step = 20, duration = 4, degree = 2, velocity = 72 },
]
[accompaniment.chords]
center = 60
max_drift = 6
default_pattern = 0
patterns = [{ hits = [{ step = 4, duration = 2, velocity = 66 }, { step = 8, duration = 2, velocity = 66 }] }]

[percussion]
heel_note = 51
toe_note = 42
heel_velocity = 55
toe_velocity = 45
feet_gain = 1.0
velocity_humanize = 0
patterns = [
 { density = 0, euclid = { pulses = 1, steps = 12, rotation = 0 } },
 { density = 1, euclid = { pulses = 3, steps = 12, rotation = 0 } },
 { density = 2, euclid = { pulses = 6, steps = 12, rotation = 0 } },
]

[instruments]
melody_program = 40
chords_program = 24
bass_program = 32
percussion_bank = 128
percussion_program = 0

[arrangement]
tours_per_tune = 2
[arrangement.entries]
Melody = { tour = 1, part = 0, pass = 1 }
Chords = { tour = 1, part = 0, pass = 1 }
Bass = { tour = 1, part = 0, pass = 1 }
Heel = { tour = 1, part = 0, pass = 1 }
Toe = { tour = 1, part = 0, pass = 1 }
[arrangement.intro]
forms = []
pickup_eighths = 0
