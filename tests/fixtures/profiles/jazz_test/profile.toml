# Preuve technique uniquement : aucune prétention de style ni corpus jazz.
[files]
cells = "cells.toml"
dynamics = "dynamics.toml"

[meta]
id = "jazz_test"
name = "Fixture jazz fonctionnel"
tradition = "Exercice synthétique de contrat, non destiné à la distribution"
tags = ["test"]
corpus = "Aucun corpus : cellules synthétiques écrites pour les tests"

[meter]
time_signature = { numerator = 4, denominator = 4 }
steps_per_bar = 16
steps_per_unit = 2
steps_per_pulse = 4
pulses_per_bar = 4
default_swing_ratio = 0.6666667
default_bpm = 120.0
min_bpm = 80.0
max_bpm = 180.0

[form]
sequence = [0, 0, 1, 0] # AABA, quatre parties de huit mesures.
[[form.parts]]
name = "A"
melody_center_offset = 0
roles = ["Open", "Free", "Free", "CadHalf", "Free", "Free", "Free", "CadFull"]
[[form.parts]]
name = "B"
melody_center_offset = 2
roles = ["Open", "Free", "Free", "CadHalf", "Free", "Free", "Free", "CadFull"]

[melody]
cell_units = 8
strong_units = [0, 2, 4, 6]
weak_units = [1, 3, 5, 7]
key_modes = [{ key = 0, mode = "ionian", weight = 1 }]
[melody.params]
weight_role_run = 1
weight_role_arp = 1
weight_role_turn = 1
max_continuity_step_distance = 2
continuity_max_retries = 8
melody_center_midi = 72
tonic_midi_min = 60
tonic_midi_max = 72
tessitura_min = 55
tessitura_max = 88
base_velocity = 80
strong_eighth_velocity_offset = 8
even_eighth_velocity_offset = -6

[harmony]
model = "jazz_functional"
steps_per_chord = 16
max_recursion = 2
scale_guidance = true
# Expansions de tonique et back-cycling ; les poids contrôlent le tirage.
[[harmony.rules]]
lhs = "I"
rhs = ["II", "V", "I"]
weight = 4.0
min_valence = -1.0
max_valence = 1.0
category = "Cadential"
max_recursion = 0
[[harmony.rules]]
lhs = "I"
rhs = ["VI", "II", "V", "I"]
weight = 2.0
min_valence = -1.0
max_valence = 1.0
category = "BackCycle"
max_recursion = 1
[[harmony.rules]]
lhs = "I"
rhs = ["VofII", "II", "V", "I"]
weight = 1.0
min_valence = -1.0
max_valence = 1.0
category = "Preparation"
max_recursion = 0
[[harmony.rules]]
lhs = "I"
rhs = ["IV", "II", "V", "I"]
weight = 1.0
min_valence = -1.0
max_valence = 1.0
category = "Cadential"
max_recursion = 0

[accompaniment]
strong_steps = [0, 4, 8, 12]
strong_weight = 2
weak_weight = 1
tie_priority = ["I", "V", "IV"]
bass_steps = [0, 4, 8, 12]
bass_duration_steps = 3
bass_velocity = 72
bass_low = 36
bass_high = 59
chop_steps = [4, 12]
chop_duration_steps = 2
chop_velocity = 64
guitar_center = 60
guitar_max_drift = 6

[percussion]
heel_note = 51
toe_note = 42
heel_velocity = 55
toe_velocity = 45
feet_gain = 1.0
velocity_humanize = 0
patterns = [
 { density = 0, euclid = { pulses = 2, steps = 16, rotation = 1 } },
 { density = 1, euclid = { pulses = 4, steps = 16, rotation = 1 } },
 { density = 2, euclid = { pulses = 8, steps = 16, rotation = 1 } },
]

[instruments]
melody_program = 65
chords_program = 0
bass_program = 32
percussion_bank = 128
percussion_program = 0

[arrangement]
tours_per_tune = 1
intro_each_tune = false
[arrangement.entries]
Melody = { tour = 1, part = 0, pass = 1 }
Chords = { tour = 1, part = 0, pass = 1 }
Bass = { tour = 1, part = 0, pass = 1 }
Heel = { tour = 1, part = 0, pass = 1 }
Toe = { tour = 1, part = 0, pass = 1 }
[arrangement.intro]
forms = []
pickup_eighths = 0
each_tune = false
