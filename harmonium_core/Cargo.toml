[package]
name = "harmonium_core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
rust-music-theory = "0.3.0"
midly = "0.5.3"
arrayvec = { version = "0.7", features = ["serde"] }
serde-big-array = "0.5"
rtrb = "0.3"
serde_json = "1.0"
toml = "0.8"
# Unification de features, même pattern que harmonium_host : rand 0.8 ->
# getrandom 0.2 exige la feature "js" pour compiler sous
# wasm32-unknown-unknown (principe III de la constitution — le core est
# wasm de première classe). L'alias n'ajoute aucun crate au graphe :
# getrandom y est déjà via rand, et la feature "js" est inerte en natif.
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
