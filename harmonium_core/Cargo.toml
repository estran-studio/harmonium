[package]
name = "harmonium_core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
rust-music-theory = "0.3.0"
midly = "0.5.3"
arrayvec = { version = "0.7", features = ["serde"] }
serde-big-array = "0.5"
toml = "0.8"
serde_path_to_error = "0.1"

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
toml = "0.8"
