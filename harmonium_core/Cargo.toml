[package]
name = "harmonium_core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
midly = "0.5.3"
arrayvec = { version = "0.7", features = ["serde"] }
toml = "0.8"
serde_path_to_error = "0.1"
toml_edit = "0.22.27"

# Navigateur : `getrandom` (tiré par `rand`) n'a pas de source de hasard en
# wasm32-unknown-unknown sans sa feature `js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
toml = "0.8"
